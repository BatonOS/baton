# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0

info:
  title: MailLoop BATON Control API
  version: v1alpha1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The control plane API.

    **Three authentication faces share port 8443**, separated by what client
    certificate the TLS handshake requires:

    | Face | Client cert | Paths |
    |---|---|---|
    | Enrollment | none | `/enroll` |
    | Node | node cert (SAN role `agent` or `standby`) | `/agent/*`, `/ha/*` |
    | Admin | admin cert | everything else |

    Separating them at the TLS layer rather than in a middleware means an
    unauthenticated request to an admin path never reaches application code.

    **Identity** is carried in the certificate SAN URI, of the form
    `baton://<tenant>/node/<node_id>/role/<role>`. It binds to the immutable
    node id, never to a hostname.

    **Errors** all share one shape (see `Error`), and every error carries a
    `remediation` string. An error a user cannot act on is a defect.

servers:
  - url: https://127.0.0.1:8443/api/v1alpha1
    description: Local control plane

tags:
  - name: enrollment
    description: Bootstrapping a node into the network
  - name: nodes
    description: The node directory
  - name: capabilities
    description: What each node can do
  - name: calls
    description: Invoking a capability
  - name: events
    description: The append-only audit and system log
  - name: console
    description: Audited node management
  - name: takeover
    description: Exclusive interactive control of a node's runtime
  - name: system
    description: Liveness, readiness, and what this build is
  - name: core
    description: |
      The new governance and execution chain, built as a separate chain rather
      than a rework of the older `/calls` path. Both answer on this control
      plane side by side; everything of the new chain lives under `/core/`.

paths:
  /enroll:
    post:
      tags: [enrollment]
      summary: Redeem an enrollment token for a client certificate
      description: |
        The only unauthenticated endpoint. The node has generated a private key
        it will never transmit and sends a CSR; the control plane validates the
        one-time token and returns a short-lived certificate.

        A token that has expired, been used up, been revoked, or was issued for
        a different role is rejected with `401`. The distinction between those
        cases is in `code`, because "enrollment failed" with no reason is the
        difference between a two-minute fix and an afternoon.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /agent/certificate/renew:
    post:
      tags: [enrollment]
      summary: Rotate this node's certificate
      description: |
        Called by a node whose certificate is inside the last third of its
        lifetime, over its existing authenticated connection. A revoked node
        receives `403` and must not retry.
      security: [{ nodeCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              properties:
                csr_pem: { type: string }
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema:
                type: object
                required: [certificate_pem, not_after]
                properties:
                  certificate_pem: { type: string }
                  not_after: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/Forbidden'

  /agent/channel:
    get:
      tags: [enrollment]
      summary: Open the node channel (WebSocket upgrade)
      description: |
        Upgrades to the long-lived frame protocol documented in
        `ws-protocol.md`. Not a REST endpoint; described here so the surface is
        complete in one place.
      security: [{ nodeCert: [] }]
      responses:
        '101': { description: Switching protocols }
        '403':
          $ref: '#/components/responses/Forbidden'

  /ha/snapshot:
    get:
      tags: [system]
      summary: Pull a consistent snapshot of control-plane state
      description: |
        Standby mirrors only. Returns a consistent copy of the database with
        its digest in `X-Baton-Snapshot-Sha256`, so the receiver verifies
        before it replaces anything.
      security: [{ nodeCert: [] }]
      responses:
        '200':
          description: Snapshot stream
          headers:
            X-Baton-Snapshot-Sha256:
              schema: { type: string }
              description: SHA-256 of the body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/Forbidden'

  /ha/ca-bundle:
    post:
      tags: [system]
      summary: Hand the CA signing key to the gaining node of a master transfer
      description: |
        The one way the network's CA signing material leaves a control plane:
        it moves only during a planned master transfer, to the node the signed
        offer names. Gated three ways: node mTLS, a master-transfer offer
        signed by this network that names the CALLER as the gaining node, and
        unexpired. Only a primary (which holds the key) serves it; a mirror
        answers 409. The gaining node installs the material so it can issue
        certificates after promotion.
      security: [{ nodeCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, payload, signature]
              properties:
                public_key: { type: string }
                payload: { type: string, description: base64 canonical offer bytes }
                signature: { type: string, description: "ed25519:... over payload" }
      responses:
        '200':
          description: The CA signing material (PEM)
          content:
            application/json:
              schema:
                type: object
                properties:
                  root_crt: { type: string }
                  root_key: { type: string }
                  intermediate_crt: { type: string }
                  intermediate_key: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A mirror has no key to hand over, or the offer names a different network/node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The offer has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /public/resources:
    get:
      tags: [network]
      summary: This network's public resources, anonymous read
      description: |
        Unauthenticated. Serves ONLY resources published `--scope public`; a
        network or private resource is 404 here, indistinguishable from a
        nonexistent one. The fetcher verifies the hash itself.
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: List, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }
  /public/resources/{id}:
    get:
      tags: [network]
      summary: One public resource, anonymous read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: The resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '404': { description: Not public or not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /network:
    get:
      tags: [network]
      summary: This network's signed descriptor
      description: |
        Unauthenticated, and answered **only once the operator has published**
        an endpoint (`POST /networks/self/endpoints`); before that
        `NETWORK_NOT_PUBLISHED` (404), so a port scan is not an inventory. What
        a resolver's candidate entry point serves and an applicant verifies:
        `record.signature` is the network key's signature over the exact bytes
        in `record.payload` (canonical: `network-descriptor\n<network_id>\n<fingerprint>\n<endpoints sorted>\n<issued>\n<expires>`).
        A candidate whose descriptor does not verify, or whose fingerprint is
        not the one that named the network, is not that network: trust rests
        on the signature, not on whichever server returned the descriptor.
      responses:
        '200':
          description: The descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkDescriptor' }
        '404':
          description: Not published (`NETWORK_NOT_PUBLISHED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/endpoints:
    post:
      tags: [network]
      summary: Publish where this network answers (`baton network publish`)
      description: The operator's explicit act that makes the network findable. Adds one endpoint (or replaces all with replace=true); the first one turns on `GET /network`.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, description: "https://host:port" }
                priority: { type: integer, default: 0 }
                replace: { type: boolean, default: false, description: "make this the network's SOLE endpoint (removes prior ones) — the transfer-master case, so a moved control plane does not keep the old host's inherited endpoint" }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  network_id: { type: string }
                  fingerprint: { type: string }
                  endpoint:
                    type: object
                    properties:
                      address: { type: string }
                      port: { type: integer }
                      protocol: { type: string }
                      priority: { type: integer }

  /join-requests:
    post:
      tags: [enrollment]
      summary: Apply to join this network
      description: |
        Unauthenticated: the applicant has no identity here yet. It says which
        agent it is and shows the public key of the node it holds. Nothing else
        is accepted, and the face is rate-limited per source address. One open
        application per name; a second is refused with the open one's id.

        This is not a credential and does not become one until the master
        admits it (`POST /join-requests/{agent}/admit`) and the applicant
        collects — once — the token minted for it, bound to this name and this
        key. `RATE_LIMITED` (429) when the allowance is exceeded.

        `ADMISSION_CLOSED` (403) when the network's door is shut, which refuses
        only new applications: queued applications, enrollment of
        already-admitted nodes and existing members are unaffected.
        That is a policy answer, not a routing one: the address was right and
        the network answered — it is simply not taking applications. It is
        deliberately not a 404, which would send the applicant to check an
        address, a DNS record and a port that are all fine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, node_public_key_pem]
              properties:
                agent:
                  type: string
                  description: The agent's name; the same rule as a node name.
                node_public_key_pem:
                  type: string
                  description: SPKI PEM of the applying node's key. The private key never leaves the node.
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '403':
          description: This network is not accepting applications (`ADMISSION_CLOSED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An application by this name is already pending (`JOIN_REQUEST_STATE`; details carry its id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid name or key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many applications from this address (`RATE_LIMITED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [enrollment]
      summary: List applications to join (admin)
      security: [{ adminCert: [] }]
      parameters:
        - in: query
          name: state
          schema: { $ref: '#/components/schemas/JoinRequestState' }
          description: |
            Filter; absent means all — and "all" is unbounded and grows
            forever, so a caller that wants what is WAITING should ask for
            `pending` rather than filter client-side. `baton network requests`
            defaults to `pending` for that reason.
      responses:
        '200':
          description: Applications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/JoinRequest' }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: |
                      How many applications are in each state, over ALL of them
                      and regardless of `state`.

                      It travels with every list so that a filtered answer can
                      say what it is not showing. An empty `items` is otherwise
                      ambiguous between "nobody is waiting" and "nobody has
                      ever applied", and those need opposite next actions. A
                      state with none is absent from the map rather than
                      present as 0.

  /join-requests/{request_id}:
    get:
      tags: [enrollment]
      summary: Read an application's state (the applicant polls this)
      description: |
        Unauthenticated; the id is the handle and is not guessable. Answers the
        state and nothing more — a read never mints. `JOIN_REQUEST_NOT_FOUND`
        (404) for an unknown id.
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '404':
          description: No such application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /join-requests/{request_id}/collect:
    post:
      tags: [enrollment]
      summary: Collect the one token minted for an admitted application
      description: |
        Unauthenticated. `admitted → collected` is a conditional update, so two
        collects have one winner and one token. The token is minted at this
        moment, returned once, stored hashed, bound to the application's name
        (`^name$`) and key (`bound_key_fingerprint`), one use, fifteen minutes.
        Any other state is `JOIN_REQUEST_STATE` (409).
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The token, once
          content:
            application/json:
              schema:
                type: object
                required: [request_id, state, token, expires_at]
                properties:
                  request_id: { type: string }
                  state: { type: string, enum: [collected] }
                  token: { type: string, description: Plaintext, shown once. }
                  expires_at: { type: string, format: date-time }
        '404':
          description: No such application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Not admitted, or already collected (`JOIN_REQUEST_STATE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /join-requests/{agent}/admit:
    post:
      tags: [enrollment]
      summary: Admit the pending application by this name (`baton network add --agent`)
      description: |
        Admin. By NAME, and only a pending application can be admitted: with
        none pending the answer is `JOIN_REQUEST_NOT_FOUND` (404) — an admission
        answers an application, it does not mint a free-floating credential.
        The audit record carries the applicant's key fingerprint.
      security: [{ adminCert: [] }]
      parameters:
        - in: path
          name: agent
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Admitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '404':
          description: Nobody by that name has applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /join-requests/{agent}/deny:
    post:
      tags: [enrollment]
      summary: Deny the pending application by this name (`baton network deny --agent`)
      security: [{ adminCert: [] }]
      parameters:
        - in: path
          name: agent
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '404':
          description: Nobody by that name has applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operators/enroll:
    post:
      tags: [enrollment]
      summary: Redeem a one-time invitation code for an operator certificate
      description: |
        **This route and `/enroll` are both unauthenticated writes, and they are
        not the same size.**

            /enroll  compromised  →  a RoleAgentService identity, which
                                     satisfies no admin requirement at all
                                     (peer.go:57)
            here     compromised  →  an unconditional super-admin certificate
                                     (peer.go:60-84)

        Said first, and in a box, because the two sit next to each other in
        every path listing and a reader scanning that listing never reaches the
        paragraphs below. Adding this route does not add one more hole to that
        face — it changes the payout on every weakness that face already has.

        It is unauthenticated because the machine redeeming the code has no
        credential yet — that is the problem this endpoint exists to solve. What
        holds it up is the code itself: minted by a super-admin, single-use,
        short-lived, and bound to one name. The CSR proves possession of a
        private key that never leaves the caller.

        The caller cannot verify this server before it has the CA bundle, so the
        first contact is pinned out of band by CA fingerprint. That defeats an
        automated attacker in the middle and does not defeat a person who skips
        the comparison.

        Refusals before the code is spent: read-only mirror, rate limit, clock
        skew, malformed name, missing CSR, and a name the invitation was not
        issued for. Each of those says the code has not been spent, because the
        alternative is a second attempt failing with TOKEN_EXHAUSTED — a message
        about something that was never the problem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, csr_pem]
              properties:
                name:
                  type: string
                  description: |
                    The operator name the invitation was minted for. Becomes the
                    certificate CN, the SAN path segment, and the actor in every
                    audit record this person writes.
                code:
                  type: string
                  description: The one-time invitation code, delivered out of band.
                csr_pem:
                  type: string
                  description: |
                    PEM CERTIFICATE REQUEST. Only its public key is read; the
                    subject is overwritten by the CA. The private key must never
                    appear in this request.
                client_ts: { type: string, format: date-time }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [name, certificate_pem, ca_bundle_pem, cert_not_after, serial]
                properties:
                  name: { type: string }
                  certificate_pem: { type: string }
                  ca_bundle_pem: { type: string }
                  cert_not_after: { type: string, format: date-time }
                  serial: { type: string }
        '401':
          description: The invitation was not issued for that name, or the code is not usable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: This control plane is a read-only mirror
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Clock skew, malformed name, or an unusable CSR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts from this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operators/invitations:
    post:
      tags: [enrollment]
      summary: Mint a one-time code that redeems into an operator certificate
      description: |
        The plaintext code is returned **once, here**; only its hash is stored.

        Its TTL defaults to 15m and is capped at 1h rather than the 24h an
        enrollment token allows, because what it redeems into is
        unconditionally super-admin: an operator certificate carries full
        super-admin rights, with no lesser tier.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    The person, not the machine — it is what the audit log shows
                    for everything they do.
                ttl:
                  type: string
                  default: 15m
                  description: Go duration, at most 1h.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [name, code, expires_at, token_id, ca_fingerprint]
                properties:
                  name: { type: string }
                  code:
                    type: string
                    description: Plaintext. Shown once. Deliver it out of band.
                  expires_at: { type: string, format: date-time }
                  token_id: { type: string }
                  ca_fingerprint:
                    type: string
                    description: |
                      `SHA256:XX:…` of this network's root CA. Travels with the
                      code: the remote machine cannot verify this control plane
                      before it has the bundle, so the pin is the only defence
                      at first contact — and a pin nobody can look up is a pin
                      nobody uses.
        '422':
          description: Unusable name or TTL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operators:
    get:
      tags: [enrollment]
      summary: List the operator certificates this control plane has issued
      description: |
        **Certificates issued, not people who can log in.** A certificate cannot
        say how many copies of its private key exist, so this answers what was
        handed out, to whom, and whether any of it is revoked — and nothing
        about who holds what right now.

        Revoked certificates stay listed. A listing that hid them could not be
        used to check that a revoked person has nothing live left.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Operator certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  operators:
                    type: array
                    items:
                      type: object
                      properties:
                        serial: { type: string }
                        name: { type: string }
                        fingerprint_sha256: { type: string }
                        issued_at: { type: string, format: date-time }
                        not_after: { type: string, format: date-time }
                        issued_by: { type: string }
                        from_ip: { type: string }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        revoke_reason: { type: string }

  /operators/{name}/revoke:
    post:
      tags: [enrollment]
      summary: Revoke every live certificate an operator name holds
      description: |
        Every live one, not one of them: the question being asked is "stop this
        person", and answering it for a single serial would leave the others
        working while the command reported success.

        Both halves happen — the store row, so it survives a restart, and the
        CA's in-memory blocklist, so it is true for the next handshake. Go's TLS
        stack checks no CRL, which is why the second is not an optimisation:
        the blocklist is updated before this call responds, so revocation holds
        from the very next handshake.

        A name that never enrolled is a 404, not a zero-count success: "nothing
        to revoke" and "you typed the wrong name" are different facts and only
        one of them means the person is stopped.
      security: [{ adminCert: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [name, revoked, serials]
                properties:
                  name: { type: string }
                  revoked:
                    type: integer
                    description: How many certificates were live and are now revoked.
                  serials:
                    type: array
                    items: { type: string }
        '403':
          description: This control plane is a read-only mirror
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No operator by that name has ever enrolled here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tokens:
    post:
      tags: [enrollment]
      summary: Create a one-time enrollment token
      description: |
        The plaintext token is returned **once, here**, and is never
        recoverable afterwards — only its hash is stored. Listing tokens shows
        metadata only.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
                ttl:
                  type: string
                  default: 15m
                  description: Go duration; the default is short on purpose.
                max_uses: { type: integer, minimum: 1, default: 1 }
                name_pattern:
                  type: string
                  description: Optional regexp constraining the node name this token may claim.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token_id, token, expires_at]
                properties:
                  token_id: { type: string }
                  token:
                    type: string
                    description: Plaintext. Shown once. Write it to a 0600 file.
                  expires_at: { type: string, format: date-time }
    get:
      tags: [enrollment]
      summary: List enrollment tokens (metadata only)
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TokenInfo' }

  /tokens/{token_id}:
    delete:
      tags: [enrollment]
      summary: Revoke an enrollment token
      security: [{ adminCert: [] }]
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes:
    get:
      tags: [nodes]
      summary: List nodes
      security: [{ adminCert: [] }]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/NodeStatus' } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }
                  next_cursor: { type: string }

  /nodes/{node_id}:
    get:
      tags: [nodes]
      summary: Node detail with certificate, capabilities, and recent events
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/avatar:
    post:
      tags: [nodes]
      summary: Set or clear an agent node's avatar
      description: |
        Two images the panel supplies: `full` and a `thumb` it made with canvas
        (≤256px) — BATON adds no image library. Empty `full_base64` clears. The
        thumb is what a status row carries; the full is at GET here. Display
        metadata: the node's identity does not change.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, full_base64]
              properties:
                content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
                full_base64: { type: string, description: base64 full image; empty clears }
                thumb_base64: { type: string, description: base64 thumbnail (browser-made); defaults to full when omitted }
      responses:
        '200':
          description: Stored or cleared
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Unsupported type, bad base64, or too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [nodes]
      summary: An agent node's full avatar and thumbnail
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The images
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar: { type: object, properties: { content_type: { type: string }, data_base64: { type: string } } }
                  avatar_thumb: { type: object, properties: { content_type: { type: string }, data_base64: { type: string } } }
        '404':
          description: No avatar set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /nodes/{node_id}/label:
    post:
      tags: [nodes]
      summary: Set a node's editable one-line label (the agent-settings field)
      description: |
        The single editable field of an agent's settings. NOT the agent's
        @name (its network address — a route identity that follows the agent
        between nodes, not a machine account; inbox, binding, certificate SAN —
        not edited here) and NOT the enrolment key=value labels (`driver=`/`host=`,
        not a person's to hand-edit). An empty string clears it.
      security: [{ adminCert: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The node's new label
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  display_name: { type: string }
                  label: { type: string }
        '400':
          description: Label too long
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{node_id}/revoke:
    post:
      tags: [nodes]
      summary: Revoke a node
      description: |
        Terminal and immediate: the certificate serial enters the in-memory
        blocklist consulted during the TLS handshake, the live connection is
        closed, and the node refuses to re-enroll on restart.

        Go's TLS stack does not consult CRLs, so revocation is exactly as
        immediate as that blocklist — which is why it is updated before the
        response returns rather than on a refresh interval.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '202': { description: Revocation accepted and in effect }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/suspend:
    post:
      tags: [nodes]
      summary: Suspend a member node
      description: |
        Pause a member without removing it: a stored, reversible decision, not
        a revocation. The node is refused the
        control channel and the rest of the node face, and its live connection
        is closed before this call returns — so "disconnected" is true when the
        caller sees the answer, not at the node's next reconnect.

        **What this does not do is the design.** The certificate is not
        revoked, the display name is not released, `status` is not touched
        (that field is liveness — what was observed — and this is a decision),
        the runtime on the node's own host keeps running, and the node stays
        in the member list carrying the fact that it is suspended.

        `/cert/renew` stays open to a suspended node. A suspension that ran
        until the certificate expired would turn a reversible act into
        revocation by the passage of time.

        Nothing is pushed to the node. A revoked node is told to stop trying; a
        suspended one must keep trying, which is what makes `resume` enough on
        its own. Its reconnect backs off to a minute and collects
        `NODE_SUSPENDED` each time.

        Requires the operator role, where revoke requires super-admin: this one
        is reversible and touches no trust material.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The node's state after the call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSuspension' }
        '409':
          description: The node is revoked, so there is nothing to pause
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/resume:
    post:
      tags: [nodes]
      summary: Resume a suspended member node
      description: |
        The inverse of `/suspend`. Suspension is a stored state, so lifting it
        simply lets the node's next reconnect in; nothing is pushed to it, so how quickly it returns is its own
        backoff, not this call's.

        `status` is unchanged by this call and stays whatever was last
        observed — a resumed node reads `offline` until it actually comes back,
        and reporting anything else here would be claiming a liveness fact from
        a decision.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The node's state after the call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSuspension' }
        '409':
          description: The node is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages:
    post:
      tags: [messages]
      summary: Send a message to an agent identity
      description: |
        Addressed by **identity**, never by node: the recipient is resolved to
        whichever node it is bound to at delivery time, so a message sent before
        a migration and delivered after it still arrives.

        **Acceptance is not delivery.** `202` means the message is stored and
        addressed to something that exists. The recipient may be busy,
        restarting, migrating or not currently placed — all normal states for an
        agent — and `delivered: false` reports that plainly rather than leaving
        a sender to infer a failure from a state string.

        `body` is opaque. Nothing in the control plane parses it, branches on
        it, logs it, or writes it into a snapshot or an audit body. The audit record for this call carries the id, the
        addresses and the size — never the content.

        **Idempotent on `message_id`.** Supply the id of the send you
        are retrying and the same message comes back with `duplicate: true`;
        nothing is stored twice, re-delivered or re-audited. Omit it and one is
        minted — a caller that never retries is not made to invent a UUID.

        A `message_id` that already belongs to **another sender** is `409`
        `MESSAGE_ID_TAKEN`, and nothing about the stored message is disclosed.
        The naive dedupe — same id, return what is stored — would hand any
        message's envelope to anyone who can guess or observe its id, and ids
        appear in acks, in logs and in every listing.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessage' }
      responses:
        '202':
          description: Accepted for delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/MessageEnvelope' }
                  delivered:
                    type: boolean
                    description: |
                      Whether the envelope reached the recipient's node during
                      this call. Stated positively and present on every answer:
                      `false` is a normal outcome — the recipient may be busy,
                      restarting, migrating or not currently placed — and a
                      sender must not read it as a failure.
                  route:
                    type: string
                    enum: [unplaced, offline, connected]
                    description: |
                      What existed to deliver TO at the moment of this answer —
                      a different question from whether delivery happened.

                      `delivered: false` was carrying three situations at once,
                      and the description above lists them in one breath. A
                      sender cannot act on a difference it cannot see: retrying
                      helps `offline`, and nothing but a person helps
                      `unplaced`.

                      * `unplaced`  — no node holds this identity right now.
                      * `offline`   — a node holds it and has no live channel.
                      * `connected` — a node holds it and is connected; if
                        `delivered` is still false, somebody was there and did
                        not take it.

                      **Every value is an observation at this instant, and none
                      is a prediction.** `unplaced` does not mean the address is
                      undeliverable: a bind a second later makes it `offline`,
                      and a control plane running with an agent role makes its
                      own identity `connected`. A verdict about the address
                      would be wrong as soon as a client cached it.
                  duplicate:
                    type: boolean
                    description: |
                      True when this `message_id` had already been accepted, so
                      this request stored nothing. Present on both paths rather
                      than only when true — a field that appears only in the
                      unusual case is one clients read as absent-means-nothing,
                      and then miss the day it matters.
        '409':
          description: '`MESSAGE_ID_TAKEN` — that id belongs to another sender.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '404':
          description: |
            No agent is registered under that name. Distinct from an unbound
            identity, which is a `202` with `delivered: false` — "nobody by that
            name" and "known, currently unreachable" need different answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: The body is larger than the channel carries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    get:
      tags: [messages]
      summary: List message envelopes
      description: |
        Envelopes only. There is deliberately no mode that returns bodies:
        reading a message is the recipient's act, not an operator's.
      security: [{ adminCert: [] }]
      parameters:
        - name: to
          in: query
          description: |
            Whose mailbox. A name nobody is registered under is refused with
            404 `IDENTITY_NOT_FOUND` — **not** an empty list. An agent that
            exists and has no mail is the empty list, and the two need
            opposite next steps: wait, or fix the name.
          schema: { type: string }
        - name: limit
          in: query
          description: |
            Page size, 1–1000; default 100. Out of range or non-numeric is
            refused with 400 — not clamped, because a clamped value answers a
            different question than the one asked.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: state
          in: query
          schema: { type: string, enum: [unread, read] }
        - name: thread
          in: query
          description: |
            Read one conversation. A thread is returned OLDEST first — it is a
            conversation, not a list of arrivals, which is the opposite of the
            mailbox and the reason the order is chosen per query rather than
            fixed.
          schema: { type: string }
        - name: box
          in: query
          description: |
            Which box to list. One box at a time, the inbox by default — a
            listing that mixed them would make deleting look like it did
            nothing. `unread` counts the inbox only: a badge that counted the
            deleted box would tell someone they have mail waiting in the place
            they went to stop seeing it.
          schema: { type: string, enum: [inbox, deleted], default: inbox }
      responses:
        '200':
          description: Envelopes
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/MessageEnvelope' }
                  unread:
                    type: integer
                    description: |
                      Unread messages in the mailbox, counted by the server over
                      the whole mailbox — not over this page.

                      This list is capped, so a caller that counted the rows it
                      was handed would report a number that is wrong exactly
                      when the mailbox is big enough for the number to matter.
        '404':
          description: |
            `IDENTITY_NOT_FOUND` — no agent is registered under the name in
            `to`. The same code the send face uses for the same fact: an
            operator who learned what it means when sending must not meet a
            second word for it here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/mark-all-read:
    post:
      operationId: markAllRead
      summary: Clear the inbox's unread marks
      description: |
        **This is not a loop over reading, and that is the whole reason it
        exists.** Reading is a person opening one message, and it is recorded as
        such — the `read` state is pinned to the `message.read` audit record
        written by that act, so the two cannot disagree.

        Marking everything read is a different act by a different intent: *I
        have not looked at these and I do not want to see them again.* A client
        loop over the read endpoint would download every body and write an audit
        record for each one claiming somebody read it — and those records are
        the evidence anyone later relies on. So this carries its own event,
        `inbox.mark_all_read`, with the actor and the number affected.

        The deleted box is not touched.

        Idempotent: an empty mailbox is `200` with `marked: 0`. "There was
        nothing to do" is not a failure, and a caller retrying after a lost
        response must not be punished for it.
      security: [{ adminCert: [] }]
      parameters:
        - { name: to, in: query, schema: { type: string } }
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked:
                    type: integer
                    description: How many this call changed, counted by the server.
                  unread:
                    type: integer
                    description: |
                      What is left, so the caller renders the server's number
                      rather than one it worked out from a page.

  /messages/{message_id}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: One message envelope
      description: |
        The envelope alone — no body, no side effect. This is what a reply
        checks before naming its parent: the id confirmed, the thread visible.
        Until this route existed, the only way to look at one message was the
        payload route, which marks it read and audits a read — a side effect
        "let me check the id" never meant. Reading an envelope is not reading
        a message, so this sits on the viewer face with the listing.
      security: [{ adminCert: [] }]
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The envelope, with its attachment manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/MessageEnvelope' }
        '404':
          description: No such message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMessage
      summary: Move a message to the deleted box
      description: |
        **Nothing is destroyed.** The message moves to the
        deleted box, where it stays visible and recoverable. The envelope (who,
        to whom, when, state) is, unlike the body, data BATON may read, index
        and audit, and the audit trail refers to it, so
        removing the row would take a record away from the log that names it.

        It carries its own audit event, `message.deleted`. Reusing the read
        event would have claimed somebody read what they were in fact trying to
        stop seeing.

        Idempotent: deleting what is already in the deleted box is `200` and
        keeps the ORIGINAL timestamp, so a repeated request cannot quietly reset
        how long something has been in there.

        **There is no restore, no empty-the-box and no automatic expiry for the
        deleted box.** Those are the three things that will be asked for next
        and none of them has been decided; the stored timestamp is what will let
        them be built without a schema change.
      security: [{ adminCert: [] }]
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  box: { type: string, enum: [deleted] }
        '404':
          description: No such message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{message_id}/payload:
    post:
      operationId: readMessage
      security: [{ adminCert: [] }]
      summary: One message body
      description: |
        The listing endpoint has no field that could carry a body and will not
        grow one: a body in a listing ends up in every console and log that
        renders it. This returns one message, by id, and the control plane
        **audits it as a read** — which is what makes it a deliberate act rather
        than a leak.

        **Fetching the body marks the message `read`.** The mailbox word is
        pinned to the audit record this call writes, so the two can never
        disagree. That state change is why this is a POST: a read that changes
        state must not sit behind a GET, where a prefetch, a retry or a crawler
        can trip it.

        It exists because an operator whose agents reply to an identity nobody
        has bound must be able to read those replies. Refusing would leave a
        message no one on earth can read, which is a dead letter and not a
        boundary.
      tags: [messages]
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The body, with the content type the sender declared.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: No such message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: |
            The body is gone. Retention is finite by design: expiry clears the
            payload and keeps the envelope, so that a message existed and was
            delivered survives without its contents surviving with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /networks/self:
    get:
      tags: [networks]
      summary: What this network is, cryptographically
      description: |
        A network's identity is a keypair it holds — not its name, not its
        address, not the master currently serving it, because all three change
        while it stays the same network.

        **There is no private key in this response and no route that serves
        one.** The handler's struct has no field for it and the store does not
        read the column, so a leak needs a new field *and* a new query rather
        than a forgotten annotation.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: This network
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }

  /networks/self/attestations:
    post:
      tags: [networks]
      summary: Have the network sign, for a purpose this control plane knows
      description: |
        Exists because two facts hold at once: the network's private key is
        stored only in the control plane and no API returns it, and requests to
        Baton Cloud are sent by the CLI, not by the control plane — the control
        plane's only outbound calls to the configured registry
        (`BATON_CLOUD_URL`) are routing lookups for cross-network delivery and
        fetches from the open directory. So the CLI orchestrates and the
        control plane signs.

        **This is deliberately not a signing oracle.** A `POST /sign {bytes}`
        route would let anyone holding an operator certificate have the network
        sign anything — a fraudulent endpoint record, a federation claim, a
        message attributed to another network. The caller sends typed fields for
        a named purpose and **the server builds the bytes it signs**. An unknown
        purpose is refused by name.

        `payload` is returned as well as `signature`: a verifier that rebuilds
        the bytes from parsed fields can disagree with the signer about
        whitespace or field order, and then blame the key.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [cloud-register, binding-confirm, network-invite, transfer-approve, resource-register, resource-unregister, network-register, master-transfer-offer]

                network_name: { type: string }
                endpoints:
                  type: array
                  items:
                    type: object
                    properties:
                      address: { type: string }
                      port: { type: integer }
                      protocol: { type: string }

                binding_id: { type: string }
                provider_key_fingerprint: { type: string }

                invitee: { type: string }
                from_network: { type: string }
                to_network: { type: string }
                token_hash: { type: string }
                expires_at: { type: string }

                gaining: { type: string }

                resource_id: { type: string }
                resource_type: { type: string }
                resource_name: { type: string }
                resource_version: { type: string }
                resource_hash: { type: string }
      responses:
        '201':
          description: A signature over bytes this control plane composed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attestation' }
        '400':
          description: Unknown purpose, or fields missing for the purpose given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/invitations:
    post:
      tags: [networks]
      summary: Invite an agent that belongs to another network
      description: |
        Both ends are masters. **A transfer that needed only one end's consent
        would be one end editing the other's member list**, so this network
        mints and the agent's current network approves.

        The invitee is inside the signed payload, not a field beside the
        signature: a field can be swapped and the signature still checks out,
        which is the difference between *recorded* and *protected*.

        **Possession of the returned invitation is authority**, bounded by the
        invitee it names. The security rests on the delivery channel — send it
        to that network's master and to nobody else. See
        `architecture/network-membership.md` for what this shape does and does
        not promise.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee, from_network]
              properties:
                invitee: { type: string }
                from_network: { type: string }
                ttl: { type: string, example: 1h }
      responses:
        '201':
          description: A signed, self-contained invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkInvitation' }

  /networks/self/transfers:
    post:
      tags: [networks]
      summary: Approve losing a member to another network
      description: |
        **This is the act that carries the authority.** Everything before it is
        a proposal.

        Three checks, and skipping any one makes it theatre: the invitation is
        signed by the network it names; the signed bytes say what the fields
        beside them say; and the agent actually belongs here.

        **Approval revokes.** The released member's certificates here are
        revoked — recording a departure without revoking would make "transfer"
        mean "additional membership", since the node would still hold a valid
        certificate. If the far side then fails, take the agent back with a
        fresh enrollment token; no coordination is required.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkInvitation' }
      responses:
        '200':
          description: The signed approval
        '401':
          description: |
            `INVITATION_NOT_SIGNED` — a token proves somebody handed you a
            string; only the signature says who.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `INVITATION_TAMPERED` — the signed bytes do not match the fields
            beside them. `WRONG_NETWORK` — it takes an agent from elsewhere.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/spool-collect:
    post:
      tags: [networks]
      summary: Collect whatever the registry is holding for this network
      description: |
        The receiving half of delivery through the registry, whose offline
        mailbox only holds bytes: this network makes every admission decision
        itself when it collects. The spool carried the bytes without an
        opinion — it does not verify the message signature —
        so everything that decides anything happens here: is the signature the
        one the grant THIS network issued pins, does the envelope's claimed
        source match it, is the recipient ours and does it exist, and what does
        the message become here. Having waited in a mailbox makes none of
        those checks lighter.

        Also performed automatically, on every registry heartbeat, and this
        verb is what the loop calls — "the operator asked" and "we came back
        online" are two reasons to do the identical thing.

        **The loop has no interval of its own.** The mailbox exists BECAUSE
        this network was judged offline, and the heartbeat is the act by which
        it stops being judged offline, so the moment worth collecting is that
        beat. An interval here would be a THIRD staleness ceiling beside the
        liveness window and the mailbox token TTL, and those two already run in
        opposite directions: the liveness window bounds how stale "online" may
        be, the mailbox-token TTL how stale "offline" may be. The "registry down for a
        day" answer is the heartbeat's: log it and keep the rhythm, because
        treating an unreachable registry as a reason to stop is how a network
        stays offline long after it came back.

        Until the loop existed, a spooled message was collected only when an
        operator asked — while its sender had already been told, honestly, that
        it would not be notified. Two honest sentences added up to a message
        nobody was waiting for.

        A message that cannot be landed is NOT acknowledged — acknowledging it
        would destroy the only copy on the strength of a failure nobody has
        looked at. One that lands but cannot be acknowledged is seen again next
        time, and the sender's idempotency key makes the second
        landing a no-op. That is the safe direction; the other one loses mail.
      responses:
        '200':
          description: How many the mailbox handed over, and how many landed here
          content:
            application/json:
              schema:
                type: object
                required: [fetched, landed]
                properties:
                  fetched:
                    type: integer
                    description: Messages the mailbox handed over.
                  landed:
                    type: integer
                    description: |
                      Of those, how many became messages here.

                      TWO numbers because one was answering two questions: the
                      earlier `collected` counted only what landed, so a mailbox
                      that handed over a message this network then refused
                      answered `0` — indistinguishable from an empty mailbox,
                      and an operator would conclude nothing was waiting.

                      `fetched > landed` is not an error. The gap is the
                      interesting part: messages refused here, reported back to
                      their senders, and released.
        '409':
          description: The registry refused; the code is the registry's own.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            `NETWORK_UNREACHABLE` — the registry did not answer, or answered
            with a shape this build does not read. Deliberately not reported as
            an empty mailbox: "I did not understand" and "there is nothing
            waiting" are different facts, and only one of them means no mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/delivery-grants:
    post:
      tags: [networks]
      summary: Endorse another network to deliver messages to agents here
      description: |
        Operator face. The one place a person decides that
        another network may put mail in this one's mailboxes; the peer face
        only verifies what was decided here.

        The peer's public key is PASTED, not resolved: resolution happens once, when the relationship is established, by the
        operator establishing it. From then on the pinned key is the authority
        and nothing on the delivery path resolves anything — a key that arrived
        by resolution at use time would put DNS, which is not a trust root,
        inside the message path.

        Recorded as a Grant with action `baton.message.deliver` — a signed
        authorization record whose signature covers grantor, grantee, action,
        object, scope and validity: the store row is the revocation ledger and the operator's view, never the
        authority — the exchange consumes the signed bytes.
      responses:
        '201':
          description: The signed delivery grant, to hand to the endorsed network
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryGrant' }
        '400':
          description: |
            `INVALID_REQUEST` — missing subject, a `subject_key` that is not a
            single-line base64(DER) ed25519 key, a non-canonical scope, or an
            `expiry_at` that is absent, malformed, or already past.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryGrantIssue' }
    get:
      tags: [networks]
      summary: List the networks this one has endorsed to deliver here
      description: |
        What this network has promised, and whether the promise still stands.
        Viewer — reading who was endorsed is not endorsing.

        Revoked and expired grants ARE listed, with their dates: a grant that is
        no longer live is the answer to "was this network ever allowed to write
        here", and dropping it would make the listing quietly incomplete.
        Revocation is an appended event: the record stays, still queryable and
        still verifiable, as proof it was once authorized.

        The signed `payload` and `signature` are NOT returned here. They are the
        bearer half of the endorsement, handed to the peer once at issue;
        re-serving them on a viewer read would turn a listing into a way to
        obtain a credential.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: The endorsements this network has issued
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryGrant' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /networks/self/delivery-grants/{grant_id}:
    delete:
      tags: [networks]
      summary: Withdraw an endorsement to deliver here
      description: |
        The lever that was missing: an endorsement could be made and never taken
        back. SuperAdmin.

        Revoking is an EVENT, not a deletion — the record stays and its proof
        still verifies, because "was authorised once" is a fact an audit needs
        and a missing row cannot state it.

        **What it stops, precisely.** The door checks revocation when a peer
        exchanges its grant for a delivery token, not again on each delivery. A
        token minted a second before this call therefore stays good until it
        expires — a window bounded by the token TTL of 300s (cut from 900s for
        exactly this reason: how long a rule may outlive
        the fact it rests on). The response says so, because an operator who
        reads "revoked" as "traffic stops now" has been handed one word that
        means two things.

        Refuses with 404 for a grant id belonging to another grant family — this
        face withdraws delivery endorsements only.
      security: [{ adminCert: [] }]
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string } }
        - { name: X-Baton-Acting-For, in: header, required: false, schema: { type: string }, description: 'optional on-behalf-of label recorded as acting_for (the panel threads its login session here); context only, never authority — the mTLS certificate is the actor' }
      responses:
        '200':
          description: |
            Withdrawn. `note` states the residual window rather than implying an
            instant cut-off.
          content:
            application/json:
              schema:
                type: object
                required: [grant_id, revoked, note]
                properties:
                  grant_id: { type: string }
                  subject_network_id: { type: string }
                  revoked: { type: boolean }
                  note: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No delivery grant with that id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/delivery-tokens:
    post:
      tags: [networks]
      summary: Exchange a cross-network delivery grant for a short-lived delivery token
      description: |
        Cross-network message delivery. The destination network signs the
        delivery token and is its only verifier. A foreign network **A**
        presents a delivery grant *this* network once signed for it, plus a
        request A signs now, and receives a short-lived token naming which
        recipients it may deliver to.

        The same machine as `/networks/self/access-tokens`, with the roles
        swapped because the object moved: a resource lives at the network that
        owns it, and so does an inbox — so here **this** network signs the
        grant, mints the token, and verifies both (谁签谁验).

        **Peer face**: A holds no certificate this CA issued, so all authority
        is in the two signatures. The verify order **is** the contract —
        **grant first**, because the grant carries A's authoritative public key
        (line4), so this network never resolves A at request time, and
        verification needs no call to Baton Cloud.

        The attestations are a SEPARATE family from the access ones, with their
        own purpose lines (`delivery-grant`, `delivery-token-request`,
        `delivery-token`) and their own scope grammar. This is structural, not
        cosmetic: the access scope's type is a closed enum with a `*` wildcard,
        and grants carrying `read:*/*` are already issued — adding `inbox` to
        that enum would have widened every one of them to cover mailboxes with
        nobody re-signing anything.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryTokenExchange' }
      responses:
        '201':
          description: The signed delivery-token (payload + this network's signature, short expiry)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryToken' }
        '400':
          description: |
            `INVALID_REQUEST` — payload/signature not base64.
            `REQUEST_SIGNATURE_INVALID` — the request is not a 6-line
            delivery-token-request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            `GRANT_SIGNATURE_INVALID` — the grant is not signed by this network.
            `REQUEST_SIGNATURE_INVALID` — the request is not signed by the key
            the grant pins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `GRANT_EXPIRED` / `GRANT_REVOKED` — the grant is no longer live.
            `SCOPE_EXCEEDS_GRANT` — the request names recipients the grant
            does not cover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `GRANT_PAYLOAD_MISMATCH` — the grant's purpose/issuer/subject/key
            disagree. `GRANT_MISMATCH` — the request names a different grant.
            `REPLAYED` — the request nonce has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `CLOCK_SKEW` — the request timestamp is outside the signing window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/delivery-reports:
    post:
      tags: [networks]
      summary: Tell a sending network that a delivery it was told had been accepted could not be landed
      description: |
        Peer face. Only the ASYNCHRONOUS refusals need one: a
        direct delivery is refused in its own response, so a report about it
        would be noise. What has no answer is the spool leg — the destination
        collects hours later, refuses, and without this nothing travels back.

        **Its own route rather than a message type.** The original design
        called it "an ordinary message with kind=delivery-report", but the
        message type carries no meaning BATON may act on and nothing may
        branch on it (enforced by
        `scripts/check-message-type-boundary.sh`). So "this is a report" is
        carried by WHICH DOOR it arrived at — position beats a field, and here
        the field could not even be read without breaking a ruling. Everything
        else about the report is as designed: same channel, same relationship, same
        signing.

        **Scoped accept, proved rather than looked up.** A report is admitted
        only about a delivery this network actually sent, and that is not a
        database lookup: the report echoes back the envelope bytes and the
        payload digest, and the sender verifies its OWN signature over them.
        Nothing is stored, so nothing can be forgotten, swept away, or forged by
        anyone who did not hold the sending network's key.

        **Reports never produce reports.** A report that cannot be delivered is
        dropped — the mail loop SMTP avoids with its null return-path, avoided
        here by there being no path from this route back into report generation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryReport' }
      responses:
        '202':
          description: Recorded. The outcome is the destination's word, carried unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  outcome: { type: string }
                  recorded: { type: boolean }
        '400':
          description: '`INVALID_REQUEST` — not base64, or not an 8-line delivery-report.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            `REPORT_SIGNATURE_INVALID` — the report is not signed by the network
            it claims to come from. The verdict is inside the signature: a
            report edited in flight must not be believed, or whoever carried it
            could change what the sender is told.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `NOT_OUR_DELIVERY` — this network did not sign the delivery the
            report is about. `NO_DELIVERY_GRANT` — no live grant from the
            reporting network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `NOT_THE_DESTINATION` — the reporter is not the network the delivery
            was addressed to; without this, anyone who saw a delivery in transit
            could tell its sender it had failed. `REPORT_MISMATCH` — the report
            does not describe the original it carries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/deliveries:
    post:
      tags: [networks]
      summary: Deliver one cross-network message into this network
      description: |
        The door: this network issues and alone verifies the token, and
        re-checks every envelope field that crosses. A presents the delivery token this network
        minted, the grant it was minted from, and one signed delivery.

        The grant travels WITH the delivery on purpose: the token names A's
        network but does not carry A's key, and verifying the message signature
        needs it. Carrying the grant means that key arrives inside bytes this
        network itself signed — no store read, no resolve, no Cloud.

        What crosses is not taken at face value. `state`, `box` and
        `delivered_at` do not cross at all; `payload_size` is recomputed;
        `expires_at` is re-ruled to `min(declared, this network's ceiling)`;
        `destination_network` is VERIFIED against this network and refused if it
        disagrees — never rewritten, because rewriting a misroute is accepting
        mail addressed to somebody else.

        The token is presented in `X-Baton-Delivery-Token` and
        `X-Baton-Delivery-Signature` (both base64).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryReceive' }
      responses:
        '201':
          description: Accepted and queued for the recipient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReceipt' }
        '200':
          description: |
            Already here. The sender's `message_id` is the idempotency key
            so a resend after a timeout is a SUCCESS with
            `duplicate: true` and nothing new stored — never a second copy and
            never an error a sender would retry forever on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReceipt' }
        '400':
          description: |
            `INVALID_REQUEST` — payload/signature not base64, or the envelope is
            malformed. `TOKEN_PAYLOAD_MISMATCH` — not an 8-line delivery-token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            `TOKEN_MISSING` / `TOKEN_SIGNATURE_INVALID` / `TOKEN_EXPIRED` —
            the token is absent, not this network's, or past its expiry.
            `GRANT_SIGNATURE_INVALID` — the accompanying grant is not ours.
            `SIGNATURE_INVALID` — the delivery is not signed by the key the
            grant pins. Terminal: the bytes will not become valid on a retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `NOT_ADMITTED` — this token does not cover that recipient. A fact
            about the relationship between two networks, and deliberately NOT
            the same code as `RECIPIENT_UNKNOWN`, which is a fact about a name
            inside one network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            `RECIPIENT_UNKNOWN` — the network is right and the agent is not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `GRANT_MISMATCH` — the grant is not the one the token was minted
            from. `SOURCE_NETWORK_MISMATCH` — the envelope claims a source
            network that is not the one whose key signed it: the check that
            turns `sender` from a field into a fact.
            `NOT_FOR_THIS_NETWORK` — addressed to somebody else.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/access-tokens:
    post:
      tags: [networks]
      summary: Exchange a cross-network grant for a short-lived access token
      description: |
        Cross-network access (cloud/spec/access-grant-contract §二之一). A
        foreign network **B** presents a grant this network once signed for it,
        plus a request B signs now, and receives a short-lived scoped
        access-token to fetch this network's non-public resources.

        Unauthenticated face on purpose: B has no certificate here, so all
        authority is in the two signatures. The verify order **is** the
        contract — **grant first**: the grant carries B's authoritative public
        key (line4), so this network never resolves B at request time, and
        verification needs no call to Baton Cloud. It then verifies B's request against that pinned
        key, checks the request is fresh and unreplayed, that it names this
        grant, that the grant is live and unrevoked, and that its scope is a
        subset of the grant — then mints an `access-token` signed by SK_A.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessTokenExchange' }
      responses:
        '201':
          description: The signed access-token (payload + SK_A signature, short expiry)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400':
          description: |
            `INVALID_REQUEST` — payload/signature not base64.
            `REQUEST_SIGNATURE_INVALID` — the request is not a 6-line
            access-token-request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            `GRANT_SIGNATURE_INVALID` — the grant is not signed by this network.
            `REQUEST_SIGNATURE_INVALID` — the request is not signed by the key
            the grant pins for B.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `GRANT_EXPIRED` / `GRANT_REVOKED` — the grant is no longer live.
            `SCOPE_EXCEEDS_GRANT` — the request asks beyond the grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `GRANT_PAYLOAD_MISMATCH` — the grant's purpose/issuer/subject/key
            disagree. `GRANT_MISMATCH` — the request names a different grant.
            `REPLAYED` — the request nonce has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `CLOCK_SKEW` — the request timestamp is outside the signing window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /networks/self/received-grants:
    post:
      tags: [networks]
      summary: Import a grant this network has received from another
      description: |
        The B side of cross-network access (cloud/spec/access-grant-contract §六):
        record a grant another network issued this one, so an operator sees what
        access it holds. The body is the bundle the issuer handed over — the
        signed grant plus the connection descriptor (where the issuer answers and
        the CA to pin). It is verified well-formed, self-consistently signed by
        the key it carries, and naming THIS network as subject; it grants nothing
        (the issuer verifies its own grant at exchange). SuperAdmin.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceivedGrantImport' }
      responses:
        '201':
          description: The stored received grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedGrant' }
        '400':
          description: |
            `INVALID_REQUEST` — payload/signature not base64, a bad issuer key, or
            not an 8-line access-grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `GRANT_SIGNATURE_INVALID` — bytes and signature disagree.
            `NOT_THE_SUBJECT` — the grant is for a different network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [networks]
      summary: List the grants this network has received
      description: |
        This network's management copy of the access it holds — issuer, scope,
        lifetime, where the issuer answers, and the CA fingerprint it trusts. The
        signed bytes are omitted here (a survey, not a credential dump); fetch one
        grant to get them. Viewer.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: The received grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  received_grants:
                    type: array
                    items: { $ref: '#/components/schemas/ReceivedGrant' }
  /networks/self/received-grants/{grant_id}:
    get:
      tags: [networks]
      summary: One received grant, with its signed bytes
      description: |
        The full record including the signed grant and the pinned CA, so it can
        be re-presented at exchange or exported. Viewer.
      security: [{ adminCert: [] }]
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The received grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedGrant' }
        '404':
          description: No such received grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [networks]
      summary: Remove a received grant from this network's copy
      description: Forget a grant this network no longer keeps. Does not affect the issuer. SuperAdmin.
      security: [{ adminCert: [] }]
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
        '404':
          description: No such received grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/access-resources/{id}:
    get:
      tags: [networks]
      summary: Fetch a resource with a cross-network access token
      description: |
        Cross-network access (cloud/spec/access-grant-contract §二之一, 取资源).
        A foreign network B presents an access-token this network minted (in the
        `X-Baton-Access-Token` / `X-Baton-Access-Signature` headers) and reads a
        resource within the token's scope.

        Unauthenticated face: the token IS the authority. The gate verifies only
        this network's own signature over the token, its expiry, and that the
        requested resource is within scope — **no resolve, no B signature, no
        Cloud call.** Fast and offline-verifiable.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string }, description: 'resource type, if the id needs disambiguating' }
        - { name: X-Baton-Access-Token, in: header, required: true, schema: { type: string }, description: 'base64(access-token canonical)' }
        - { name: X-Baton-Access-Signature, in: header, required: true, schema: { type: string }, description: 'base64(SK_A over the token)' }
      responses:
        '200':
          description: The resource envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401':
          description: |
            `TOKEN_MISSING` — no token headers. `TOKEN_SIGNATURE_INVALID` — not
            signed by this network. `TOKEN_EXPIRED` — the short-lived token has
            lapsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `SCOPE_DENIED` — the token's scope does not cover this resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `TOKEN_PAYLOAD_MISMATCH` — the token's purpose/issuer/scope disagree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/access-grants:
    post:
      tags: [networks]
      summary: Issue a cross-network access grant (endorse B's key)
      description: |
        The operator's side of cross-network access (cloud/spec/access-grant-contract
        §四). Endorse another network B to read a scope of this network's
        resources, by pasting B's public key by hand — the V0 trust anchor
        (contract §一): this network never resolves B against Cloud, at issue
        time or ever. Endorsing a key here is like adding a line to
        authorized_keys.

        SuperAdmin: issuing a grant IS granting authority over this network's
        resources. The response carries the signed grant (payload + signature)
        to hand to B; this network keeps only a management copy for listing and
        revocation.
      security: [{ adminCert: [] }]
      parameters:
        - { name: X-Baton-Acting-For, in: header, required: false, schema: { type: string }, description: 'optional on-behalf-of label recorded as acting_for (the panel threads its login session here); context only, never authority — the mTLS certificate is the actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_network_id, subject_key, scope, expiry_at]
              properties:
                subject_network_id: { type: string, description: "B's network id" }
                subject_key: { type: string, description: "B's public key, single-line base64(DER SPKI)" }
                scope: { type: string, example: 'list:skill/*,read:skill/*' }
                expiry_at: { type: string, format: date-time }
      responses:
        '201':
          description: The signed grant to hand to B
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '400':
          description: |
            `INVALID_REQUEST` — missing subject, a subject_key that is not a
            valid ed25519 SPKI, a non-canonical scope, or an expiry not in the
            future.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [networks]
      summary: List the cross-network grants this network has issued
      description: |
        A's management copy of every grant it issued — subject, scope, lifetime,
        and whether it is revoked. The signed grant itself lives in B's hands and
        is not returned here (contract §四). Viewer.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: The issued grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items: { $ref: '#/components/schemas/AccessGrant' }
  /networks/self/access-grants/{grant_id}:
    delete:
      tags: [networks]
      summary: Revoke a cross-network access grant
      description: |
        A's only live lever once a grant is in B's hands (contract §四).
        Revocation stops NEW tokens; tokens already minted die on their own short
        clock. SuperAdmin.
      security: [{ adminCert: [] }]
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string } }
        - { name: X-Baton-Acting-For, in: header, required: false, schema: { type: string }, description: 'optional on-behalf-of label recorded as acting_for (the panel threads its login session here); context only, never authority — the mTLS certificate is the actor' }
      responses:
        '200':
          description: Revoked
        '404':
          description: No such grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/resources:
    post:
      tags: [networks]
      summary: Publish a resource to this network
      description: |
        Store a Resource (skill, knowledge, policy, workflow, template, other or plugin)
        at scope network or public in this network's master, so members read it
        (GET /agent/network-resources). Owner acts over the admin certificate.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePublish' }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    get:
      tags: [networks]
      summary: This network's resources (owner view)
      security: [{ adminCert: [] }]
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: visibility, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: List, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }
  /networks/self/resources/{id}:
    get:
      tags: [networks]
      summary: One resource (owner view)
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '404': { description: No such resource, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [networks]
      summary: Unpublish a resource
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
  /networks/self/resources/{id}/move:
    post:
      tags: [networks]
      summary: Re-folder a resource (identity unchanged)
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [folder], properties: { folder: { type: string } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
  /networks/self/resources/{id}/tags:
    post:
      tags: [networks]
      summary: Replace a resource's tags (cross-type classification)
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tags], properties: { tags: { type: array, items: { type: string } } } }
      responses:
        '200': { description: Tagged, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
  /networks/self/resources/{id}/admit:
    post:
      tags: [networks]
      summary: Admit a resource waiting for review
      description: |
        Admin. A resource published by an agent onto the `network` layer arrives
        `review: pending` and no member can see it until somebody says yes. This
        is that yes.

        **By resource id, and only an OPEN application.** A resource that was
        already decided, or that was deleted and re-published, answers 404 —
        a re-publish gets a NEW id on purpose, so a verdict carrying the old one
        is refused rather than landing on bytes nobody read.

        Who decided is taken from the operator certificate, never from the body.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optional on an admission; required on a denial. }
      responses:
        '200': { description: Admitted, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '404':
          description: No open application with that id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /networks/self/resources/{id}/deny:
    post:
      tags: [networks]
      summary: Refuse a resource waiting for review
      description: |
        Admin. The other half of `/admit`, and it **requires a `reason`**: a
        refusal nobody can act on gets filtered as noise, so an empty reason is
        `INVALID_ARGUMENT` (400) rather than a silent denial.

        A denied resource stays in the table and stays hidden from members. It
        is not deleted — the publisher needs to be able to read why.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: Denied, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '400':
          description: A denial with no reason
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: No open application with that id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /pty:
    get:
      tags: [nodes]
      summary: An interactive terminal on a remote node, over a WebSocket
      description: |
        Upgrades to a WebSocket that relays a shell on the named agent's node,
        over the node's outbound channel. Binary messages are raw PTY bytes
        (xterm reads/writes them); text messages are JSON control —
        `{"type":"resize","cols","rows"}` from the browser,
        `{"type":"error","code":"HELD_BY_OTHER"}` / `{"type":"close"}` back.
        `mode=takeover` acquires the takeover lease for write; `mode=read`
        (default) is view-only. The panel bridges this to a browser and carries
        the bearer token in `Sec-WebSocket-Protocol`, not the URL.
      security: [{ adminCert: [] }]
      parameters:
        - { name: agent, in: query, required: true, schema: { type: string } }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [read, takeover] } }
      responses:
        '101': { description: Switching Protocols — the WebSocket is open }
        '403':
          description: '`SHELL_NOT_PERMITTED` — the node does not allow a remote shell. The switch is off; the node enforces it and would refuse regardless.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            The node cannot host a terminal right now, and which reason is
            named matters — they send the reader to three different places.

            `NODE_OFFLINE` — it holds no channel. `NO_RUNTIME` — it is
            connected but supervises nothing (or its first heartbeat has not
            landed). `RUNTIME_NOT_ENTERABLE` — it runs something that does not
            declare `session: tty`, so there is no terminal to enter.

            ⚠ The last two were added 2026-09-06. Before that this path
            answered `101` for a node with no enterable runtime and then sent
            nothing at all — no byte, no error frame, no close — which in a
            browser is indistinguishable from a working shell nobody has typed
            into. `POST /nodes/{node}/takeover` had carried both refusals since
            it was written; they were fitted to one of the two doors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/cloud-sign:
    post:
      tags: [networks]
      summary: Sign a Baton Cloud request with the network's key
      description: |
        Builds the registry's canonical request (method, path, body_sha256, ts,
        nonce, network_id — LF-joined, no trailing newline) and signs it with
        the network's private key, which never leaves the control plane. The CLI
        computes body_sha256 over the exact bytes it will send, gets the
        signature here, and POSTs to the cloud registry with the three signed
        headers. The key never reaches the CLI.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, path, body_sha256]
              properties:
                method: { type: string }
                path: { type: string }
                body_sha256: { type: string, description: lowercase hex sha256 of the exact body bytes }
      responses:
        '200':
          description: The signature and the ts/nonce it covers
          content:
            application/json:
              schema:
                type: object
                properties:
                  network_id: { type: string }
                  timestamp: { type: string }
                  nonce: { type: string }
                  signature: { type: string }
                  public_key: { type: string }

  /networks/self/avatar:
    post:
      tags: [networks]
      summary: Set or clear the network's avatar
      description: |
        A small image shown on the network card and beside its name. Display
        metadata — the network id, key and descriptor do not change. Empty
        `data_base64` clears it. Content type is one of image/png, image/jpeg,
        image/webp (SVG is refused: a picture is not worth a script surface).
        The image is at most 2 MiB.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, data_base64]
              properties:
                content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
                data_base64: { type: string, description: base64 image bytes; empty clears }
      responses:
        '200':
          description: The avatar as set, or cleared
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Unsupported type, bad base64, or too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/name:
    post:
      tags: [networks]
      summary: Name this network — the word a person calls it by
      description: |
        A display name. Nothing else moves: not the network id, not the key,
        not the tenant under which certificates are issued, not an address or
        an endpoint — so no node re-enrols and no pin breaks. A network founded
        without a name is `local-master`; this is how it becomes something else.
        Every node's `network` field (`GET /nodes`) reads this name.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                  description: The same shape as a node name.
      responses:
        '200':
          description: The network as named
          content:
            application/json:
              schema:
                type: object
                properties:
                  network_id: { type: string }
                  display_name: { type: string }
        '400':
          description: Missing or malformed display_name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/attachments:
    post:
      tags: [messages]
      summary: Upload attachment bytes and get back their digest (admin face)
      description: |
        The body is the file, streamed. The response carries the SHA256 **of
        what actually landed** — it is never taken from the request, because an
        address a caller could name is an address that can disagree with its
        content.

        The ceiling here is the WIDER of the two attachment limits, because an
        upload does not yet know who the message is for: attachments are
        uploaded first and referenced by a message afterwards. A message
        addressed to another network is held to a smaller limit, and that
        refusal arrives when the message is sent, naming the destination as the
        reason.

        The same bytes uploaded twice are stored once (content addressing), so
        re-uploading after a failed send costs nothing.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string, description: Lowercase hex; both the integrity check and the address of the bytes. }
                  size: { type: integer, format: int64 }
        '413':
          description: Larger than an attachment may be (`ATTACHMENT_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: This control plane stores no attachment bytes (`BLOBS_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{message_id}/attachments/{idx}:
    get:
      tags: [messages]
      summary: Download one attachment of a message (admin face)
      description: |
        `idx` is the attachment's position in the message's manifest, which is
        the order the sender chose.

        **`410` is not `404`.** Attachment bytes are deliberately not carried in
        a standby snapshot, so a control plane that was transferred keeps the
        manifest and loses the files. Answering 404 there would tell the reader
        there never was an attachment; `ATTACHMENT_BYTES_GONE` says what
        happened.
      security: [{ adminCert: [] }]
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The bytes, with the sender's content type and name
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: No attachment at that position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The manifest names bytes this control plane no longer holds (`ATTACHMENT_BYTES_GONE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/messages/attachments:
    post:
      tags: [agent]
      summary: Upload attachment bytes (node face)
      description: |
        The same store as the admin-face upload; a different caller. An agent's
        daemon speaks here with the certificate its network issued, which is the
        same face the skill archive uses and for the same reason: bytes that do
        not fit in a channel frame ride HTTP.
      security: [{ nodeCert: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string }
                  size: { type: integer, format: int64 }
        '413':
          description: Larger than an attachment may be (`ATTACHMENT_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/messages/{message_id}/attachments/{idx}:
    get:
      tags: [agent]
      summary: Download one attachment of a message addressed to this node
      description: |
        A node reads its own mail. The addressee is resolved to the node it is
        bound to and compared with the caller — without that, any member of the
        network could read any member's attachments by guessing a message id.
      security: [{ nodeCert: [] }]
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
        - { name: idx, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: That message is not addressed to an agent on this node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The manifest names bytes this control plane no longer holds (`ATTACHMENT_BYTES_GONE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/admission:
    post:
      tags: [networks]
      summary: Open or close this network's door to NEW applications
      description: |
        `closed` refuses new applications at `POST /join-requests` with
        `ADMISSION_CLOSED` and a reason. **That is the only thing it changes.**

        Unchanged while closed, deliberately and each for its own reason:

        - nodes already enrolled keep their channels and certificates;
        - applications already queued are still listed and can still be
          admitted or denied — closing is not clearing;
        - a node that has already been admitted can still call `/enroll`,
          otherwise closing would strand it between an admission it was given
          and an identity it can never collect;
        - the network descriptor is still served — being discoverable and
          being joinable are two different facts.

        Two values and no third. Admitting by name pattern is not a value here.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admission]
              properties:
                admission:
                  type: string
                  enum: [open, closed]
      responses:
        '200':
          description: The door, as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  network_id: { type: string }
                  admission: { type: string, enum: [open, closed] }
                  admission_changed_at: { type: string, format: date-time }
                  admission_changed_by: { type: string }
        '400':
          description: admission missing, or a value other than open/closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /networks/self/addresses:
    post:
      tags: [networks]
      summary: Add an address this network answers to
      description: |
        POST rather than PUT: PUT on a collection means "replace the set", and
        this adds a member. A network may legitimately be `agents.example.com` and
        `my-team.batoncloud.org` at once, so a route that quietly replaced would
        delete an address nobody asked to remove.

        `source` names which resolver is authoritative for this address. It is
        **not** a fallback order — recovery re-asks the same declared method,
        and a chain across methods is forbidden: an attacker who broke one
        resolver could then choose which one is used.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, source]
              properties:
                address: { type: string }
                source: { type: string, enum: [dns, cloud-registry] }
      responses:
        '200':
          description: The address as recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { type: string }
                  source: { type: string }

  /agent/network-resources:
    get:
      tags: [networks]
      summary: This network's shared resources, for a member
      security: [{ nodeCert: [] }]
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Resource list, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }
    post:
      tags: [networks]
      summary: A node hands something to the network
      description: |
        The node face's only write besides message attachments, and it differs
        from the operator's publish in three ways. Each is because a node is not
        an operator.

        **`publisher` is taken from the certificate and may not be sent.** A body
        carrying one is REFUSED rather than ignored: a field accepted and
        discarded leaves the sender believing it took effect, and on this face
        sending it is not a typo — it is publishing under another name.

        **`visibility` has no default here.** The operator face defaults to
        `network`, which is right for a person typing a command. It is wrong
        here because `public` names both the consent (the workspace directory a
        runtime puts things in) and the audience (a scope), and a default in that
        overlap makes "I did not say" and "I meant network" the same request.
        `public` itself is refused: public release also registers with the
        directory, which happens operator-side, and half of it answered 200
        would tell a node the world can see something it cannot.

        **Taking a name that belongs to somebody else is 409, not 403.** The
        upsert is on (tenant, type, name) and its conflict clause carries the
        publisher, so without this a node could replace an operator's resource
        AND take its authorship, answering 200. It is a collision rather than a
        permission problem — 403 would send the reader to check rights that are
        not the issue.

        A `network`-scope publish from a node is also held for review: it is
        stored `review: pending`, answered `submitted`, and no member sees it
        until the network's owner admits it
        (`POST /networks/self/resources/{id}/admit`). Re-publishing identical
        bytes leaves the existing verdict standing. A `private` publish is not
        reviewed.
      security: [{ nodeCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, visibility, body]
              properties:
                type: { type: string, enum: [skill, knowledge, policy, workflow, template, other, plugin] }
                name: { type: string }
                visibility:
                  type: string
                  enum: [private, network]
                  description: No default. `public` is refused on this face.
                body: { type: string, description: The text being published. Stage 1 is text only. }
                version: { type: string }
      responses:
        '200': { description: The stored resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '400': { description: Unknown type, missing name or body, absent or unknown visibility, or a stated publisher, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: visibility public, which a node may not set, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: That type and name already belong to another publisher, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agent/network-resources/{id}:
    get:
      tags: [networks]
      summary: One shared resource, for a member
      security: [{ nodeCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '404': { description: No such resource, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /networks/self/resource-archives/{digest}:
    post:
      tags: [networks]
      summary: Store a facility's archive, before publishing the record that names it
      description: |
        A `plugin` resource is a directory tree, so its record names an archive
        by digest instead of carrying a body. The bytes go up here FIRST: the
        publish endpoint refuses a `plugin` whose archive is not already
        stored, so a catalogue entry can never name bytes nobody can fetch.

        The URL IS the promise. The store computes the digest of what actually
        arrived and refuses a mismatch, so a caller cannot store bytes under a
        name they do not hash to.

        Idempotent by content address: publishing the same directory twice
        uploads once, and a retry after a half-failed publish costs nothing.

        NOT under `/resources/{id}/` — `archives` is a value `{id}` can take,
        and an archive is not a resource anyway: it is the bytes a resource
        names.
      security: [{ adminCert: [] }]
      parameters:
        - { name: digest, in: path, required: true, description: 'sha256 of the archive, 64 lowercase hex (no `sha256:` prefix)', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored (or already present)
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, example: ResourceArchive }
                  hash: { type: string }
                  size_bytes: { type: integer }
        '400': { description: Not a digest, or the bytes do not hash to it, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Past this control plane's limit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agent/network-resources/{id}/archive:
    get:
      tags: [networks]
      summary: A resource's archive bytes, for a member
      description: |
        The bytes for the one resource type whose content is not text. The
        others carry their body in the record; a `plugin` is a directory tree,
        so its row names an archive by digest (`hash`) and this serves it.

        Skill packages already use this shape — the control plane holds the
        bytes, and nodes GET them from the control plane over their mTLS
        face — and this
        reuses the same content-addressed store rather than standing up a
        second one. The node verifies `hash` against what it received; the
        `X-Baton-SHA256` header is a convenience and never the check.

        A missing archive is NOT the same answer as a missing resource, and the
        two are reported apart: a resource archive is not rebuildable from the
        record (the digest says what the bytes are, and nothing says where they
        came from), so the fix is to publish it again from the machine that has
        it — not to look for a resource that does exist.
      security: [{ nodeCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: No such resource for this node, or its archive is not here, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agent/cloud-resources/{network}/{resource}:
    get:
      tags: [networks]
      summary: Fetch one facility from the OPEN directory, for a member
      description: |
        An occupant names a facility its own company never published. The
        CONTROL PLANE fetches it and checks its hash; the node only ever talks
        to the control plane, and could not reach the directory anyway: there is no
        HTTP client in the agent-node image that can present a client
        certificate.

        The bytes land in the same content-addressed store a network-shared
        facility uses; this answers with the RECORD, and the node collects the
        bytes from `/agent/archives/{digest}`. Nothing here is a new carrier —
        the only new thing is the upstream.

        `{network}` is the PUBLISHER's network, not the caller's. That
        distinction is why this leg is unsigned today: the cloud-sign canonical
        carries the CALLER's `network_id` and every existing call site recovers
        it from the path, which works only where the path names the caller's
        own network.

        Trust does not change with the source: a facility from
        here lands on the same `adopted` door and the same `ClassUnknown` tier
        as one from this company's own catalogue — declarations honoured, no
        code run.

        THREE ANSWERS ARE KEPT APART, because their next steps differ:
        the directory does not list it (`NO_SUCH_RESOURCE`); it is listed and
        its bytes are gone (`ARTIFACT_MISSING` — the publisher has to publish
        again, and nothing here can produce them); this control plane has no
        directory address configured (`CLOUD_NOT_CONNECTED` — the path is open
        exactly when the registry address `BATON_CLOUD_URL` is set on the
        control plane; running `baton cloud connect` does not change it).
      security: [{ nodeCert: [] }]
      parameters:
        - { name: network, in: path, required: true, schema: { type: string }, description: The PUBLISHER's network id }
        - { name: resource, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The record; the bytes are now in the archive store
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource_id: { type: string }
                  network_id: { type: string, description: The publisher's }
                  version: { type: string }
                  hash: { type: string, description: 'sha256:<64 hex> — computed here, never taken' }
                  bytes: { type: integer, format: int64 }
        '404': { description: The directory does not list it (NO_SUCH_RESOURCE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Listed, and its archive is not in the store (ARTIFACT_MISSING), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: 'Published and then withdrawn (RESOURCE_WITHDRAWN). NOT the same as 404: a fetcher told the thing does not exist goes and finds another copy, and the reason this one cannot be had is that somebody decided it should not be installed.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: This control plane has no directory address configured (BATON_CLOUD_URL; code CLOUD_NOT_CONNECTED), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: The directory could not be asked, refused, or its bytes did not hash to what it said, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agent/archives/{digest}:
    get:
      tags: [networks]
      summary: Archive bytes addressed by DIGEST, for a member
      description: |
        The sibling of `/agent/network-resources/{id}/archive`, and the reason
        it is separate is the address: that one starts from a resource row in
        this network's own catalogue, and a facility from the open directory
        has no such row. Giving it one would put something this company never
        published into the list of what it shares.

        The store is already content-addressed, so the digest is the honest
        handle. A caller must present a node certificate AND must already know
        a sha256 — which is to say, must already have been told what the bytes
        are. Digests are not enumerable; this reveals nothing to a caller who
        does not already hold the name.
      security: [{ nodeCert: [] }]
      parameters:
        - { name: digest, in: path, required: true, schema: { type: string }, description: 'sha256:<64 hex characters>' }
      responses:
        '200':
          description: The archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { description: Not addressed by a sha256, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: This control plane does not hold those bytes, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agent/skills:
    get:
      tags: [skills]
      summary: What skill packages this node should have
      description: |
        The union of what this node was given directly and what its template
        declares. `via` says which, so a console can report drift: a skill a
        node has that its template does not is exactly a node-targeted install,
        and it will not survive a rebuild from the template.

        A node reconciles against this list; it does not receive install and
        uninstall commands. One that missed a nudge converges on its next
        connect, whereas a command stream diverges permanently the first time a
        node misses one.
      security: [{ nodeCert: [] }]
      responses:
        '200':
          description: The assigned set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSkillList' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /agent/contacts:
    get:
      tags: [networks]
      summary: The address book's two halves, for a node
      description: |
        WHO EXISTS — the network's identities, the projection the daemon lands
        in `.baton/local/net/members.json` and rebuilds whole on every connect
        — and WHAT THIS NODE HOLDS: the ACTIVE grants naming its bound
        identities as grantee, each as its canonical bytes plus proof, landed
        under `.baton/portable/self/held/`.

        The flat fields beside a held entry's canonical are a convenience the
        daemon must not trust, and does not read: it rebuilds its display
        projection from the signed canonical it parsed, and refuses an entry
        whose canonical does not parse or names a different grant than the
        envelope, so a control plane that lied in
        the flat fields changes nothing downstream.

        `authority_key_pem` is the network identity's PUBLIC key, distributed
        over this face's existing mTLS trust so a holder can verify its held
        attestations offline. It is re-fetched projection data, never carried
        in a snapshot.

        Cross-network resource grants (`baton.resource.fetch`) are not served
        here — their grantee is a network and their canonical is the ratified
        wire contract; their home is the network faces.

        Pulled after a `changed{kind:"contacts"}` nudge, and on every connect.
      security: [{ nodeCert: [] }]
      responses:
        '200':
          description: Members and held attestations
          content:
            application/json:
              schema:
                type: object
                required: [format, authority_key_pem, members, held]
                properties:
                  format: { type: string, enum: ["baton-contacts/1"] }
                  authority_key_pem: { type: string, description: The network identity's public key, PEM }
                  members:
                    type: array
                    items:
                      type: object
                      required: [identity]
                      properties:
                        identity: { type: string }
                        node_id: { type: string, description: Where it resolves right now; absent when known but unplaced }
                  held:
                    type: array
                    items:
                      type: object
                      required: [grant_id, scope, action, grantor, grantee, record_b64, proof_b64]
                      properties:
                        grant_id: { type: string }
                        scope: { type: string, description: Display copy — the signed bytes in record_b64 are the authority }
                        action: { type: string }
                        grantor: { type: string }
                        grantee: { type: string }
                        record_b64: { type: string, description: base64 of the grant canonical (baton-grant-v1) }
                        proof_b64: { type: string, description: base64 of the grantor's signature over record_b64 }
        '403':
          $ref: '#/components/responses/Forbidden'

  /agent/skills/{skill_id}/archive:
    get:
      tags: [skills]
      summary: Fetch a skill archive over the node's own mTLS
      description: |
        The bytes travel here rather than over the WebSocket, because frames are
        bounded at 1 MiB and an archive is not. The channel
        carries the nudge; this carries the package.

        **A node may fetch only an archive it was actually assigned.** A skill
        the node is not entitled to answers `404`, not `403`: a node that is not
        entitled to a package learns nothing about whether it exists.

        If this control plane's cache does not hold the archive — a promoted
        standby holds every row and no blob — it is re-fetched from
        `source_url` and verified against the digest it already has.
      security: [{ nodeCert: [] }]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The archive
          headers:
            X-Baton-Skill-Digest:
              description: |
                The digest of these bytes. A convenience, never the check — the
                node verifies what it received regardless.
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /skills:
    get:
      tags: [skills]
      summary: Skill packages this control plane holds
      description: |
        `cached` says whether the archive is on this control plane's disk right
        now. It is reported rather than assumed: a promoted standby holds every
        row and no blob, and drawing those as ready would render a state nobody
        verified.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillList' }

    post:
      tags: [skills]
      summary: Ingest a skill package
      description: |
        **The control plane fetches; nodes do not.** It downloads
        from `source_url`, verifies the bytes against `sha256`, and caches them
        — so a node running under `egress: deny` can still be given a skill, and
        an air-gapped install has one component to feed rather than every node.

        The fetch is synchronous and this request fails if it fails. A record
        written before the bytes were verified would be a skill that exists and
        cannot be installed, and the operator would learn about it later from a
        node instead of now from the command they ran.

        `sha256` is not optional. There is no publisher signature behind a skill
        package, so the digest is the only check on what the source serves — and
        it proves the bytes are the ones the directory listed, never that the
        directory listed the right thing.

        Ingesting the same bytes twice returns the existing skill. That is the
        recovery path, not an edge case: re-ingesting is how a lost cache file
        is repaired.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source_url, sha256]
              properties:
                name: { type: string }
                version: { type: string }
                source_url: { type: string }
                sha256:
                  type: string
                  pattern: '^sha256:[0-9a-fA-F]{64}$'
      responses:
        '201':
          description: Ingested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400':
          description: |
            `SKILL_DIGEST_MISMATCH` when the source served other bytes;
            `INVALID_REQUEST` when a field is missing or the digest is malformed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`SKILL_FETCH_FAILED` — the source could not be reached.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /skills/{skill_id}:
    delete:
      tags: [skills]
      summary: Remove a skill package and every install of it
      security: [{ adminCert: [] }]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{skill_id}/install:
    post:
      tags: [skills]
      summary: Install a skill on a node or a template
      description: |
        A `node` install names one workspace. A `template` install names a scene
        and reaches every node whose template matches, **including nodes created
        later** — which is why a template target is not required to exist.

        Installing twice is one install. Two records would make an uninstall
        remove one and leave the skill installed, which is a bug that reports
        success.
      security: [{ adminCert: [] }]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInstallRequest' }
      responses:
        '201':
          description: Installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillInstall' }
        '400':
          description: '`SKILL_TARGET_INVALID` — target_kind is not node or template, or target is empty.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{skill_id}/uninstall:
    post:
      tags: [skills]
      summary: Remove a skill from a node or a template
      description: |
        The nodes affected are told, and each deletes the directory it recorded
        unpacking — bounded by its own state, so a path a person created by hand
        under the same mount is never touched.
      security: [{ adminCert: [] }]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInstallRequest' }
      responses:
        '204':
          description: Uninstalled
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{skill_id}/nodes/{node_id}/code:
    get:
      tags: [skills]
      summary: The code issued for one node and skill
      security: [{ adminCert: [] }]
      description: |
        The per-node half of a skill (setting 5): the `code_id` issued for this
        node's copy.

        This response used to carry a `content_digest` too — a value the node
        posted once at install and that nothing refreshed, so it was true when
        written and quietly false from the first edit onward. What a node's copy
        says NOW is asked for when it is needed, over the `skills.show` console
        verb, and never written down. `content_digest` therefore has one
        persisted meaning left: the value frozen into a code.

        **`code_id` is always present, never omitted when empty.** "No code has
        been issued" and "the field did not make it into this response" must not
        share a representation — a caller reads this to decide whether it can
        mint at all.
      parameters:
        - { in: path, name: skill_id, required: true, schema: { type: string } }
        - { in: path, name: node_id, required: true, schema: { type: string }, description: Node id or display name. }
      responses:
        '200':
          description: The pair
          content:
            application/json:
              schema:
                type: object
                required: [node_id, skill_id, code_id]
                properties:
                  node_id: { type: string }
                  skill_id: { type: string }
                  code_id:
                    type: string
                    description: Empty when no code has been issued — the `no_code` state.
    put:
      tags: [skills]
      summary: Record the code the registry minted for this node and skill
      security: [{ adminCert: [] }]
      description: |
        **Only the id is recorded.** The signed envelope stays with the registry
        that minted it: this control plane has no key with which to check a
        signature and does not hold one it cannot verify.

        An empty `code_id` is refused. A row saying "a code was issued" while
        naming none would be worse than no row — the absence of a row IS the
        `no_code` state.
      parameters:
        - { in: path, name: skill_id, required: true, schema: { type: string } }
        - { in: path, name: node_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code_id]
              properties:
                code_id: { type: string }
      responses:
        '204': { description: Recorded }
        '400':
          description: code_id is empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations:
    get:
      tags: [integrations]
      summary: Which outside services may act on this network, and what each may do
      description: |
        `scopes` is part of every item and callers are expected to render it.
        **An authorisation whose limits are not on screen is read as
        unlimited** — by whoever granted it and by whoever audits it later.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Integrations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationList' }

    post:
      tags: [integrations]
      summary: Authorise a provider to act by signing
      description: |
        What is stored is a **public** key — the half a provider published. The
        risk it carries is not disclosure but substitution: whoever can write
        this record can authorise themselves, which is why it is network state
        rather than a local file.

        `provider` is a value, never a branch: a third party travels the same
        path as the first party, and no scope exists that only one of them can
        hold.

        A new integration arrives **disabled**. Enabling it is a separate act,
        after the fingerprint has been compared with the one the provider shows.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, public_key]
              properties:
                provider: { type: string }
                public_key: { type: string }
                scopes:
                  type: array
                  items: { type: string, enum: [skill.install, resource.install, resource.update] }
      responses:
        '201':
          description: The integration, disabled until confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400':
          description: |
            An unknown scope is refused rather than ignored — a scope nobody
            checks is a permission nobody granted. A private key pasted here is
            refused with its own code, and the sender is told to treat it as
            compromised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations/{id}/enable:
    post:
      tags: [integrations]
      summary: Enable an integration
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The integration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }

  /integrations/{id}/disable:
    post:
      tags: [integrations]
      summary: Disable an integration without deleting its key
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The integration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }

  /integrations/{id}:
    delete:
      tags: [integrations]
      summary: Revoke an integration
      description: |
        Deleting the record **is** revocation, and it takes effect at once:
        verification happens at time of use, so there is no issued token to
        outlive the row and no revocation list to propagate.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Revoked

  /identities:
    get:
      tags: [messages]
      summary: List agent identities
      description: |
        Answers "who exists", scoped to this installation. It does **not**
        answer "who should do this": there is no ranking, no capability match
        and no selection, and their absence is the point rather than an
        omission: BATON delivers to the identity a sender names and never
        chooses which agent should act.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items: { $ref: '#/components/schemas/Identity' }

    post:
      tags: [messages]
      summary: Bind an identity to a node, or unbind it
      description: |
        Binding is explicit rather than implied by enrollment: a node and the
        agent that runs on it are different objects with different lifetimes.
        An empty `node_id` unbinds — the identity stays, which is what lets it
        outlive the node it was running on.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                node_id: { type: string, description: Empty unbinds }
      responses:
        '200':
          description: Bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /inbox/policy/{identity}:
    get:
      operationId: getInboxPolicy
      tags: [messages]
      summary: Read an identity's inbox policy
      description: |
        Answers "whose mail does this agent act on". The policy
        hangs on the RECEIVING identity and lives only in the control plane, so `{identity}` is the recipient, never
        the sender.

        An identity nobody has written a policy for answers 200 with the default
        — `act_on: everyone`, both lists empty — and says so in `policy_set:
        false`. **The default is spoken, not expressed by absence**: "nobody has
        set one" and "somebody set everyone" are two different facts about an
        installation, and a reader that cannot tell them apart cannot audit
        which identities are still open by nobody's decision.

        404 is for an identity this control plane does not have, and that is the
        only thing it means here.
      security: [{ adminCert: [] }]
      parameters:
        - name: identity
          in: path
          required: true
          schema: { type: string }
          description: The receiving agent's identity name — an agent identity, separate from the node it is bound to.
      responses:
        '200':
          description: The policy in force for this identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPolicy' }
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: setInboxPolicy
      tags: [messages]
      summary: Set an identity's inbox policy
      description: |
        The whole policy in one write. **Not a PATCH**: `act_on` and the two
        lists are one decision, and a partial write would let an operator move
        to `allowlist` in one request and populate the list in another, leaving
        a window in which the identity acts on nobody — or, in the other order,
        a window in which a list meant to narrow it is not yet in force. Send
        all four fields; an omitted list is an empty list, an omitted
        `channels` is `allow`.

        **Held mail is re-evaluated immediately**, through the same drain the
        node's reconnect uses. "The policy changed" and "the node came back"
        differ only in what set them off, and a second drain path would be a
        second place for the stop rule to be written.

        The response says `redelivery: triggered` and **NOT a count**. A count
        would be wrong at the moment it was produced: redelivery competes with
        the ordinary send path for the in-flight claim on each message, so a
        message another caller is carrying right now is not this pass's to
        take, and "re-evaluated N" would omit it while looking authoritative.
        The number an operator wants is read from the envelopes' `inbox_policy`,
        which is computed from the policy in force and cannot omit anything.

        Delivery is one way. Moving to `nobody` does not recall mail already on
        the node — what the network has already delivered is never withdrawn
        or replayed. Only messages from this moment on are held. The
        asymmetry is in the fact, not in the design.

        On a standby this is `ErrReadOnly` → 403, a normal condition rather than
        a fault.
      security: [{ adminCert: [] }]
      parameters:
        - name: identity
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetInboxPolicy' }
      responses:
        '200':
          description: The policy as stored, and the fact that redelivery ran.
          content:
            application/json:
              schema:
                type: object
                required: [policy, redelivery]
                properties:
                  policy: { $ref: '#/components/schemas/InboxPolicy' }
                  redelivery:
                    type: string
                    enum: [triggered]
                    description: |
                      A one-value enum on purpose. It records that the pass ran,
                      and it is the shape that refuses to grow into a count —
                      see above for why a count would lie.
        '400':
          description: '`INVALID_ARGUMENT` — `act_on` is not one of the three values. An unrecognised value is NAMED rather than defaulted: falling back to the widest setting would tell an operator who mistyped `nobdy` nothing at all, and they would believe the inbox was closed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /capabilities:
    get:
      tags: [capabilities]
      summary: List registered capabilities
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }

  /capabilities/{id}/revoke:
    post:
      tags: [capabilities]
      summary: Revoke permission to invoke a capability
      description: |
        A capability is what a node SAYS IT CAN DO — its own claim, rewritten
        whenever it reconnects. Whether it may be invoked is a separate
        decision, and this is where that decision is recorded.

        The decision outlives the node's connection, and since the split that is
        structural rather than remembered: re-registration writes the
        capability, and cannot reach the decision.

        Idempotent — revoking something already revoked records who decided it
        this time and returns 204.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /capabilities/{id}/grant:
    post:
      tags: [capabilities]
      summary: Return a capability to the default, which is permitted
      description: |
        Removes the revocation. A capability with no decision recorded against
        it may be invoked, so this is a return to the default rather than the
        granting of something new. Idempotent.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Granted }
        '404': { $ref: '#/components/responses/NotFound' }

  /calls:
    post:
      tags: [calls]
      summary: Invoke a capability on a node
      description: |
        `idempotency_key` is required. Replaying a key returns the original
        call rather than executing a second time — capability invocation can
        have irreversible effects, and a retry after a timeout is normal.

        Defaults to accepting asynchronously (`202`); `?wait=true` blocks until
        the call reaches a terminal state or `timeout_sec` elapses.
      security: [{ adminCert: [] }]
      parameters:
        - name: wait
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallRequest' }
      responses:
        '200':
          description: Completed (only with wait=true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /calls/{call_id}:
    get:
      tags: [calls]
      summary: Fetch a call
      security: [{ adminCert: [] }]
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '404': { $ref: '#/components/responses/NotFound' }

  /core/status:
    get:
      tags: [core]
      summary: Which execution chain, contract and build answered
      description: |
        While the older `/calls` chain still exists, two execution
        chains answer on this control plane, and a suite that ran green on the
        old one reads the same as one that ran green on this one. This is the
        public reading that tells them apart: the new chain answers all three
        fields, the old chain (`/calls`) answers none of them.

        Not `baton status`, which lists this machine's containers — two verbs
        called status that answer different questions.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: This chain and this build
          content:
            application/json:
              schema:
                type: object
                required: [execution_chain, contract_version, build]
                properties:
                  execution_chain: { type: string, enum: [core] }
                  contract_version: { type: string, description: 'semver; the one contract_version every object on this chain carries' }
                  build:
                    type: object
                    required: [version, revision, source_state]
                    properties:
                      version: { type: string, description: "release version; `unknown` when the binary was not told" }
                      revision: { type: string, description: "commit the binary was built from; `unknown` when not stamped" }
                      source_state:
                        type: string
                        enum: [clean, dirty, unknown]
                        description: |
                          Only `clean` makes `revision` usable. A binary built from a dirty
                          tree corresponds to no commit, so "source commit == the tree
                          being judged" has no subject: not-judged, never a pass.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /core/actions:
    get:
      tags: [core]
      summary: The action catalogue this credential may propose
      description: |
        Everything a Planner needs to write a Proposal WITHOUT knowing any CLI
        (Dogfood v1 §五; design supplement ⑤). Every field is generated from
        the action declarations in Core — ⊘ nothing here is written a second
        time, because a catalogue transcribed into a prompt and a CLI syntax
        hardcoded into a Planner are the same thing: a second description that
        drifts from the one that decides.

        ⚠ FILTERED BY THE CREDENTIAL, AND THE FILTER IS A CONVENIENCE. An
        action this subject may not invoke DOES NOT APPEAR — ⊘ it is not
        listed as refused, because a catalogue that shows what you cannot have
        leaks what exists. The BOUNDARY is Core refusing the proposal: action
        grants are deny-by-default and checked when the proposal is submitted,
        so a subject who writes the proposal by hand anyway is stopped there.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: The catalogue, sorted by name so two calls differ only where the actions do
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [name, version, summary, target_kind, effects, properties, params, consequences, state]
                      properties:
                        name: { type: string }
                        version: { type: string }
                        summary: { type: string, description: 'one sentence for a person, in consequence voice' }
                        target_kind: { type: string, enum: [workspace, none] }
                        effects:
                          type: object
                          required: [read, write, external_side_effect, destructive]
                          properties:
                            read: { type: boolean }
                            write: { type: boolean }
                            external_side_effect: { type: boolean }
                            destructive: { type: boolean }
                        properties:
                          type: object
                          required: [reversible, idempotent]
                          properties:
                            reversible: { type: boolean }
                            idempotent: { type: boolean }
                        params:
                          type: array
                          description: 'the input_schema: every key this action accepts, required and optional alike. `[]` for an action that takes none'
                          items:
                            type: object
                            required: [name, type, required, doc]
                            properties:
                              name: { type: string }
                              type: { type: string, enum: [string, object, boolean] }
                              required: { type: boolean }
                              enum: { type: array, items: { type: string }, description: 'the values known for this parameter. On a closed set (`enum_closed: true`) it is ALWAYS present — `[]` when the set is empty or could not be read, and `enum_source` says which; so an absent `enum` means one thing only: this parameter has no set' }
                              enum_closed: { type: boolean, description: '⚠ whether a value outside `enum` is REFUSED (true) or merely unknown (false) — two different things one field cannot carry. `harness` is closed; `placement` is not, and an unlisted placement is legal with every consequence condition about it treated as holding' }
                              enum_source: { type: string, description: 'present exactly when `enum_closed` is true: where the set came from. `declared` for a set written in the declaration; for one the Provider states (the `harness` values are the Workspace Templates the local Provider can start), the source that Provider signed its fact with; `unavailable` when it could not be asked — and then a submission using this parameter is refused, not let through' }
                              doc: { type: string, description: 'one sentence for a Planner. For an optional parameter it says what ABSENCE means — absence is a choice, and a catalogue that only lists the key leaves it guessing' }
                        consequences:
                          type: array
                          description: 'the MAXIMUM consequence set: every class this action MAY produce, with the condition under which it holds. What a particular proposal actually does is `effective_consequences` on its transaction'
                          items:
                            type: object
                            required: [class, when, rendered]
                            properties:
                              class: { type: string, enum: [read-only, reversible, costs-money, data-egress, irreversible] }
                              when: { type: string, enum: [always, leaves-current-host, provider-priced, changes-priced-resources] }
                              rendered: { type: string }
                        state:
                          type: string
                          enum: [available, requires-approval]
                          description: |
                            Computed against the MAXIMUM consequence set, because a catalogue is read before there are
                            parameters and the parameters are what decide. ⚠ So it is an UPPER BOUND:
                            `requires-approval` means "this action MAY need a person", and a particular proposal may
                            turn out not to. The error is one-directional on purpose — a Planner that expected
                            approval and did not need it carries on; one that expected none and met a person has to
                            handle a case it was told would not happen.

                            ⊘ There is no `not-granted` state: an action this subject may not invoke is absent.
                            ⊘ And no `unknown`/`not-declared`: Core is the declaring party in this build, so it can
                            always answer. Those get producers when an App declares actions (Phase 3), not before.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /core/proposals:
    post:
      tags: [core]
      summary: Propose an action — a Proposal in, an Outcome out, always
      description: |
        The new chain's entry: a Proposal in, an Outcome out. The
        actor is the credential's subject; the body cannot name one — an
        `actor` field is kept verbatim like any unknown field and read by
        nothing (Q8, G5). Resending the same `idempotency_key` with an added
        field is a different proposal and answers IDEMPOTENCY_CONFLICT.

        A proposal refused by the validation chain is still a transaction —
        `rejected`, with an error — and is answered 201 with its Outcome. A 4xx
        here would make "the transport refused this" look like "the domain
        refused this"; their next steps are opposite. Only a body that is not a
        JSON object is a request error (400).

        `idempotency_key` is unique per actor (the old `/calls` path scopes it
        per tenant; the chains differ on purpose). Same key and same content
        answers 200 with the original transaction's current Outcome.

        `interaction` must be one Core issued to the same actor; none named ⇒
        Core opens one and the Outcome carries it back. A second open
        proposal with the same interaction, action and target is refused
        STATE_CONFLICT whatever its key; the same interaction with a different
        action or target is not.

        `parameters` may hold only the keys the action's input_schema declares
        (clone: name, to_placement, project; edit-and-test: path, content,
        expected_sha_before, test_path). Any other key is refused,
        INVALID_PROPOSAL naming `parameters.<key>` (the first in sorted order),
        never ignored: an undeclared parameter would not be in the
        plan_digest, so the plan a person approves could not bind it.

        baton.workspace.clone (version 1.0.0) requires `parameters.name`; a
        name already in this control plane's node registry is refused at
        submission, PRECONDITION_UNMET, with the occupant. That is the early
        check; the placement step at execution is the one that meets the real
        world, and a name only the CLI's local register knows is caught there.

        A proposal that passes validation is compiled (T2 §二 ④) and moved to
        `pending_approval` by the default policy (clone is approved by a
        person, rule `clone-default`); the window is 24h, or the proposal's
        `not_after` when earlier.

        `approval.path` is null in this build: the panel's approval page does
        not take the parameter yet, and null says so instead of an address that
        does not open. The verdict arrives at
        `POST /core/transactions/{id}/approve|reject`: a person's approve or
        reject of the frozen plan, bound to its `plan_digest`.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'A Proposal (product contract Proposal §一). Unknown fields are kept, not refused — except unknown constraints.'
              required: [kind, contract_version, source, idempotency_key, via, action, parameters]
              properties:
                kind: { type: string, enum: [proposal] }
                contract_version: { type: string }
                source: { type: string, enum: [action-proposal] }
                idempotency_key: { type: string }
                interaction: { type: string }
                via:
                  type: object
                  description: 'unverified labels {planner, planner_version, session, client}; never used for authorization or policy'
                action:
                  type: object
                  required: [name, version]
                  properties:
                    name: { type: string, example: baton.workspace.clone }
                    version: { type: string, description: 'the major alone ("1") or exact' }
                target:
                  type: object
                  properties:
                    kind: { type: string, enum: [workspace] }
                    id: { type: string }
                parameters: { type: object }
                expected_effects:
                  type: array
                  items:
                    type: object
                    required: [class]
                    properties:
                      class: { type: string }
                      description: { type: string }
                constraints:
                  type: object
                  additionalProperties: false
                  properties:
                    max_cost: { type: object, properties: { amount: { type: string }, currency: { type: string } } }
                    max_downtime_ms: { type: integer, minimum: 0 }
                    not_after: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201': { description: 'A transaction was created (any state, rejected included)', content: { application/json: { schema: { $ref: '#/components/schemas/CoreOutcome' } } } }
        '200': { description: 'Idempotent replay: the original transaction''s current Outcome', content: { application/json: { schema: { $ref: '#/components/schemas/CoreOutcome' } } } }
        '400': { description: 'The body is not a JSON object; no transaction was recorded', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            NOT_GRANTED, or the credential is not an operator's.

            ⚠ NOT_GRANTED is the ONE refusal on this path that is NOT an
            Outcome. Everything the validation chain rejects becomes a
            transaction — `rejected`, with its error — and is answered 201, so
            the Planner gets an id and a replay gets the same answer. A
            subject who holds no grant for the action produces NOTHING: no
            transaction, no Operation, no row (Core is the authorization boundary, and the proof is that
            nothing at all entered the chain). An Outcome would need an id,
            and the id would be that evidence.

            `detail` names the grant that is missing, because the caller's
            next move is to ask an operator for it. It does ⊘ NOT say what the
            subject does hold: a refusal is not a place to enumerate someone's
            permissions, and the asker is not always the subject.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /core/transactions:
    get:
      tags: [core]
      summary: The pending-approval list (Closure ③'s first step)
      description: |
        ★ **This is not a list API, and it must not grow into one.** Four
        fields, named by the consumer and frozen the day they were named. It
        exists because a person could approve and nothing led them to the
        thing to approve: measured 2026-09-21 across three refs, the `core/`
        routes offered only GET-by-id, and nothing else from which an id could
        be inferred.

        The governing principle: **Human approves consequences, not commands.**
        The path is `discover pending → understand the consequence →
        approve/reject → Core records it`, and "you can approve if you know
        the secret URL" is ⊘ a complete approval path.

        ⚠ **No visibility isolation: every pending transaction is visible to
        every reader of this face.** That is a DECISION for S2, ⊘ an
        oversight — multi-tenant visibility is S3's question and this one
        reopens there. ★ It must stay a decision rather than become a
        mechanism: narrowing by subject would quietly turn the self-approval
        defence from A RULE THAT REFUSES into AN ARRANGEMENT THAT HIDES, and a
        refusal leaves bytes behind (`SELF_DECISION`) while not-being-shown
        leaves nothing at all.
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [pending_approval] }
          description: |
            One value, and it is required. A bare list would answer a second
            question ("everything non-terminal") that nobody asked for.
      x-role-note: |
        ⚠ Measured 2026-09-21, and it is ⊘ what "operator" suggests: READING
        this list needs `viewer` (the role every other `core/` read route
        takes), while APPROVING needs `super_admin`. ⇒ Seeing the list and
        being able to act on it are two different permissions, and the gap is
        real rather than a naming accident. ★ Said out loud here because "the
        people who can see it are the people who can approve it" is the
        sentence a reader would otherwise supply for themselves.
      responses:
        '200':
          description: Every transaction waiting for a person, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [transaction, action, expires_at]
                  properties:
                    transaction: { type: string }
                    action:
                      type: object
                      required: [name, summary]
                      properties:
                        name: { type: string }
                        summary:
                          type: string
                          description: From the ACTION DECLARATION, ⊘ from the proposal — what this action IS, not what the proposer said about it.
                    expires_at:
                      type: string
                      format: date-time
                      nullable: true
                      description: ⊘ omitempty. "No deadline" and "this build does not send one" are different sentences.
        '400':
          description: '`INVALID_REQUEST` — `?status=pending_approval` is missing or is some other value'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /core/transactions/{id}:
    get:
      tags: [core]
      summary: A transaction's current Outcome
      description: |
        Contract Transaction §五 (查询): the current Outcome snapshot, the same
        shape a submission returns.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Current Outcome', content: { application/json: { schema: { $ref: '#/components/schemas/CoreOutcome' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /core/transactions/{id}/record:
    get:
      tags: [core]
      summary: The operator view of a transaction's governance record
      description: |
        The governance record: each step's operation_id and status, plan_digest, the
        approval request and verdict, and the full state_history (how an
        injection is located afterwards). A separate view from the Outcome on
        purpose: the Outcome is the Planner's, this is the operator's, and
        ENV-1 measures the difference.

        The step nonce is here and nowhere a Planner reads (T2 §五): Core
        mints it when it dispatches a step to the local Provider, and it is
        the baseline the Receipt's "evidence came from the executor" equality
        is judged against. Null for a step Core runs itself (`via_core:
        false`) and for one not dispatched yet — `status` says which.

        ⚠ ENV-1 cannot hold yet: a Planner can hold only the operator
        credential today (its own credential is C3's question).
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The governance record
          content:
            application/json:
              schema:
                type: object
                required: [transaction, state, actor, interaction, plan_digest, provider_instance_id, approval, steps, state_history]
                properties:
                  transaction: { type: string }
                  state: { type: string }
                  actor: { type: string }
                  interaction: { type: string }
                  plan_digest: { type: string, nullable: true }
                  provider_instance_id:
                    type: string
                    nullable: true
                    description: |
                      The local Provider log this transaction dealt with, pinned the
                      first time the Provider answered it; a later not_found counts
                      as "not executed" only from this instance. Null until the
                      Provider has been asked. Here and not only in a step's evidence:
                      a step whose answer was lost has no evidence to carry it.
                  approval:
                    type: object
                    properties:
                      required: { type: boolean }
                      basis: { type: string }
                      rule_ref: { type: string }
                      request_id: { type: string }
                      expires_at: { type: string, format: date-time, nullable: true }
                      required_rung: { type: string, enum: ['', button], description: 'which door policy worked out this plan needs a person to clear, at PROPOSAL time and from the action''s declared facts and this proposal''s effective consequences. Empty is an ANSWER, ⊘ an omission: nobody was asked. One value today — a rung Core cannot verify must not be a value Core can write down, and the panel''s own password is checked inside the panel process where the control plane never sees it' }
                      cleared_rung: { type: string, enum: ['', button], description: 'the door Core SAW cleared — written from what the request proves, never from what a surface says about itself. A decision reaching the decide endpoint IS the button press. ⊘ A copy of required_rung: collapsed into one field, "Core asked for the button and it was cleared" and "Core asked for something stronger and this is all the receipt dares say" read the same' }
                      decision: { type: object, nullable: true }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        name: { type: string }
                        executor: { type: string }
                        operation_id: { type: string }
                        status: { type: string, enum: [not_started, running, succeeded, failed, unknown, skipped] }
                        started_at: { type: string, format: date-time, nullable: true }
                        ended_at: { type: string, format: date-time, nullable: true }
                        via_core: { type: boolean, description: 'dispatched by Core to an executor, evidence from that executor (Receipt §四); false for admit and await_enrolled' }
                        nonce: { type: string, nullable: true }
                        evidence: { type: object, nullable: true, description: "the executor's answer, verbatim; null until the step ends" }
                  state_history:
                    type: array
                    items:
                      type: object
                      properties:
                        state: { type: string }
                        at: { type: string, format: date-time }
                        by: { type: string, enum: [core, authority, actor] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /core/context:
    get:
      tags: [core]
      summary: What a Harness reads to take over (`baton context`)
      description: |
        Harness contract §三; Architecture Proof §七. The caller's certificate
        subject — the one its proposals are filed under — and that subject's
        open transactions (all of them) and most recent finished ones (up to
        5, each with `receipt_ref`), with each transaction's operations
        `{operation_id, index, name, status, started_at, ended_at}`.

        `next` is the next Operation of the most recent OPEN transaction —
        never what the Planner should do next; null when nothing is open.
        `workspace.id` and `workspace.path` are null in this build, and
        `not_filled` says why (no workspace registry; the path is the
        Provider's).

        ⊘ No nonce and no executor evidence: the reader is the Harness. Those
        are on the Receipt only.
      security: [{ adminCert: [] }]
      responses:
        '200': { description: The context, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /core/transactions/{id}/receipt:
    get:
      tags: [core]
      summary: The Receipt of a finished transaction
      description: |
        Contract Outcome · Receipt §四, generated from the governance record
        and the executors' evidence (Architecture Proof §五之三).

        ⚠ Operator face: each step's `evidence` is the executor's answer
        verbatim, nonce included — the Outcome and `baton context` never carry
        it. Fields this build cannot fill (`previous_receipt_ref`, `measures`,
        `evidence_chain`) are present and null, and `not_filled` says why each
        is. `approval.rule` is the text of the rule when no person decided.

        `authorization` is a SIBLING of `approval`, with the same shape as on
        the Outcome: what the action door concluded at submission, read back
        from the record and ⊘ never recomputed. Together the two blocks are the
        `decision{authorization, approval}`, and they answer different
        questions — "was this subject allowed to ask" and "did anyone have to
        agree".
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The Receipt, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`TRANSACTION_NOT_TERMINAL` — it has not ended, so it has no receipt yet', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /core/transactions/{id}/approve:
    post:
      tags: [core]
      summary: Approve a frozen plan
      description: &decisionDoc |
        A person's verdict on a plan somebody else proposed and Core froze.
        `plan_digest` is required and must be the digest of the plan the
        person was shown — the one in the same Outcome as the plan; any
        other is refused and nothing moves.

        Accepted only from the local approval page (started by the CLI): the
        request must
        carry an `X-Baton-Acting-For: panel-session:<id>` header. ⚠ That label
        is unverified — any process that can run the CLI can set it — so it
        proves only that the request carried it. SuperAdmin,
        because approving a clone admits a node to this network.

        The verdict and its audit record (`core.transaction.approve|reject`,
        acting_for kept as given) commit together or not at all.
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Baton-Acting-For, in: header, required: true, schema: { type: string, pattern: '^panel-session:' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: &decisionBody
              type: object
              required: [plan_digest]
              properties:
                plan_digest: { type: string }
                note: { type: string, description: 'what the person typed; kept with the decision and in the audit record' }
      responses:
        '200': { description: 'The Outcome after the verdict', content: { application/json: { schema: { $ref: '#/components/schemas/CoreOutcome' } } } }
        '400': { description: '`INVALID_REQUEST` — no plan_digest', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`FORBIDDEN` — not SuperAdmin; `DECISION_SURFACE_REQUIRED` — not through the approval page; `ANONYMOUS_DECISION` — one of the two parties has no name, so self-approval could ⊘ be checked; `SELF_DECISION` — the party that proposed cannot be the party that decides (the verdict is void and the transaction stays pending_approval)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`PLAN_DIGEST_MISMATCH` — the page was out of date · `TRANSACTION_NOT_PENDING` — decided, expired or withdrawn already · `APPROVAL_EXPIRED` — expired before this verdict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '`PLAN_UNSEEN` — the plan cannot be rendered, so nobody can have been shown it; nothing moves', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /core/transactions/{id}/reject:
    post:
      tags: [core]
      summary: Reject a frozen plan
      description: *decisionDoc
      security: [{ adminCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Baton-Acting-For, in: header, required: true, schema: { type: string, pattern: '^panel-session:' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: *decisionBody
      responses:
        '200': { description: 'The Outcome after the verdict', content: { application/json: { schema: { $ref: '#/components/schemas/CoreOutcome' } } } }
        '400': { description: '`INVALID_REQUEST` — no plan_digest', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`FORBIDDEN` · `DECISION_SURFACE_REQUIRED` · `ANONYMOUS_DECISION` — one of the two parties has no name, so self-approval could ⊘ be checked · `SELF_DECISION` — the proposer cannot decide their own proposal', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`PLAN_DIGEST_MISMATCH` · `TRANSACTION_NOT_PENDING` · `APPROVAL_EXPIRED`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '`PLAN_UNSEEN`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /events:
    get:
      tags: [events]
      summary: Read the append-only log
      description: |
        `verify=true` additionally walks the hash chain and reports whether it
        is intact.

        On a single-machine install this detects tampering; it does not prevent
        it, because local root can recompute the chain. The response says
        `chain_valid`, not `tamper_proof`, for that reason.
      security: [{ adminCert: [] }]
      parameters:
        - { name: since_seq, in: query, schema: { type: integer, default: 0 } }
        - { name: category, in: query, schema: { type: string, enum: [audit, system] } }
        - { name: event, in: query, schema: { type: string } }
        - { name: node_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: verify, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  next_seq: { type: integer }
                  chain_valid:
                    type: boolean
                    description: Present only when verify=true.
                  chain_broken_at:
                    type: integer
                    description: First sequence that failed verification, when chain_valid is false.
  /events/latest:
    get:
      tags: [events]
      summary: The log's high-water mark
      description: |
        The newest record, and its `seq`.

        `/events` cannot answer this: `limit` counts from the OLDEST end (so
        `limit=1` returns the FIRST record) and caps at 1000 (so a large limit
        returns the 1000th, not the last). Both give a number that is neither
        the mark nor obviously wrong. Paging `next_seq` to the end works and is
        a multi-round protocol every caller would reimplement.

        An empty log answers 200 with `seq: 0`, not 404: "the log is empty" is
        an answer, and a caller taking a baseline needs a number.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: The newest event, or seq 0 when the log is empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer }
                  item:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/Event' }]

  /nodes/{node_id}/console:
    post:
      tags: [console]
      summary: Run an audited management command on a node
      description: |
        The command set is a closed list, and each verb names the layer it acts
        on. There is no endpoint that accepts an arbitrary command string: a
        console that did could not be meaningfully authorized, and its audit
        record could not describe what happened.

        | Scope | Verbs | Acts on |
        |---|---|---|
        | read | `status`, `capabilities`, `tasks` | — |
        | node | `pause`, `resume`, `restart` | the daemon's channel and capability calls |
        | runtime | `runtime.pause`, `runtime.resume`, `runtime.restart` | the supervised runtime |
        | skill | `skills.show` | one unpacked package on that node |

        `pause` does **not** stop the runtime; `runtime.pause` does, by SIGSTOP.
        Neither `restart` nor `runtime.restart` restarts the node itself.

        A node with no runtime answers `denied` to a `runtime.*` verb, not `ok`.

        `skills.show` takes `args.skill` = the package name and answers with
        `data.content_digest` (sha256 over that node's `SKILL.md` with the code
        block stripped) and `data.code_id` (the code written IN the file).
        Both are **computed when asked and never stored**: a persisted copy
        would have to be refreshed to stay true, and a stale digest is
        indistinguishable from a fresh one. The node judges neither value — it
        holds no issuer key, so whether a code is good is the registry's answer,
        not its own. A package that is absent, or present with no `SKILL.md`,
        answers `error` rather than `ok` with an empty digest.

        The audit record is written **before** the command is dispatched. An
        action whose audit write failed does not happen.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleRequest' }
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                type: object
                required: [result, audit_event_id]
                properties:
                  result: { type: string, enum: [ok, denied, error, timeout] }
                  output: { type: string }
                  data: { type: object, additionalProperties: true }
                  audit_event_id: { type: string }
                  duration_ms: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/takeover:
    get:
      tags: [takeover]
      summary: Who currently controls this node's runtime
      description: |
        An expired lock is reported as `held: false` **with its details intact**.
        "Nobody has it, and the last person to was X" is more use than silence,
        so an expiry is not deleted on read.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current lock state
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held:
                    type: boolean
                    description: Whether the lock is still in force at this moment.
                  lock: { $ref: '#/components/schemas/TakeoverLock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/takeover/acquire:
    post:
      tags: [takeover]
      summary: Take exclusive interactive control of a node's runtime
      description: |
        Backs `baton attach <node> --takeover`. Watching a runtime is
        unrestricted and unrecorded; **controlling** it is exclusive and audited,
        because typing into a working agent is a different act from looking at
        it. Control is a mode of attach, and it is also leased.

        **Audited before control is granted.** If the audit write fails the
        takeover is refused — an unlogged interactive session on a working agent
        is the gap an incident review cannot close. A linked outcome record is
        appended afterwards, so the log answers *who actually had the terminal*
        rather than only *who asked*.

        **Leased, not held.** The lock expires and must be renewed while the
        session is open. A session normally ends when the human leaves; the lease
        exists for when they do not get to, because a dropped connection releases
        nothing. Without an expiry one lost network locks a node out permanently.

        `force: true` takes the lock from a live holder. It is recorded as
        `node.takeover.preempted`, a different event from an acquisition, so that
        reading the log for "who displaced whom" does not require knowing which
        field to check.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
                  description: |
                    Unique per takeover session. It is what stops a stale client
                    from releasing the session that replaced it.
                force:
                  type: boolean
                  default: false
                  description: Take the lock from a live holder. Audited as a preemption.
                reason:
                  type: string
                  description: Shown in the audit trail.
      responses:
        '200':
          description: Control granted
          content:
            application/json:
              schema:
                type: object
                required: [lock, audit_event_id]
                properties:
                  lock: { $ref: '#/components/schemas/TakeoverLock' }
                  audit_event_id: { type: string }
        '409':
          description: |
            Refused. `TAKEOVER_HELD` names the current holder and since when —
            "someone else has it" sends a person to go and ask around.
            `NO_RUNTIME` and `RUNTIME_NOT_ENTERABLE` mean there is no terminal to
            enter at all.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: '`AUDIT_UNAVAILABLE` — the takeover was not granted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{node_id}/takeover/renew:
    post:
      tags: [takeover]
      summary: Extend a lease this session still holds
      description: |
        Called about every `renew_within_sec` while a session is open. A lock
        that lapsed and was taken by someone else is **not** renewed: silently
        reclaiming it would put two people on the same terminal, each believing
        it was theirs.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '200':
          description: Lease extended
          content:
            application/json:
              schema:
                type: object
                required: [lock]
                properties:
                  lock: { $ref: '#/components/schemas/TakeoverLock' }
        '409':
          description: '`TAKEOVER_LOST` — this session no longer holds the node.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{node_id}/takeover/release:
    post:
      tags: [takeover]
      summary: End a takeover session
      description: |
        Scoped to the session id. Releasing a lock that has already moved on is
        a **no-op, not an error**: a client shutting down late must not end the
        session that replaced it.

        Recorded after the fact, unlike acquisition — the session is already
        over, and refusing to end it because the log is unavailable would leave
        the node locked for no benefit.
      security: [{ adminCert: [] }]
      parameters:
        - { name: node_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /web/handoff:
    post:
      tags: [system]
      summary: Mint a single-use link that signs a browser in
      description: |
        The API authenticates with client certificates, which a browser cannot
        present without an import ritual nobody should perform to read their own
        dashboard. The CLI already holds a certificate, so it vouches for the
        browser: this returns a token, `baton web` opens a URL carrying it, and
        `GET /web/session` swaps it for a cookie.

        The resulting session is **viewer-only** — every write still requires a
        certificate — and the token is single-use with a 60-second life, because
        URLs end up in shell history and browser history.

        There is deliberately no source-address restriction; behind a published
        port it could not work. Network exposure is the port binding's job.
      security: [{ adminCert: [] }]
      responses:
        '201':
          description: Link minted
          content:
            application/json:
              schema:
                type: object
                required: [handoff_token, expires_in]
                properties:
                  handoff_token: { type: string }
                  expires_in: { type: integer, example: 60 }
                  url: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /web/session:
    get:
      tags: [web]
      summary: Redeem a handoff token for a session cookie
      description: |
        The browser's half of the certificate-to-browser handoff. `POST /web/handoff` mints a
        single-use token over mTLS; this swaps it for a cookie.

        UNAUTHENTICATED BY DESIGN, and safe only because the token is the
        credential: single-use, 60 seconds, and redeemed exactly once. A second
        request with the same token is a 401, not a second session.

        The cookie is `HttpOnly`, `Secure` and `SameSite=Strict` — which is also
        why a panel served from another origin can never receive it, and why
        `baton panel` proxies rather than trying.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '303':
          description: Cookie set; redirected to the console
        '401':
          $ref: '#/components/responses/Unauthorized'

  /web/logout:
    post:
      tags: [web]
      summary: Revoke this browser session
      description: |
        Revokes the session server-side and clears the cookie. Missing or
        unknown cookie is not an error — the caller's stated intent is to end
        up logged out, and they are.
      responses:
        '204':
          description: Session ended

  /system/info:
    get:
      tags: [system]
      summary: What this build is and what it can do
      description: |
        `features` is the authority for what the UI renders. A capability
        absent from the binary is absent from the interface, rather than
        present and disappointing.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Build and cluster identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  edition: { type: string, example: personal }
                  features:
                    type: array
                    items: { type: string }
                    example: [capability.invoke, console.audit, ha.mirror]
                  cluster_id: { type: string, nullable: true, description: 'null until this control plane has a cluster identity — a mirror inherits one only after its first snapshot' }
                  cluster_state: { type: string, enum: [ready, pending-first-snapshot], description: 'why cluster_id is null when it is' }
                  ca_fingerprint: { type: string, nullable: true, description: "this network's CA fingerprint (standard X.509 SHA-256, openssl form) for a peer that pins this CA to compare; null on a control plane holding no CA" }
                  leader_epoch: { type: integer }
                  db_driver: { type: string, example: sqlite }
                  read_only: { type: boolean }
                  restart_identity:
                    type: string
                    enum: [same, would-refuse-every-client, unknown]
                    description: |
                      **If this process restarted right now, would it come back able to serve
                      the same people?** Every other field here answers "how am I doing now",
                      and a demoted former primary answers all of them reassuringly while
                      serving on a CA it has already given away: `demote` hands the signing
                      key over and clears it in memory, but the live TLS config was built at
                      startup and still holds the pool it was given then.
                  
                      `would-refuse-every-client` means the next boot rebuilds that pool from
                      disk, finds nothing, and refuses every operator and every node with
                      "certificate signed by an unknown authority" — a true sentence that
                      points at the wrong layer. `unknown` means this view could not compute
                      it, and is never dressed up as `same`.
                  role: { type: string, enum: [master, standby, unknown] }
                  observed_by: { type: string, description: which control plane this view is from }
                  observed_at: { type: string, description: RFC3339 when this view was taken }
                  self:
                    type: object
                    properties:
                      role: { type: string, enum: [master, standby, unknown] }
                      host: { type: string }
                      leader_epoch: { type: integer, nullable: true }
                  peers:
                    type: array
                    nullable: true
                    description: >
                      The standbys this master OBSERVES: a mirror pulling a
                      snapshot is it checking in. null = this view cannot
                      enumerate peers (a standby's own view returns null); [] =
                      can enumerate, zero standbys. Fields are limited to what a
                      master actually observes — a standby's own leader_epoch and
                      snapshot lag are NOT here, the master never sees them; they
                      would have to be self-reported over the standby's channel.
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        role: { type: string, enum: [master, standby, unknown] }
                        status: { type: string, description: node status (active, offline, pending) }
                        last_seen: { type: string, nullable: true, description: RFC3339 of the standby's last snapshot pull; null if it has never checked in }

  /system/promote:
    post:
      tags: [system]
      summary: Promote this standby to a writable primary
      description: |
        The one write a mirror accepts: flips this control plane from read-only
        mirror to writable primary, bumps the leader epoch, and persists the
        primary mode so a restart stays primary. Addressed to the standby's OWN
        endpoint (the master it replaces does not answer). This is the raw
        promotion verb: operator-initiated, never automatic, and it checks no
        offer itself. The planned path is `POST /system/transfer/accept`, where
        the current master has signed an offer, the gaining node verifies it,
        signs a receipt, and only then promotes.
      security: [{ adminCert: [] }]
      responses:
        '200':
          description: Promoted; the store now accepts writes
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, example: master }
                  read_only: { type: boolean }
                  leader_epoch: { type: integer }
        '501':
          description: This build has no promotion path (no mirror)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /system/demote:
    post:
      tags: [system]
      summary: Demote this primary back to a read-only mirror
      description: |
        The split-brain fix after a transfer: the old master stops accepting
        writes and records mode=mirror so a restart stays a mirror. The epoch is
        unchanged. With `new_master`, its connected nodes are told to follow to
        that endpoint before it steps down. SuperAdmin.

        A master demotes only once it can verify the gaining node promoted (the
        receipt leg): pass the `receipt` `transfer master accept` returned, whose
        epoch must exceed this master's, or `force` for an emergency demote that
        cannot be verified (recorded as unverified). Without either it is refused.
      security: [{ adminCert: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_master: { type: string, description: endpoint to redirect connected nodes to }
                receipt:
                  type: object
                  description: the countersigned receipt from `transfer master accept`
                  properties:
                    payload: { type: string, description: 'base64(master-transfer-receipt canonical)' }
                    signature: { type: string, description: 'base64(network key over it)' }
                force: { type: boolean, description: demote without a verified receipt (emergency; recorded as unverified) }
      responses:
        '200':
          description: Demoted; the store now refuses writes
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, example: standby }
                  read_only: { type: boolean }
        '409':
          description: |
            `RECEIPT_REQUIRED` — no receipt and no force. `RECEIPT_INVALID` — the
            receipt does not prove a takeover (bad signature, wrong network, or an
            epoch that does not exceed this master's).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /system/transfer/accept:
    post:
      tags: [system]
      summary: Accept a signed master-transfer offer and promote
      description: |
        Verifies a `master-transfer-offer` signed by this network's master and,
        if valid and addressed to this node, promotes this standby. Acts on the
        signed bytes (parses the canonical). SuperAdmin, on the standby's own
        endpoint.
      security: [{ adminCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, payload, signature]
              properties:
                public_key: { type: string }
                payload: { type: string }
                signature: { type: string }
      responses:
        '200':
          description: Offer accepted; this node is now the master
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, example: master }
                  read_only: { type: boolean }
                  leader_epoch: { type: integer }
                  network_id: { type: string }
                  gaining: { type: string }
                  receipt:
                    type: object
                    description: countersignature over the promoted epoch; carry it to the old master to demote
                    properties:
                      payload: { type: string }
                      signature: { type: string }
                      public_key: { type: string }
                      nonce: { type: string }
                      timestamp: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The offer has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /healthz:
    get:
      tags: [system]
      summary: Process liveness
      security: []
      responses:
        '200': { description: Process is up }

  /readyz:
    get:
      tags: [system]
      summary: Service readiness
      description: |
        Readiness means the database is reachable and migrations are applied —
        not merely that the process exists. A mirror also reports its snapshot
        lag here, and reports it as unknown rather than zero when it cannot be
        determined.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  db: { type: string, enum: [ok, error] }
                  snapshot_lag_seconds:
                    type: number
                    description: Mirrors only. Negative means unknown.
                  restart_identity:
                    type: string
                    enum: [same, would-refuse-every-client, unknown]
                    description: |
                      Readiness answers **"can I do the job I was
                      configured for"**, and this is the half that nothing else
                      asked: a demoted former primary keeps serving on the CA it
                      has already given away, so every other signal here reads
                      fine while it is one restart away from refusing every
                      operator and every node.

                      ⊘ It is NOT "am I the primary". A configured standby is
                      read-only and ready for its own role; failing it would
                      make every HA deployment permanently red, and a signal
                      that is always red gets switched off.
        '503':
          description: |
            Not ready. Two distinct reasons, and they must not be collapsed:
            a mirror that has never applied a snapshot (`INTERNAL`), and a node
            that holds no client-CA and can therefore verify nobody
            (`NO_SIGNING_AUTHORITY`). The second one is served by a
            process that is otherwise answering requests normally.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    adminCert:
      type: mutualTLS
      description: Admin client certificate.
    nodeCert:
      type: mutualTLS
      description: Node client certificate, SAN role `agent` or `standby`.

  schemas:
    CoreOutcome:
      type: object
      description: 'An Outcome (product contract Outcome §一) — the fields this build produces.'
      required: [kind, contract_version, transaction, action, target, interaction, status, terminal]
      properties:
        kind: { type: string, enum: [outcome] }
        contract_version: { type: string }
        transaction: { type: string }
        action:
          type: object
          description: 'the action AS DECLARED — ⊘ not as the proposer described it. The approval page renders summary and effects; both come from the declaration, so the page never keeps a second catalogue of what actions do.'
          required: [name, version, summary, effects]
          properties:
            name: { type: string }
            version: { type: string }
            summary: { type: string, description: 'one sentence for a person, in consequence voice (Action Capability §一, G7). Empty string when the declaration has none — ⊘ never omitted' }
            effects:
              type: object
              nullable: true
              description: 'the four objective facts. Null ONLY on a transaction whose action this build does not declare (a rejected UNKNOWN_ACTION), where four falses would be a statement about an action Core does not have. Every key is always sent: `destructive: false` is a statement, an absent `destructive` is a reader on the wrong view.'
              required: [read, write, external_side_effect, destructive]
              properties:
                read: { type: boolean }
                write: { type: boolean }
                external_side_effect: { type: boolean, description: 'starts or changes something that outlives this action, outside the target it names' }
                destructive: { type: boolean }
        parameters:
          type: object
          additionalProperties: true
          description: 'the proposal''s parameters, VERBATIM — same keys, same nesting, nothing renamed or flattened. `{}` for an action that takes none; ⊘ never omitted, because "takes none" and "this view does not carry them" are different answers.'
        target: { type: object, nullable: true, description: 'id holds only a stable identifier that is never reused, null until there is one — never a name; name is the display name. ⚠ Known misalignment (T-BE-126): id is null throughout this build, because the chain resolves the source by name', properties: { kind: { type: string }, id: { type: string, nullable: true }, name: { type: string } } }
        interaction: { type: string, description: 'always present (Outcome §一): the Interaction the proposal named, echoed as named, or the one Core opened when it named none — a rejected proposal included' }
        status: { type: string, enum: [proposed, pending_approval, approved, executing, completed, failed, rejected, expired, modified, withdrawn] }
        approval:
          type: object
          nullable: true
          description: 'the governance record, on BOTH paths — REQUIRE_APPROVAL and ALLOW. Null only on a transaction policy never reached (a rejected proposal), and rendered null rather than omitted: an absent key cannot be told apart from a view that does not carry it, and the reading a page would guess is the reassuring one (G4).'
          required: [required, basis, rule_ref, rule, path, expires_at, decision, required_rung]
          properties:
            required: { type: boolean, description: 'whether a person had to decide. `false` is a RULING — the rule that let it through is named in rule_ref' }
            basis: { type: string, enum: [policy, floor, undeclared-consequences], description: 'floor has no producer in this build: no action declares an approval floor' }
            rule_ref: { type: string, description: 'which rule decided; a name a person can look up, ⊘ not a number' }
            required_rung: { type: string, enum: ['', button], description: 'which door policy worked out this plan needs a person to clear, when the plan was proposed, from the action''s declared facts and this proposal''s effective consequences — the approval page asks for exactly this and no other. Empty is an ANSWER (nobody was asked), ⊘ an omission; a page that cannot read this must ask for the strongest door it has, never the weakest' }
            rule: { type: string, description: 'that rule''s sentence. ⊘ Not omitted when empty — a rule with no text must render as an empty sentence a person can see, not vanish' }
            path: { type: string, nullable: true, description: 'relative (e.g. /?approve=tx_…); the local side completes it — Core does not know the approval page''s port and must not store it. Null until the approval page takes the parameter' }
            expires_at: { type: string, format: date-time, nullable: true, description: 'null on the ALLOW path: nobody was asked, so there is nothing to expire' }
            decision:
              type: object
              nullable: true
              description: 'who decided and when — ONE place on both paths, so a reader never checks `required` first to know where to look. Null while a person is still being waited for.'
              required: [decided_by, decided_at, surface, plan_digest]
              properties:
                decided_by: { type: string, description: '"core" on the ALLOW path; the subject who decided otherwise' }
                decided_at: { type: string, format: date-time }
                surface: { type: string, nullable: true, description: 'which adjudicating surface. ★ Non-null IF AND ONLY IF required is true — that biconditional is the reader''s test, and it only works because this is rendered null rather than omitted' }
                plan_digest: { type: string, nullable: true, description: 'the bytes the decision bound. Same iff-rule as surface' }
        authorization:
          type: object
          nullable: true
          description: |
            What the ACTION DOOR concluded AT SUBMISSION: whether the subject
            held an active allow grant for the action, where no grant means
            refused. A SIBLING
            of `approval`, ⊘ not a field inside it: the two answer different
            questions — authorization is "was this subject allowed to ASK",
            approval is "did anyone have to AGREE". Both can be yes, and a page
            that conflated them would show a person one sentence where there
            are two decisions. (Together these two blocks are the
            `decision{authorization, approval}`.)

            Null — ⊘ not omitted, and never an empty object — on a transaction
            the door never reached, which means validation refused the proposal
            first. ⊘ Null never means "not granted": a subject without the
            grant produces no transaction at all, so there is nothing here to
            be null.

            Read back from the record, ⊘ never recomputed: recomputing answers
            "may this subject invoke this action now", and a receipt has to
            answer "what was true when this was let in". A grant revoked an
            hour later would otherwise rewrite a truthful record, silently.
          required: [granted, required_grants, source, subject, action, checked_at]
          properties:
            granted: { type: boolean, description: 'true on every record that exists — a refusal produces no record. Read it together with `source`' }
            required_grants:
              type: array
              items: { type: string }
              description: 'the grants this action DECLARES it needs. `[]` means it needs none — an answer, ⊘ not missing data; the approval page renders "this action needs no authorization" from it, and null would render as "unknown"'
            source:
              type: string
              enum: [core_action_grants, declaration]
              description: 'where the answer came from. `declaration` = the action requires nothing and the grant table was never read; `core_action_grants` = the table was read and it said yes. Without this, `granted` would carry no information at all'
            subject: { type: string, description: 'from the CREDENTIAL, ⊘ never from the request body (Q8)' }
            action: { type: string }
            checked_at: { type: string, format: date-time }
        plan:
          type: object
          description: 'present when status is pending_approval or approved — what the person is asked to approve, or approved. Carries EVERY field plan_digest covers, and plan_digest itself, in this one response: show these fields and return this digest. Reading the steps from one request and the digest from another can show one version and approve another, and the verdict still passes.'
          required: [plan_digest]
          properties:
            plan_digest: { type: string, description: 'sha256 over every other field of this object; the digest a decision must name' }
            steps:
              type: array
              description: 'operation_id and status are not here: operation_id is derived from the digest, status changes as the plan runs'
              items:
                type: object
                required: [index, name, executor, summary]
                properties:
                  index: { type: integer }
                  name: { type: string }
                  executor: { type: string }
                  summary: { type: string, description: 'the words written for a person; covered by the digest' }
            effective_consequences:
              type: array
              description: 'what THIS proposal actually does, computed at compile from the action''s declared maximum consequence set and these parameters. Only consequences that HOLD are listed; an empty array means none of the declared ones hold. A condition this build cannot evaluate is treated as holding, and `rendered` says so in the same sentence — the person reading the approval page cannot otherwise tell a measured consequence from an assumed one.'
              items:
                type: object
                required: [class, rendered]
                properties:
                  class: { type: string, enum: [read-only, reversible, costs-money, data-egress, irreversible] }
                  rendered: { type: string, description: 'the sentence a person reads; written in the action declaration, never assembled from the class by a reader' }
            unreadable: { type: string, description: 'present only when the stored plan could not be read; then steps are absent' }
        progress:
          type: object
          description: 'present while status is executing'
          properties:
            step_index: { type: integer }
            step_count: { type: integer }
            step_name: { type: string }
        state_changes:
          type: array
          description: 'present on completed and on failed — on failed too, even empty: where the world stopped. `after` is "unknown" for a step whose effect nobody can state'
          items:
            type: object
            properties:
              subject: { type: string }
              field: { type: string }
              before: {}
              after: {}
        terminal: { type: boolean }
        error:
          type: object
          properties:
            code: { type: string, enum: [INVALID_PROPOSAL, UNKNOWN_ACTION, STATE_CONFLICT, IDEMPOTENCY_CONFLICT, PRECONDITION_UNMET, PLAN_CHANGED, APPROVAL_REJECTED, APPROVAL_EXPIRED, EXECUTION_FAILED] }
            message: { type: string }
            remediation: { type: array, items: { type: object, properties: { text: { type: string } } } }
            detail: { type: object }
        retryable: { type: boolean, description: 'present exactly when error is. false whenever a side effect has happened (state_changes not empty, or a step unknown), whatever the failure_class default' }
    Role:
      type: string
      enum: [master, agent]
      description: |
        What a node DOES for the network. There are two, and a node carries a
        SET of them (see `Node.roles`).

        `standby` is not here on purpose: it is a STATE of the master role, not
        a kind of node, and it lives in `master_state`. A standby that also runs
        agents is an ordinary thing to want, and a third enum value would make
        it inexpressible.

        `slave` is not here either. It was a deprecated alias, which this
        repository does not keep (CLAUDE.md rule 1); the alias and the verbs it
        served were deleted.

    NodeSuspension:
      type: object
      description: |
        The answer to `/suspend` and `/resume`. Carries BOTH axes, because they
        are read together or not at all: `suspended` is what an operator
        decided, `status` is what the control plane observed. A suspended node
        does go offline, and a surface showing one without the other reports
        the consequence as though it were the cause.
      properties:
        node_id: { type: string }
        display_name: { type: string }
        suspended: { type: boolean }
        status: { $ref: '#/components/schemas/NodeStatus' }
        reason:
          type: string
          description: Why, as recorded. Empty after a resume.
      required: [node_id, suspended, status]

    NodeStatus:
      type: string
      enum: [pending, active, offline, revoked]
      description: |
        There is deliberately no `healthy`. Health is a judgement from evidence
        that may be missing, and a status that cannot say "unknown" eventually
        renders a failed probe as green.

    Trust:
      type: string
      enum: [official, self_built, unverified]

    Network:
      type: object
      description: |
        What a network is. One identity, many addresses, many endpoints — split
        because `one Network == one endpoint` and `one Network == one Master`
        are on D-32 §28's must-not-hard-code list.
      properties:
        network_id: { type: string, example: net_7f93a2b1c4d5e6f7 }
        display_name: { type: string }
        public_key:
          type: string
          description: The half a peer verifies against. Publishable.
        fingerprint:
          type: string
          description: |
            What a person compares between two screens. A base64 key cannot be
            checked by eye; this can, and that comparison is the only defence
            when a key is carried by hand.
          example: 'SHA256:L8QFVEhsOw5G+m2kC8tJZ0/PRfacVUUmsvkqGAgv/ks'
        fingerprint_alg:
          type: string
          description: |
            How `fingerprint` above was computed, because the answer changed
            once and nothing said so. On 2026-08-25 the computation was
            corrected (a PEM with CRLF line endings hashed differently from the
            same key with LF), and every party that had pinned the old string
            then saw a different one for the SAME key — which is exactly what a
            substituted key looks like. The cloud registry publishes
            `sha256-b64/trimspace-pem`; the two agree for a canonically encoded
            PEM and diverge for one that is not, so the strings being different
            is information rather than a defect.
          example: 'sha256-b64/canonical-pem'
        key_id:
          type: string
          description: |
            Identifies the KEY rather than a way of writing it: sha256 over the
            raw 32-byte ed25519 public key, first 8 bytes, hex. **This is the
            field two parties compare.** It survives any change to encoding or
            to how the fingerprint is spelled, so `key_id` equal with
            `fingerprint` different reads as "same key, written differently",
            while `key_id` different is the event a fingerprint was always meant
            to catch. Same format as the cloud registry's, verbatim: a shared
            identifier two sides spell differently cannot be compared.
            Empty when the stored text is not an ed25519 public key.
          example: 'ed25519:66342d52b91b3abc'
        addresses:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              source: { type: string, enum: [dns, cloud-registry] }
        endpoints:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              port: { type: integer }
              protocol: { type: string }
              priority: { type: integer }
        cloud_address:
          type: string
          description: |
            The network's canonical hosted id, e.g. `team@example.com`,
            absent for a network with no hosted name. It is the
            cloud-registry address VERBATIM — the registry returns the canonical
            form and BATON serves it unchanged: the hosted registry is one
            replaceable resolver, and BATON does not construct or hardcode its
            addresses. The agent form
            `<name>.<agent>@<domain>` is split from this by the CLI.
        avatar:
          nullable: true
          description: The network's avatar, or null when none is set. Display metadata, not identity.
          type: object
          properties:
            content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
            data_base64: { type: string }
        admission:
          type: string
          enum: [open, closed]
          description: |
            Whether this network takes NEW applications. It says
            nothing about the nodes already in it, the applications already
            queued, or whether the network can be discovered — closing the door
            closes one door. A client that cannot read this field must render
            `unknown`, never `open`.
        admission_changed_at: { type: string, format: date-time }
        admission_changed_by: { type: string }
        created_at: { type: string, format: date-time }

    ResourceOrigin:
      type: object
      description: |
        One link, not a chain. B fetching from A and C fetching from
        B records C←B; B's own origin is B's record to keep. Modelling the full
        chain means deciding what happens when a link disappears, and nothing
        needs that yet.
      required: [via, network, resource_id, fetched_at]
      properties:
        via:
          type: string
          enum: [member, public]
          description: |
            Which kind of read produced this, and it is here so that one `null`
            does not cover two facts.

            Without it, a null `network_id` means both "the read never learned
            an identity" and "the read could have and did not" — two facts
            needing opposite responses, one normal and one a defect, spelled
            identically.

            - `member` — read from that network's member face over mTLS, with
              this machine's office there. The identity is bound to the session,
              so `network_id` is REQUIRED; a member read carrying none is
              refused rather than recorded as null.
            - `public` — an anonymous read of a `--scope public` resource.
              `network_id` is null, ALWAYS, even though the public document
              carries one: that value is a string in a response body from a
              server nothing authenticated, and giving an unbound self-report
              the same spelling as a bound identity is how the difference is
              lost.
        network:
          type: string
          description: |
            The reference the fetch was given — a name, a domain, or an entry
            point URL. **What somebody typed**, which is a different fact from
            who answered.
        network_id:
          type: string
          nullable: true
          description: |
            The identity of the network that answered, when it is known.

            Separate from `network` because they are two facts, and the first
            time they disagree is the only time it matters: a name repointed at
            a different network, two networks reachable at one address, or a
            public fetch that never learned an identity at all.

            **`null` if and only if `via` is `public`.** It says so rather than
            being filled in from the reference — deriving an identity from a
            string somebody typed is the same defect as matching a member by
            endpoint hostname instead of by key.
        resource_id:
          type: string
          description: The resource's id THERE, which has nothing to do with its id here.
        hash:
          type: string
          nullable: true
          description: |
            What the bytes were at fetch time, so a later comparison can ask
            whether the source has moved on. Nothing compares it today.
        fetched_at:
          type: string
          format: date-time
          description: |
            When the bytes were obtained — **not when this copy was published**.
            It is paired with `hash`: two timestamps describing one pair would
            make any future "has the source changed" comparison answer about the
            wrong instant.

    Resource:
      type: object
      description: One thing a network shares. One envelope across every type; unknown fields are null (rule 7); the type-specific body is in detail.
      properties:
        kind: { type: string, example: Resource }
        resource_id: { type: string }
        network_id: { type: string, nullable: true }
        type: { type: string, enum: [skill, knowledge, policy, workflow, template, other, plugin] }
        name: { type: string }
        version: { type: string }
        folder: { type: string }
        visibility: { type: string, enum: [private, network, public] }
        publisher:
          type: string
          nullable: true
          description: |
            Who published this copy here, taken from the CERTIFICATE that
            presented the publish — not from the request body, which has no such
            field.

            **This is the one thing on this envelope that is not a claim.**
            Everything in `origin` is what the publisher said about where the
            bytes came from; this is what the control plane observed about who
            said it. A reader wanting to know whose work a resource is has to
            read both: `publisher` is who put it here, `origin` is where they
            say they got it.
        hash: { type: string, nullable: true }
        source:
          type: string
          nullable: true
          description: |
            The publisher's own sentence about where this came from — "adapted
            from the Kubernetes docs". Free text.

            **Not parsed, not verified, and not `origin`.** It is the
            publisher's own free-text sentence; the
            structured "this copy was fetched from network X" fact lives in
            `origin` instead.
        signature: { type: string, nullable: true }
        origin:
          nullable: true
          description: |
            Where this copy was fetched from. **`null` means it was authored
            here** — there is no third state, because this is written at fetch
            time by the thing doing the fetching rather than derived from
            something that could fail to answer.

            **Everything in it is a CLAIM by whoever published it, not a verdict
            by this control plane.** The hash arrived with the
            claim; the network identity is what the far side answered at fetch
            time and this control plane was not there; anyone holding an
            operator certificate can publish any origin at all. The one fact
            here that is not a claim is `publisher`, which is taken from the
            certificate that presented the publish.

            So render it as "came from" — never "verified", "authentic" or
            "trusted". What would make it a verdict is a signature over the
            bytes by the origin network's key, and that is a separate decision.
          allOf: [{ $ref: '#/components/schemas/ResourceOrigin' }]
        license: { type: string, nullable: true }
        compatibility: { type: object, nullable: true }
        permissions_required: { type: array, nullable: true, items: { type: string } }
        tags: { type: array, items: { type: string } }
        detail: { type: object }
        review:
          type: string
          enum: ['', pending, admitted, denied]
          description: |
            Whether the network's owner has accepted this. Only publications to
            the `network` scope are reviewed; pending and denied ones do not
            exist for members.
            **Orthogonal to `visibility`**: `visibility` says which layer it
            would be on, `review` says whether anyone agreed to put it there.
            An agent publishing to `network` cannot make itself visible by
            saying so.

            **`''` is a real, fourth value and it is a SENTINEL**, not a synonym
            for `admitted`. It means the row predates review entirely (it was
            written before 2026-08-31) or was never subject to it (`private` is
            the agent's own drawer and nobody is asked). It is emitted as a raw
            string and never as `null`, because `null` would mean "this server
            has no such field" — the one thing a client must be able to tell
            apart from "nobody was asked".

            Read side rule, and it is not stylistic: **hide `pending` and
            `denied`**, do not show-only-`admitted`. Written the second way,
            every resource shared before this field existed would vanish.
        reviewed_by:
          type: string
          description: The operator certificate's identity. Empty until decided; empty on an `admitted` row is a bug worth seeing, which is why it is not omitted.
        reviewed_at: { type: string }
        review_reason:
          type: string
          description: Required on `denied`, optional on `admitted`.
        created_at: { type: string }
        updated_at: { type: string }
        error: { type: string, nullable: true }
    ResourceList:
      type: object
      properties:
        kind: { type: string, example: ResourceList }
        items: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: |
            How many resources are in each `review` state, over ALL of them and
            ignoring any `type`/`visibility` filter on the request — so a
            filtered page can still say how many are waiting, and an empty page
            stops being ambiguous between "nothing is waiting" and "nothing was
            ever submitted". The `''` key is present and counts the rows that
            predate review.

            **Owner face only.** The agent and public lists return the same
            envelope WITHOUT this key: telling a member how many resources exist
            that it cannot see is a smaller version of the leak that hiding them
            is for.
    ResourcePublish:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [skill, knowledge, policy, workflow, template, other, plugin] }
        name: { type: string }
        version: { type: string }
        folder: { type: string }
        visibility: { type: string, enum: [network, public] }
        source: { type: string }
        hash: { type: string }
        license: { type: string }
        body: { type: string }
        detail: { type: object }
    NetworkInvitation:
      type: object
      description: |
        Self-contained: it carries the inviting network's public key, because
        resolving another network's key needs a resolver and trusted peers
        (both >v1.1). A person compares fingerprints — the same manual step the
        provider passkey uses, for the same reason.
      properties:
        apiVersion: { type: string }
        kind: { type: string, example: NetworkInvitation }
        invitee:
          type: string
          description: |
            Inside the signed payload as well as here. This field is for
            reading; the signature is what decides.
        from_network: { type: string }
        to_network: { type: string }
        to_network_key: { type: string }
        to_network_fingerprint: { type: string }
        token:
          type: string
          description: |
            The credential. Shown once. It admits the invitee it was minted
            for — the delivery channel is what protects it.
        token_hash: { type: string }
        expires_at: { type: string, format: date-time }
        payload: { type: string, description: 'base64 of the signed bytes' }
        signature: { type: string }
        nonce: { type: string }
        timestamp: { type: string, format: date-time }

    Attestation:
      type: object
      description: |
        A signature, and the exact bytes it covers. Both travel together so a
        verifier never has to reconstruct the payload from parsed fields.
      properties:
        network_id: { type: string }
        public_key: { type: string }
        payload: { type: string, description: 'base64 of the signed bytes' }
        signature: { type: string, description: 'base64' }
        nonce: { type: string }
        timestamp: { type: string, format: date-time }

    SignedAttestation:
      type: object
      description: |
        A canonical payload and the detached ed25519 signature over it, both
        base64. Used to carry the grant and the request into a cross-network
        token exchange — the signer built the bytes, the verifier uses these
        exact bytes and never reconstructs them.
      required: [payload, signature]
      properties:
        payload: { type: string, description: 'base64(canonical)' }
        signature: { type: string, description: 'base64(ed25519 detached)' }

    DeliveryGrantIssue:
      type: object
      required: [subject_network_id, subject_key, scope, expiry_at]
      properties:
        subject_network_id: { type: string, description: The network being endorsed to send here. }
        subject_key:
          type: string
          description: |
            Its network public key, single-line base64(DER SubjectPublicKeyInfo).
            Not a PEM: a PEM's internal newlines would split the 8-line canonical.
        scope:
          type: string
          example: 'coder,reviewer'
          description: Which agents here it may deliver to. Comma-separated, ascending and unique, or `*`.
        expiry_at: { type: string, format: date-time }
        endpoint:
          type: string
          description: |
            Where this network would reach the peer, recorded while the
            relationship is being established so the delivery path never
            resolves.

            **Endorsing a sender includes writing down how to answer them.** An
            earlier cut called this optional, reasoning that the peer needs no
            endpoint from us to deliver INTO us — true, and it missed what the
            way back is FOR: telling them something only we can know.

            A delivery accepted into a mailbox and later refused has no
            synchronous answer; the sender already has its `202`. Without a
            route back that failure is silent forever — and the spool leg is
            exactly where the relationship is naturally one-directional, so the
            case that most needs a report was the case that structurally could
            not produce one. The fix is not a reciprocal grant: binding "can be
            told something failed" to "may send me mail" would make two
            different permissions one.

            > A channel you cannot tell the other end has failed is not a
            > channel. It is a drop box.

            Still optional on the wire, because an endorsement without a way
            back is a real state — it means asynchronous failures toward that
            network cannot be reported, which is better said than invented.
        ca:
          type: string
          description: |
            The peer's certificate authority, pinned for TLS on the way back.
            An address with no way to know who answers at it is not a route.
        domain:
          type: string
          description: What the peer is called — `<network>.<domain>`, the name its agents' addresses `<network>.<agent>@<domain>` are built from.

    DeliveryGrant:
      type: object
      description: |
        A grant this network issued endorsing another to deliver to a scope of
        its agents. On issue it carries the signed bytes for the peer to keep;
        `revoked_at` says whether it is still live.
      properties:
        grant_id: { type: string }
        subject_network_id: { type: string }
        scope: { type: string }
        issued_at: { type: string, format: date-time }
        expiry_at: { type: string, format: date-time }
        payload: { type: string, description: 'base64(delivery-grant canonical)' }
        signature: { type: string, description: "base64(this network's key over it)" }
        public_key: { type: string, description: "This network's public key, PEM." }
        revoked_at: { type: string, format: date-time }
        endpoint:
          type: string
          description: |
            Where this network was told the peer answers, as the operator wrote
            it. Absent means it was never recorded — not that the peer has no
            address; it knows perfectly well where it answers.
        domain:
          type: string
          description: |
            What the peer network is CALLED, `<label>.<domain>` — the name its
            agents' addresses `<label>.<agent>@<domain>` are built from.
            Absent means messages arriving from it land with no `source_address`
            — readable, and not repliable.
        reply_route:
          type: string
          enum: [recorded, incomplete, absent]
          description: |
            Whether this network can tell that peer that a delivery from it
            failed here: a delivery refused after acceptance is reported back
            to the sender by a reverse delivery. DERIVED, and shown rather than left to
            be re-derived: the rule spans two fields — a route needs an endpoint
            AND the CA that answers there — and every reader who combines them
            themselves is a reader who can get it wrong in the direction that
            looks fine.

            - `recorded` — both present; an asynchronous failure can be reported.
            - `incomplete` — **one of the two.** Half a route is not a route:
              this behaves exactly like `absent` while looking, at the moment of
              endorsement, exactly like `recorded`.
            - `absent` — neither was written down.

            Answered on the issue response too, and that is the more useful of
            the two places: an endorsement with no way back is cheapest to fix
            in the second after it was made, by the person who made it. A
            listing only helps someone who goes looking, and the failure mode is
            that nobody knows to look — it surfaces only on the day a bounce is
            needed and silently does not happen.

            Upgrading does not retroactively fill this in. An endorsement made
            before the route was a field records nothing, because it is local
            knowledge an operator writes down, not something the peer sends.

            The CA itself is not echoed: it is a certificate, it is long, and
            whether one is present is already stated here.

    DeliveryTokenExchange:
      type: object
      description: |
        A's request to turn a delivery grant into a short-lived token
        — this network signs both the grant and the token and is their only
        verifier. `grant` is what THIS network signed for A (carries A's
        pinned public key in line4); `request` is what A signs now to prove
        liveness and possession of that key. Same shape as
        `AccessTokenExchange`, different attestation family — the purpose lines
        differ so one can never be presented as the other.
      required: [grant, request]
      properties:
        grant: { $ref: '#/components/schemas/SignedAttestation' }
        request: { $ref: '#/components/schemas/SignedAttestation' }

    DeliveryToken:
      type: object
      description: |
        A short-lived credential this network signed from a delivery grant. A
        presents it to deliver; this network verifies only its own signature,
        its expiry, and that the recipient is within scope.
      properties:
        token_id: { type: string, example: dtoken-3f2c... }
        payload: { type: string, description: 'base64(delivery-token canonical)' }
        signature: { type: string, description: "base64(this network's key over it)" }
        issued_at: { type: string, format: date-time }
        expiry_at: { type: string, format: date-time }
        scope:
          type: string
          example: 'coder,reviewer'
          description: |
            Comma-separated recipient names, ascending and unique, or `*`. No
            verb and no type: the purpose line already says what kind of grant
            this is, and a one-member enum is a field with one caller.

            `*` is safe here in a way it is not in the access scope, and that
            difference is the reason these are two families. There, `*` ranges
            over a CLOSED ENUM, so it silently grants whatever is added to the
            enum later. Here it ranges over recipient names — an open set the
            granting network already controls completely.

    DeliveryEnvelope:
      type: object
      description: |
        The subset of `MessageEnvelope` that crosses a network boundary. The subset IS the point: `state`, `box` and
        `delivered_at` are this network's facts and do not cross, and signing a
        fact that does not travel would say the sender has an opinion about our
        mailbox. `correlation_id` and `metadata` are absent because both are
        RESERVED (schema only) with no implementation anywhere — carrying them
        would claim a path that does not exist.
      required: [message_id, sender, recipient, source_network, destination_network, created_at]
      properties:
        message_id: { type: string }
        sender:
          type: string
          description: |
            The CLAIM. Signed so it cannot be swapped in flight, which is not
            the same as being believed: what makes it usable is
            `source_network` matching the network whose key verified the
            signature.
        recipient: { type: string, description: The receiving agent. Never carries a domain. }
        source_network: { type: string, description: Selects which key verifies. }
        destination_network: { type: string, description: Verified against this network, never rewritten. }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            The sender's DECLARATION. Re-ruled on landing to
            `min(declared, this network's ceiling)` — retention is finite by
            default and that is this network's promise to itself,
            not the sender's to make.
        type: { type: string }
        content_type: { type: string }
        payload_size: { type: integer, description: 'Recomputed on landing; in the canonical so it cannot be altered in flight.' }
        thread_id: { type: string }
        reply_to: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/DeliveryAttachment' }

    DeliveryAttachment:
      type: object
      description: The manifest only. Bytes do not travel in it.
      required: [index, name, size, sha256]
      properties:
        index: { type: integer }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, description: 'Recomputed on landing; what arrives is a claim.' }

    DeliveryReport:
      type: object
      required: [report, original]
      properties:
        report:
          allOf: [{ $ref: '#/components/schemas/SignedAttestation' }]
          description: |
            The destination's signed verdict — an 8-line `delivery-report`
            canonical: purpose, reporter, sender, message_id, original_sha256,
            outcome, detail, timestamp. The outcome and the detail are inside
            the signature because a verdict that could be edited in flight is a
            verdict anybody who carried it could write.
        original:
          type: object
          required: [envelope, payload_sha256, signature]
          description: |
            The delivery this report is about, echoed back so the sender can
            verify its own signature over it. That IS the scope rule — nothing
            is stored on the sender's side, so nothing can be forgotten or
            forged.
          properties:
            envelope: { type: string, description: 'base64 of the envelope JSON as delivered' }
            payload_sha256:
              type: string
              description: |
                The digest the signature covers. The BODY is deliberately not
                echoed: the canonical covers the digest, never the bytes, so a
                report proves what it is about without carrying a payload back
                across a boundary it had no reason to cross twice: a body is
                store-and-forward only and is never carried anywhere else.
            signature: { type: string, description: "base64 of the SENDER's own signature" }

    DeliveryReceive:
      type: object
      description: |
        One signed delivery, plus the grant its token was minted from. The
        signature covers `canonical(envelope) ‖ payload_sha256`, where the
        digest is COMPUTED from the bytes rather than carried: a digest beside
        the bytes it describes is a claim, and a claim inside its own signature
        proves nothing about what arrived.

        There is deliberately no `alg` field (a negotiable algorithm is a
        downgrade surface) and no `key_id` (`source_network` already selects
        the key; a second selector is an input where the sender says which key
        to use).
      required: [grant, envelope, payload, signature]
      properties:
        grant: { $ref: '#/components/schemas/SignedAttestation' }
        envelope: { $ref: '#/components/schemas/DeliveryEnvelope' }
        payload: { type: string, description: base64 }
        signature: { type: string, description: 'base64, detached, by the key the grant pins' }
        attachment_bytes:
          type: object
          additionalProperties: { type: string, description: base64 }
          description: |
            The files, keyed by their SHA256, BESIDE the envelope rather than
            inside it. The envelope is what gets signed and each attachment's
            digest is already folded into the canonical, so the bytes verify
            against bytes the sender signed without the signed shape changing —
            the only way to add a payload to a signed structure without
            re-opening the signature.

            Keyed by digest and not a list: content addressing means two
            manifest entries can name one file, and sending it twice would make
            the sender pay for the receiver's data structure.

            Every entry in the manifest must have its bytes here. A manifest
            whose bytes cannot be fetched must not look like one whose bytes
            can, so the delivery is refused rather than landed
            in part — `ATTACHMENT_BYTES_MISSING`, `ATTACHMENT_BYTES_MALFORMED`,
            `ATTACHMENT_DIGEST_MISMATCH`, `ATTACHMENT_SIZE_MISMATCH`, or
            `ATTACHMENTS_TOO_LARGE`, each naming which promise was broken.

            **2 MiB across the whole delivery**, not per file: each door that
            receives the bytes rules its own size ceiling once, and this is
            this door's ruling.
            A per-file ceiling with no total is not a ceiling — the
            request-body cap would be what actually refused, and that number
            was chosen for avatars.

            The offline-mailbox leg does NOT carry these. A delivery with
            attachments to a network that is offline is refused
            `ATTACHMENTS_NOT_RELAYED`: terminal for that leg, transient for the
            message — it goes through when that network is online.

    DeliveryReceipt:
      type: object
      properties:
        message_id: { type: string }
        accepted: { type: boolean }
        duplicate:
          type: boolean
          description: |
            The `message_id` was already here. A SUCCESS, not a failure: the
            sender's idempotency key did its job.

    AccessTokenExchange:
      type: object
      description: |
        B's request to turn a grant into a short-lived token
        (cloud/spec/access-grant-contract §二之一). `grant` is what this network
        signed for B (carries B's pinned public key in line4); `request` is what
        B signs now to prove liveness and possession of that key.
      required: [grant, request]
      properties:
        grant: { $ref: '#/components/schemas/SignedAttestation' }
        request: { $ref: '#/components/schemas/SignedAttestation' }

    AccessToken:
      type: object
      description: |
        A short-lived, scoped session credential this network signed (SK_A) from
        a grant. B presents it to fetch a resource; this network verifies only
        its own signature, its expiry, and that the resource is within scope.
      properties:
        token_id: { type: string, example: token-3f2c... }
        payload: { type: string, description: 'base64(access-token canonical)' }
        signature: { type: string, description: 'base64(SK_A over it)' }
        issued_at: { type: string, format: date-time }
        expiry_at: { type: string, format: date-time }
        scope: { type: string, example: 'read:skill/*' }


    AccessGrant:
      type: object
      description: |
        A grant A issued endorsing network B to read a scope of A's resources
        (cloud/spec/access-grant-contract §四). On issue it carries the signed
        grant (payload/signature/public_key) for B to keep; on list those are
        omitted and `revoked_at` says whether it is still live.
      properties:
        grant_id: { type: string, example: grant-3f2c... }
        issuer_network_id: { type: string }
        subject_network_id: { type: string }
        scope: { type: string, example: 'list:skill/*,read:skill/*' }
        issued_at: { type: string, format: date-time }
        expiry_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true, description: 'null = active' }
        payload: { type: string, description: 'issue only — base64(access-grant canonical)' }
        signature: { type: string, description: 'issue only — base64(SK_A over it)' }
        public_key: { type: string, description: "issue only — A's own key, for B to pin" }

    ReceivedGrantImport:
      type: object
      required: [grant]
      description: The bundle an issuer hands over — the signed grant plus the connection descriptor to reach and trust it.
      properties:
        grant:
          type: object
          required: [payload, signature, public_key]
          properties:
            payload: { type: string, description: 'base64(access-grant canonical)' }
            signature: { type: string, description: 'base64(issuer signature)' }
            public_key: { type: string, description: "issuer's public key PEM — the grant is signed by it" }
        connection:
          type: object
          description: where the issuer answers and the CA to pin (optional)
          properties:
            endpoint: { type: string, example: 'https://a.example.com:9443' }
            ca: { type: string, description: "the issuer's CA, PEM" }

    ReceivedGrant:
      type: object
      description: |
        A grant this network holds from another (cloud/spec/access-grant-contract
        §六). List omits the signed bytes and CA; a single Get carries them.
      properties:
        grant_id: { type: string }
        issuer_network_id: { type: string }
        subject_network_id: { type: string }
        scope: { type: string }
        issued_at: { type: string, format: date-time }
        expiry_at: { type: string, format: date-time }
        endpoint: { type: string, description: where the issuer answers }
        resolver:
          type: string
          enum: [dns, cloud-registry]
          description: |
            Which resolver the issuing network declared as its own
            authoritative method, recorded when an operator established the
            relationship — never resolved again at delivery time.

            It decides which channel a delivery to that network takes, and it is
            NOT a list to try in order — recovery re-asks the same authority,
            never a different one. It is rendered here because it
            governs routing and is security-relevant: while it was import-only,
            the only way to discover it had been set wrong was to send a message
            and collect an error.
        ca_fingerprint: { type: string, description: 'SHA-256 of the pinned CA (openssl form), shown raw for the operator to compare' }
        imported_at: { type: string, format: date-time }
        issuer_key: { type: string, description: 'Get only' }
        ca: { type: string, description: 'Get only — the pinned CA PEM' }
        payload: { type: string, description: 'Get only — base64(access-grant canonical)' }
        signature: { type: string, description: 'Get only' }

    Integration:
      type: object
      description: |
        An outside service authorised to act on this network by signing.
        `public_key` is not masked: it is not a secret, and hiding it teaches
        the reader that it is one.
      properties:
        integration_id: { type: string, example: itg_d9d6a8ecbb52 }
        provider:
          type: string
          description: A value, never a branch. Third parties travel the same path.
          example: baton-cloud
        public_key: { type: string }
        fingerprint: { type: string }
        scopes:
          type: array
          description: |
            Default-deny. An action absent from this list is refused, and an
            unrecognised scope string is refused rather than ignored.
          items: { type: string }
        target_network:
          type: string
          description: |
            The third leg of the three-way check — `request.target ==
            integration.target_network == this network`. Without it, a record
            copied from another network's configuration would be valid here.
        enabled:
          type: boolean
          description: |
            False until the provider's copy is confirmed. A record that accepted
            signed requests the moment it was written would open the door before
            checking who knocked.
        created_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }

    Skill:
      type: object
      required: [skill_id, name, version, sha256, source_url, cached]
      properties:
        skill_id: { type: string }
        name: { type: string }
        version: { type: string }
        sha256:
          type: string
          description: |
            Shown always. It is the only thing an operator can compare against
            what the directory told them, and there is no publisher signature
            behind it — hiding it would remove the one check available.
        source_url: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        cached:
          type: boolean
          description: |
            Whether the archive is on this control plane's disk. Reported, not
            assumed: a promoted standby holds every row and no blob.
        installs:
          type: array
          items: { $ref: '#/components/schemas/SkillInstall' }

    SkillInstall:
      type: object
      required: [target_kind, target]
      properties:
        target_kind: { type: string, enum: [node, template] }
        target:
          type: string
          description: A node id, or a runtime template name, per target_kind.
        created_at: { type: string, format: date-time }

    SkillInstallRequest:
      type: object
      required: [target_kind, target]
      properties:
        target_kind: { type: string, enum: [node, template] }
        target: { type: string }

    SkillList:
      type: object
      properties:
        apiVersion: { type: string, example: baton.mailloop.dev/v1alpha1 }
        kind: { type: string, example: SkillList }
        items:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        next_cursor: { type: string }

    NodeSkill:
      type: object
      required: [skill_id, name, version, sha256, via]
      properties:
        skill_id: { type: string }
        name: { type: string }
        version: { type: string }
        sha256: { type: string }
        via:
          type: string
          enum: [node, template]
          description: |
            How this node came to have the skill. The node does not act on it —
            it is carried so drift can be reported without a second query.
        code_id:
          type: string
          description: |
            The skill-code issued for THIS node and this skill, or absent when
            none has been.

            **Absent is a state, not a missing value.** A skill can be assigned
            and carry no code — nobody has issued one yet, or a migrate gave the
            node a new id and invalidated the old one. The node unpacks the
            skill either way and reports `no_code`; refusing to deliver a skill
            for want of a code would let an attribution feature break skill
            delivery, which is a far larger thing than the attribution it adds.

            Only the id travels. The signed envelope stays with the registry
            that minted it: this control plane holds the handle to write into
            the file and the handle the node reports back, and it never holds a
            signature it has no key to check.

    NodeSkillList:
      type: object
      properties:
        apiVersion: { type: string, example: baton.mailloop.dev/v1alpha1 }
        kind: { type: string, example: NodeSkillList }
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeSkill' }
        next_cursor: { type: string }

    IntegrationList:
      type: object
      properties:
        apiVersion: { type: string, example: baton.mailloop.dev/v1alpha1 }
        kind: { type: string, example: IntegrationList }
        items:
          type: array
          items: { $ref: '#/components/schemas/Integration' }
        next_cursor:
          type: string
          description: |
            Present from the first version. This repository's own acceptance
            suite was wrong twice because something read only page one.

    Identity:
      type: object
      required: [name, bound]
      properties:
        name:
          type: string
          description: The address a sender writes, rendered `@name`.
        node_id:
          type: string
          description: Where it resolves right now. Absent when unbound.
        bound: { type: boolean }
        created_at: { type: string, format: date-time }

    InboxPolicy:
      type: object
      required: [identity, act_on, allow_senders, allow_networks, channels, policy_set]
      description: |
        Whose mail this identity acts on. It is a property of the
        RECIPIENT, and the control plane is the only place it lives — the node
        never learns a policy exists, and mail that reaches it is mail it is
        meant to work on.
      properties:
        identity: { type: string }
        act_on:
          type: string
          enum: [everyone, allowlist, nobody]
          description: |
            Three values, not a boolean plus a list whose emptiness has to be
            interpreted. `allowlist` with both lists empty means **nobody is
            allowed**, and `everyone` means no list is consulted; a two-state
            switch would have to spell those two with the same empty list. An
            absent key covering more than one fact is a shape this repository
            has already paid for.

            `nobody` is the operator's "closed": mail is still RECEIVED and
            still visible here — it is simply never handed to the node.
            `everyone` and `allowlist` are both "open".
        allow_senders:
          type: array
          items: { type: string }
          description: |
            Identity names ON THIS NETWORK, plus operator mTLS subject names.
            Consulted only when `act_on` is `allowlist`.

            **Local names only.** A sender on another network is named by an
            address (`<network>.<agent>@<domain>`), and an address comes from
            the network's hosted name, not its identity, and can change — a
            policy anchored to something that can change stops meaning what it was written to mean. Cross-network senders
            are allowed a whole network at a time, below.

            The operator is not exempt. `nobody` holds the operator's own mail
            too, and under `allowlist` the operator lists their own subject
            name. The reason is not evenhandedness: the policy asks whose mail
            the agent acts on, and the operator is one of the whos. An
            exemption would make `nobody` a word meaning "nobody except one
            party the word does not mention".
        allow_networks:
          type: array
          items: { type: string }
          description: |
            `network_id`s — a whole network's senders at once, this network's own
            id included. Consulted only when `act_on` is `allowlist`.

            The two lists are OR-ed, not AND-ed:
            `source_network ∈ allow_networks ∨ (source_network == this network ∧
            sender ∈ allow_senders)`. They answer two different questions —
            "these people" and "everyone on these networks" — and an AND would
            force every use of `allow_senders` to also name its own network,
            which is writing one fact twice.

            An id here is a registration number, not a proof: what makes a
            cross-network message's `source_network` believable is the
            verification at landing, not its presence in this list.
        channels:
          type: string
          enum: [allow, hold]
          description: |
            What happens to mail that came in through a facility's service
            — a message with `via` on its envelope, stamped by the node daemon
            with the facility's id. `allow` acts
            on it like any other; `hold` keeps it received and not delivered,
            with `held_reason: channel` or `channel (unverified)` by what the
            stamp was worth. Consulted after `act_on` and the lists. Always
            present; `allow` when nobody said.
        policy_set:
          type: boolean
          description: |
            False means nobody has ever written one and the fields above are
            this build's default. It is a separate fact from `act_on` and cannot
            be derived from it — see the GET description.

    SetInboxPolicy:
      type: object
      required: [act_on]
      description: The whole policy. See `PUT` for why this is not a PATCH.
      properties:
        act_on:
          type: string
          enum: [everyone, allowlist, nobody]
        channels:
          type: string
          enum: [allow, hold]
          description: Absent is `allow`. The reply always says which.
        allow_senders:
          type: array
          items: { type: string }
          description: Absent is an empty list. Local identity names only.
        allow_networks:
          type: array
          items: { type: string }
          description: Absent is an empty list.

    SendMessage:
      type: object
      required: [to, body]
      properties:
        for:
          type: string
          description: |
            The facility in the recipient's office this is for, written by the
            sender; the receiving daemon delivers it into that facility's own
            inbox, and if the facility is not running there it refuses delivery
            and the message stays queued. For example
            `baton.slack` to open a new Slack thread through the relay. A
            reply sent from inside the node copies the original's `via` here
            automatically; this field is the explicit spelling.
        to:
          type: string
          description: |
            Either a bare agent name on THIS network, or the canonical address
            of an agent somewhere else: `<network>.<agent>@<domain>`, built from
            the network's hosted name `<network>.<domain>` with the agent name
            inserted after the network label,
            for example `dns.coder@batonnetwork.org`.

            One field, because it is one question — who is this for. The `@`
            tells the two apart and cannot be ambiguous: an agent name may not
            contain one, the same rule that makes the cross-network marker on a
            recipient's disk unforgeable.

            A cross-network address is matched against relationships already
            established — **never resolved at send time**. Addressing a domain
            this network has no relationship with is a clear refusal
            (`NO_DELIVERY_GRANT`), not a lookup: a delivery path that resolves
            is one where whoever can answer for a name decides where the message
            goes.

            The reply for a cross-network send is `202`, and it says which of
            three things happened — `accepted_by_network` (the destination took
            it) or `accepted_by_mailbox` (the destination is offline and this is
            its registry-run mailbox, **not** delivery). Neither says
            "delivered": that is a fact on the far side of a boundary this
            network cannot see across.
        message_id:
          type: string
          pattern: '^msg_[0-9a-fA-F-]{36}$'
          description: |
            The id of the send being retried. Optional — omit it for a new
            message and one is minted.

            It is the idempotency key; there is no separate field, because the
            id has to survive a restart, a relocation, a snapshot restore and a
            federated forward anyway, and a second identity for one thing is one
            too many.
        reply_to:
          type: string
          description: |
            The message this one answers, which is what puts the two in one
            thread. Optional; omitting it starts a new thread.

            The control plane derives `thread_id` from it — a reply inherits
            the thread of what it answers, anything else IS its own root. A
            caller does not send `thread_id`: one that could would be able to
            place a message into a conversation it was never part of.

            `400 INVALID_ARGUMENT` if it names no message. Answering a message
            that does not exist is a mistake worth hearing about, not a silent
            new thread.
        attachments:
          type: array
          description: |
            What this message carries alongside its body, in the order the
            sender chose. The BYTES are not here: upload them first with
            `POST /messages/attachments`, which answers with the digest named
            below.

            **The size is not a field a sender supplies.** It is read off the
            stored bytes — a sender that could declare it could declare a small
            one and reference a large blob, and every limit downstream would be
            checked against a number the sender chose.

            **The ceiling depends on where this message is going**: 10 MiB
            within this network, 2 MiB across one. The check happens here, not
            at upload, because an upload does not yet know the recipient. A
            refusal names the destination when the destination is what made the
            limit narrow — the reader's next action is then to send it
            elsewhere, not to shrink the file.

            Naming a digest that is not stored is `400`: a manifest that
            promises bytes nobody uploaded gives its recipient an attachment
            that can never be fetched.
          items:
            type: object
            required: [name, sha256]
            properties:
              name:
                type: string
                description: |
                  The filename. It travels in the ENVELOPE, so a recipient can
                  see what they were sent without fetching anything.
              content_type:
                type: string
                description: |
                  The sender's declaration. Defaults to
                  `application/octet-stream` — BATON does not look inside an
                  attachment to guess, because an opinion about what a file is
                  would be an opinion about its contents.
              sha256:
                type: string
                description: Lowercase hex, as returned by the upload.
        body:
          type: string
          format: byte
          description: |
            Opaque bytes, base64. The control plane stores and forwards them and
            does nothing else with them.
        content_type: { type: string, default: text/plain }
        type:
          type: string
          maxLength: 128
          description: |
            The sender's word for what kind of message this is. Stored,
            carried and rendered — never interpreted: no registry, no
            execution meaning, and no control-plane code path may
            branch on it. The 128-byte cap is transport hygiene, refused with
            400; it is a label, not a place for content.
        ttl:
          type: string
          description: |
            Go duration. Retention is finite by default (7d) and bounded at
            720h (30d) — a queue with no expiry becomes an archive of business
            content nobody chose to keep. A value the parser cannot read, a
            non-positive one, or one over the ceiling is refused with 400; it
            used to be silently replaced by the default, which let a sender
            believe a retention they never got.

    AttachmentRef:
      type: object
      description: |
        One entry of a message's manifest, as the control plane reports it.

        **Deliberately not the same shape a sender POSTs.** The request form
        has no `size`: a sender that could declare it could declare a small one
        and reference a large blob, and every limit downstream would then be
        checked against a number the sender chose. Here the size is read off
        the stored bytes, so it is a fact rather than a claim — which is also
        why these two are two schemas and not one with an optional field.
      required: [name, content_type, size, sha256]
      properties:
        name:
          type: string
          description: The filename, as the sender named it.
        content_type:
          type: string
          description: |
            The sender's declaration, carried unchanged. BATON does not look
            inside an attachment to check it.
        size:
          type: integer
          format: int64
          description: Bytes, measured on what was stored.
        sha256:
          type: string
          description: Lowercase hex. The content address the bytes are fetched by.

    MessageEnvelope:
      type: object
      required: [message_id, sender, recipient, state]
      description: |
        Everything BATON may read about a message. There is no payload field
        here, and adding one would put bodies into every listing and console
        that renders this schema.
      properties:
        message_id: { type: string }
        sender:
          type: string
          description: |
            The sending agent. The network it belongs to is its own field.

            **Filled by the control plane from the authenticated connection,
            never by the sender.** There is no request field that sets it, and
            adding one would be a mistake: the receiving agent's decision about
            whether to trust an instruction rests on this name, so it is worth
            more as something nobody can supply than as something convenient to
            supply. A node with no identity bound sends under `node:<name>`
            rather than being refused — "an agent nobody has named yet cannot
            report a failure" is exactly backwards.
        recipient:
          type: string
          description: The receiving agent.
        source_network:
          type: string
          description: |
            An address is an agent AND a network (D-32 §27). Always present —
            for a message between two agents here, this equals
            `destination_network`. **Local delivery is not a special case**, and
            an empty field meaning "here" would be the invariant this shape
            exists to remove, hiding in a blank.
        source_address:
          type: string
          description: |
            Where a reply goes — the canonical `<network>.<agent>@<domain>`,
            built from the network's hosted name with the agent name inserted
            after the network label. Present only when the sender is on another network AND
            this network recorded what that network is called, in the delivery
            grant it issued that sender.

            A SECOND field beside `source_network`, not a better spelling of it:
            one says who signed (a registration number, proved by the
            signature), the other says where to answer (an address, local
            knowledge the operator wrote down). **Never derived from
            `source_network`** — an id in an address field makes every message
            look answerable and fails at the moment of answering.
        destination_network: { type: string }
        state:
          type: string
          enum: [unread, read]
          description: |
            The MAILBOX's word, not the transport's. Mail keeps two vocabularies
            and shows the recipient only one: `unread`/`read` belong to the
            person, while the transport facts (handed over, bounced) are their
            own fields — `delivered_at` here — and a recipient never sees them.

            `read` is set by fetching the body, and is pinned to the
            `message.read` audit record written by that same act, so the two
            cannot disagree. It is the MAILBOX that read it, not a person: one
            network's master has one mailbox and may have several operators, and
            who opened it is answered by the audit log.

            **This value does not widen delivery state.** Delivery state
            records only what BATON observed about carrying the message, and it
            still refuses `read` as a DELIVERY state: whether an agent runtime read
            something has no stable meaning — fetched, put in a context window,
            attended to are three different moments and only the runtime knows
            which. This `read` is a different actor doing a different thing, one
            this control plane observes directly. It is not precedent for
            widening delivery state.

            THIS ENUM MAY NOT GAIN A VALUE THAT NAMES AN ACTIVITY.
            `working`, `completed` and `rejected` are things the agent says
            about its work, and they travel as messages (`type: status` with
            `reply_to`), because BATON cannot verify them and would end up
            timing them out. A new value is legitimate only if BATON can
            determine it from the act of carrying the message.

        box:
          type: string
          enum: [inbox, deleted]
          description: |
            Which box the message is in. A separate dimension from `state`, and
            deliberately so: a message can be in the deleted box AND unread, so
            one field cannot spell both. If `deleted` were a third `state`
            value, deleting an unread message would destroy its unread mark and
            restoring it could not know where to put it back.

            Deleting destroys nothing. The envelope is
            infrastructure fact and the audit trail refers to it; what changes
            is which box a person sees it in.
        inbox_policy:
          type: string
          enum: [allowed, held, unknown]
          description: |
            The recipient's inbox policy applied to THIS message's sender, and
            nothing else. `held` means the policy does not act on
            this sender, so the message stays here — received, visible, not
            handed to the node.

            **It does not say whether the message was delivered.** That fact has
            its own field, `delivered_at`, and migration 0030 settled that
            transport facts live in fields rather than in a word beside them:
            "not handed over yet" IS `delivered_at` empty — a definition, not an
            inference. An earlier draft of this field spelled a four-value
            `disposition` (`queued`/`delivered`/`held`/`unknown`) and brought
            back exactly the vocabulary 0030 retired: `delivered` re-spelled the
            field next to it, and `queued` borrowed a word already ruled
            redundant in order to mean something new. Only one fact here is new
            — the verdict — so the field is the verdict alone.

            A DELIVERED message may read `held`, and that is correct rather than
            a contradiction: the policy changed after the message was handed
            over, and delivery is not recalled: a message the network has
            recorded as delivered is never withdrawn or replayed afterwards.
            The two facts are
            orthogonal and each keeps its own field.

            `held` is COMPUTED from the policy in force, never stored. The policy
            is the single source of it; a column beside it would be a second copy
            that goes stale the moment somebody writes a policy — and silently,
            because nothing reads a stored word back to check it against the rule
            that produced it.

            `unknown` means the control plane could not read the policy that
            decides. Answering `allowed` there would be a probe failure painted
            green.

            Holding does not change expiry. A message held for seven days expires
            exactly as a waiting one does; `expires_at` says when, for both.
        held_reason:
          type: string
          enum: ['', nobody, sender-not-allowed, channel, 'channel (unverified)']
          description: |
            Why, when `inbox_policy` is `held`; the empty string otherwise, and
            present either way. `nobody` is the switch being closed;
            `sender-not-allowed` is an allowlist that does not name this sender;
            `channel` is `channels: hold` on a message a facility's service
            relayed in (`via`), which the sending node vouched for
            (`via_isolated: true`); `channel (unverified)` is the same hold on
            a `via` that is only a label on that node. Four values because
            they call for four different actions, and one word covering them
            would leave the reader unable to tell which thing to go and change.
        via:
          type: string
          description: |
            Which door in the office the message left by: the id
            of the facility on the SENDING node whose outbox the node daemon
            read it from — `baton.slack` for a letter the Slack relay queued.
            Absent for the occupant's own mail. Stamped by the daemon from the
            directory, never by the process that wrote the letter; the sender
            is still the node's identity, `via` does not change who signed.
            Recorded as stamped — the control plane does not check what the
            node has installed.
        via_isolated:
          type: boolean
          description: |
            What `via` is worth on that node, measured by its daemon when the
            service started: `true` when the service's uid differs from the
            runtime's, so only the service could have written into that
            outbox; `false` when they share a uid and `via` is a label. Present
            only beside `via` — `false` is a value, not an absence. An
            inbox policy that holds channel mail may trust the hold only when
            this is `true` (the policy's `channels: hold` setting).
        created_at: { type: string, format: date-time }
        delivered_at:
          type: string
          format: date-time
          description: |
            The transport fact the mailbox words do not carry: the envelope
            reached the node the recipient is bound to.

            **Absent means it has not been handed over** — that is a definition,
            not an inference, and whoever adds a second reason for it to be
            absent changes this sentence first. It is what a recipient's node
            being offline looks like, and the one thing worth seeing when it is.

            There is no `acked_at` beside it. An ack was recorded on the line
            after the delivery it acknowledged and could not occur without it:
            two states that always happen together are one state.
        expires_at:
          type: string
          format: date-time
          description: |
            When the body is cleared. **Retention is finite by default** (7d,
            ceiling 720h) and this field is always present — a message with no
            expiry is how a queue quietly becomes an archive of business
            content nobody chose to keep. Expiry clears the payload and keeps
            the envelope, so "it existed and was delivered" survives without
            its contents surviving with it.
        content_type: { type: string }
        payload_size: { type: integer }
        attachments:
          type: array
          description: |
            The manifest: what this message carries, in the order the sender
            chose. The bytes are not here — fetch one with
            `GET /messages/{message_id}/attachments/{idx}`.

            It is on the ENVELOPE, and that is the point: a listing can show
            that a message carries a file without fetching anything. A reader
            that could learn this only by opening the message would render an
            attachment-bearing message identically to an empty-handed one.

            Absent means none. Every message that has one sends it.
          items: { $ref: '#/components/schemas/AttachmentRef' }















        type:
          type: string
          maxLength: 128
          description: |
            LIVE since migration 0045 (ruling 1 of the 2026-08-21 handover;
            this entry used to say RESERVED and carry `default: message` — no
            default survived: absent means the sender said nothing). An open
            vocabulary — `message`, `request`, `status`, whatever a runtime
            invents — capped at 128 bytes and nothing else.

            BATON DEFINES THE EXECUTION SEMANTICS OF NONE OF THEM. `type:
            request` does not cause the control plane to execute anything; the
            runtime decides, and an unknown type must be forwardable unchanged.
            The day the control plane acts on a type, it has started deciding
            who should do what — and it will look like a routing optimisation.
            `scripts/check-message-type-boundary.sh` in
            `make lint` is what keeps that day from arriving quietly.
        thread_id:
          type: string
          description: |
            A message correlation primitive, and nothing else. It is not a
            workflow, a team, a channel, a project, a memory or a task. A
            runtime may read it as a conversation, as a job, or ignore it;
            BATON does not define its business meaning.

            **It is the root message's own id**, not a separate `th_`
            namespace: querying a thread then returns the root together with
            its replies, and no root has two names for itself. A reply inherits
            the thread of what it answers; anything else starts one and IS its
            own root.

            **Derived by the control plane, never sent by a caller.** A sender
            that could name a thread directly could place a message into a
            conversation it was never part of.
        reply_to:
          type: string
          description: |
            The message this one answers. `thread_id` says these belong to the
            same context; only this says which one is being answered. Together
            they make a message graph rather than a list — a thread alone
            cannot name the message being answered when three are in flight.

            Mail's header is `In-Reply-To`; translating between the two is one
            line in a gateway, and carrying two names for one field inside the
            system would cost more than that line ever will.
        correlation_id:
          type: string
          description: |
            RESERVED (schema only). Distinct from `thread_id`: one thread can
            carry three requests at once. Nothing consumes it in <1.0.
        metadata:
          type: object
          additionalProperties: true
          description: |
            RESERVED (schema only). `source: baton` for an authenticated
            internal message. An imported email or Slack message carries its
            origin and its UNVERIFIED claimed sender here — never in `sender`.
            An external message that renders identically to an internal one is
            a prompt-injection channel, and the recipient is a model that
            cannot tell the difference.

    ConsoleRequest:
      type: object
      required: [command]
      description: |
        A closed set of verbs, and the closedness is the point: the console is
        an audited management face, not a shell. `scripts/check-contract.sh`
        compares this enum against the verb table in `console.go` — a verb the
        server accepts and this enum does not name is drift, in either direction.
      properties:
        command:
          type: string
          enum:
            - status
            - capabilities
            - tasks
            - pause
            - resume
            - restart
            - runtime.pause
            - runtime.resume
            - runtime.restart
            - skills.show
        args: { type: object, additionalProperties: true }
        reason:
          type: string
          description: Shown in the audit trail. Worth filling in.

    Node:
      type: object
      required: [node_id, display_name, roles, status]
      properties:
        node_id: { type: string, format: uuid }
        display_name: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: |
            A set, never a single value. One node may hold both `master` and
            `agent` — that is the ordinary single-machine install, and the
            single-valued field this replaced made it impossible to express.
        master_state:
          type: string
          enum: [active, standby]
          description: |
            A state of the master role. Absent when the node does not hold that
            role. Promotion is a state transition, not a re-creation: the node
            keeps its identity, its certificate and its name.
        status: { $ref: '#/components/schemas/NodeStatus' }
        suspended:
          type: boolean
          description: |
            Whether an operator has paused this member. A second
            axis, not a `status` value: `status` is what the control plane
            observed, this is what somebody decided, and a suspended node also
            goes offline. Always sent — a reader that infers "not suspended"
            from an absent field cannot tell that from a control plane too old
            to know the word.
        suspended_at: { type: string, format: date-time }
        suspend_reason: { type: string }
        suspended_by: { type: string }
        remote_shell:
          type: boolean
          nullable: true
          description: |
            Whether this node allows the operator's remote shell — a per-node
            switch, off by default, that the node itself enforces.
            Three-state and always sent: true = allowed, false = the node
            reported it off, null = the node has never reported it (no hello
            yet). null is not false; a reader shows "allowed / not allowed /
            never said" and pairs it with `connected` rather than rendering a
            never-connected node as shell-forbidden. Node-level, not a runtime
            property — the node is the authority and enforces it; this cached
            value only lets `/pty` fail a forbidden shell fast.
        trust: { $ref: '#/components/schemas/Trust' }
        network:
          type: string
          description: |
            Which network this node is a member of, by the name a person
            calls it (`GET /networks/self` `display_name`; set with
            `POST /networks/self/name`). Founded without a name, a
            network is `local-master`. Not the key in the certificate's SAN
            (`baton://<tenant>/node/<id>`): that stays what it is when the
            network is renamed.
        network_id:
          type: string
          description: |
            The network's stable id (not its display name). Served so a caller
            can join a node to a network object — inbox envelopes carry the id
            while the row shows the name. Empty only when the network row cannot
            be read.
        avatar_thumb:
          nullable: true
          description: The node's avatar thumbnail for a list row — display metadata, not identity; full image at GET /nodes/{id}/avatar. Null when none.
          type: object
          properties:
            content_type: { type: string }
            data_base64: { type: string }
        host_address:
          type: string
          description: |
            Where the node's single outbound WebSocket (the one connection a
            node opens, over mutual TLS; nodes never accept inbound
            connections) reaches this control plane from — set when that channel connects. For a node on
            another host (an AWS box, a colleague's laptop) it is how the
            network addresses it back, and the operator needs to see it; for a
            node on this machine it is a loopback or bridge address and a
            reader may ignore it. Empty until the node has connected. Never
            taken from X-Forwarded-For — a client-settable header must not
            become an address the operator trusts.
        label:
          type: string
          description: |
            The node's editable one-line label — the single field the agent
            settings surface makes changeable (`POST /nodes/{node_id}/label`).
            Distinct from `labels` (the key=value map set at enrolment, which
            carries `driver=`/`host=`): a person edits this, never that. Never
            an address — the agent's @name is the address (a route identity
            that follows the agent between nodes, not a machine account) and
            is not editable. Empty (absent) is normal.

            **Served because it was otherwise only derivable per node.** A
            caller grouping nodes by network had to fetch every node's detail
            to read one field out of a SAN; the value that was cheap to read
            was the CLI's local register, and that one holds the *driver's*
            network name wearing BATON's noun.
        deployment:
          type: string
          enum: [local, self_hosted, baton_cloud]
          description: |
            **Where this node runs, and nothing more.** A deployment fact, not a
            capability axis — a placement label that nothing may branch on: a `cloud` node is not a different kind
            of node and gains nothing a `local` one lacks. Anything that
            branches on this to decide what a node MAY do has read it wrong.

            It was served for weeks without being declared here, which is how a
            consumer ends up hand-copying an enum it cannot derive.
            `scripts/check-contract.sh` does not catch that — it compares routes
            and the console verb table, never the values inside a response —
            and **that is its boundary rather than a defect in it**. Written
            down so that "the drift check is green" is not read as "the contract
            is complete".

            The first attempt to declare it said `[local, cloud]`, taken from
            the one value a live cluster happened to be returning rather than
            from `spi.Deployment.Valid()`. That is the more dangerous direction
            of the same drift: a client generated from the contract would have
            **refused a value the server may legitimately send**. The values
            here are the server's, and `baton_cloud` is the decided spelling —
            these names are fixed and change only by a recorded design
            decision, not by a contract edit that three other places are then
            expected to chase.
        platform: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }



        last_seen_age_sec: { type: integer, nullable: true }
        heartbeat_seq: { type: integer }
        revoked_at: { type: string, format: date-time }
        revoke_reason: { type: string }
        mirror_lag_sec:
          type: number
          description: Standby nodes only. Negative means unknown.
        inflight_calls:
          type: integer
          description: Capability invocations the node reports as in progress.
        uptime_sec:
          type: integer
          description: As reported by the node's own heartbeat.
        workspace:
          allOf: [{ $ref: '#/components/schemas/WorkspaceInfo' }]
          nullable: true
          description: |
            What this node is set up as right now — its workspace. **`null` on a control-plane node,
            and on an agent-node that supervises nothing** — which is a
            legitimate way to run. Always present as a key, so that "no workspace"
            and "the field did not make it into this response" cannot be
            confused.

            That phrase read "no runtime" until 2026-08-16, in the sentence that
            promises this key is never missing — **so the one paragraph a reader
            consults to learn what an absent value means named the wrong noun.**
            It cost a round trip between three people arguing about which word an
            assertion should use, with the answer sitting here in quotation
            marks. The key was renamed from `runtime` to `workspace` on
            2026-08-13 and the nested `name` field was not, so `name` still
            describes a runtime; that half of the rename is real and is not
            papered over here.
        resources:
          allOf: [{ $ref: '#/components/schemas/Resources' }]
          description: |
            Absent until a node has reported a measurement. It is a node-level
            noun even though it arrives on the runtime heartbeat, because a
            ceiling belongs to the machine the runtime runs in.
        inbox:
          allOf: [{ $ref: '#/components/schemas/NodeInbox' }]
          description: |
            Mail this node holds that nothing has collected, reported as an
            observation only, with no threshold, colour or alert.

            **Absent means the node has never reported it** — a daemon older
            than the field, or one that has not beaten since it landed — and
            that is NOT the same as `waiting: 0`. One says nobody can tell you;
            the other says there is none.

    NodeInbox:
      type: object
      required: [waiting]
      description: |
        "Mail arrived and nothing collected it", as an **observation**.

        There is no `stuck` here, no threshold, no colour. How long is too long
        has never been measured in this system, and a number picked by feel
        would turn "we do not know how long is long" into "the system says it is
        fine". Whoever draws a line draws it above this, from these numbers.

        It exists because the daemon's wake-on-mail loop — which re-runs the
        runtime's declared on-message command, with backoff from 5 s up to
        5 min, for as long as mail is waiting — retries forever with no attempt ceiling — deliberately, since a ceiling would
        turn "cannot take it right now" into "never woken again" with nothing
        saying so. The cost of that choice is that a node whose runtime never
        collects its mail looks exactly like an idle one. These two numbers are
        what tell them apart.
      properties:
        waiting:
          type: integer
          description: |
            How many messages sit in this node's mailboxes. Mailboxes are kept
            per identity, and this is the sum over every mailbox on the node.
            `0` is a real answer and is sent.
        oldest_waiting_age_sec:
          type: integer
          description: |
            How long the oldest waiting message has been waiting, in seconds.
            Absent when nothing is waiting.

            **Computed by the control plane**, from the message's `created_at`
            — which the control plane itself minted — and its own clock. The
            node reports the timestamp, never an age: an age computed on the
            node would arrive carrying that node's clock skew plus the transit
            time, and nothing here could separate either from mail that really
            has been waiting a long while.

    WorkspaceInfo:
      type: object
      description: |
        What a node reports about the runtime it supervises.

        `state` and `runtime_status` are deliberately separate, because they are
        different kinds of claim and merging them would let one borrow the
        other's authority: `state` is what the supervisor observes about the
        process, while `runtime_status` is only the runtime's own claim about
        its activity, which BATON cannot verify.
      required: [state, runtime_status]
      properties:
        name: { type: string, description: The runtime's own name, from its spec. }
        type:
          type: string
          description: Runtime family, e.g. `codex`. Advisory; nothing branches on it.
        image: { type: string, description: The agent-node image it started from. }
        enterable:
          type: boolean
          description: |
            Whether an interactive session can reach it. True only when the
            runtime's spec declares `adapter.terminal.tty: true` — whether a
            runtime has a terminal is something its spec declares, not
            something BATON infers. An
            absent declaration is false, so a runtime that never asked to be
            entered does not become enterable by omission.
        skills_mount_path:
          type: string
          description: |
            Where this node can place a skill — `adapter.skills.mountPath` from
            the spec it is running, as the node itself reports it.

            An empty string is a real answer, not a missing one: BATON picks no
            default path on purpose, because another runtime reads another one,
            so a spec may legitimately declare none. Installing a skill on such
            a node is refused with `SKILL_NO_MOUNT_PATH` rather than accepted
            and dropped.

            Read it together with `name`: a node that has never declared a
            runtime has neither, and that is the difference between "cannot
            place a skill" and "nothing knows yet".
        state:
          type: string
          enum: [pending, starting, running, restarting, exited, failed, stopped, paused]
          description: |
            **Observed** — a fact the node daemon read from a process. Empty
            means no runtime is supervised. `paused` is distinct from `stopped`:
            a paused runtime still holds its memory, files, and connections.
        runtime_status:
          type: string
          enum: [not-declared, unknown, idle, working, needs-input, done, errored]
          default: unknown
          description: |
            **Reported** — the runtime's own claim about what it is doing, which
            BATON cannot determine from outside an opaque process; BATON never
            infers it.

            Two of the seven values are silences and they are **not
            interchangeable**. `not-declared` means the runtime's spec declares
            no status bridge, so no claim will ever arrive — that is knowledge,
            a STRUCTURAL absence. `unknown` means a bridge is declared and
            nothing is known right now — a TEMPORAL absence. Folding them
            together makes "it does not support this" indistinguishable from
            "it has not said yet".

            `errored` is the runtime's claim that a ROUND failed; `state:
            failed` is the observation that the PROCESS died. Different facts,
            different words, and a reader should not have to remember which
            field they are reading to tell them apart.

            **Never render a silence as `idle`, and never infer status from CPU
            load.** An unrecognised value is recorded as `unknown` — never as
            `not-declared`, which would assert knowledge on the strength of a
            word that was not understood.

            **This is a claim, and once `status` is not `online` its author is
            unreachable.** A consumer must not render it — or any other
            `runtime_*` field — as a current value for a node that is offline.
        restart_count: { type: integer }
        started_at: { type: string, format: date-time }
        last_exit_code:
          type: integer
          description: |
            128 + signal number for a signalled death, so a SIGKILL is 137.
        oom_killed:
          type: boolean
          description: |
            Set only when the kernel's cgroup counter says so, never inferred
            from the signal — `kill -9`, an escalated stop, and the OOM killer
            are indistinguishable from `waitpid`.
        last_error: { type: string }
        probe:
          type: string
          enum: ['', not-declared, pending, passing, failing]
          default: ''
          description: |
            The health probe's verdict, in BATON's own words.

            **Four of the five are not a pass — which is not the same as
            unhealthy**, and conflating the two produces a renderer that calls a
            perfectly good node broken. `''` is what a node daemon that reports
            nothing sends, `not-declared` means the spec asked for no probe, and
            `pending` means one is declared and has not answered yet.

            **The rule, stated exactly (PM ruling, 2026-08-13 — the CLI's
            implementation is the standard):**

            * The probe may only ever LOWER a rendered health, never raise it.
            * `failing` lowers it. `pending` makes it `starting`.
            * **`not-declared` lowers nothing**: "there was nothing to check" is
              not evidence of a fault, and a workspace that is running with no
              probe declared is a legitimate way to run.
            * A workspace that is NOT running has already lowered the verdict
              before the probe is consulted — so `not-declared` on a dead
              workspace is not green, and that is the state's doing rather than
              the probe's.

            This was first transmitted as *"only `passing` is healthy"*, which
            is the same sentence with one distinction removed, and a consumer
            implemented it that way. **The half that went missing was the one
            that matters**: nothing-to-check on a LIVE process is fine, and on a
            DEAD one it was never the probe that made it not fine.

            Always present as a key, never omitted: an absent field lets a
            reader supply whichever default it prefers, and the default anyone
            reaches for is the reassuring one.

            **It may only lower a rendered health, never raise it.**

    Resources:
      type: object
      description: |
        What a node is actually running under, **as measured on the node** —
        never echoed back from the spec that requested it.

        That distinction is the point of this object. A limit read back from the
        request proves only that somebody typed it; a limit read from the place
        it took effect is the difference between applying a ceiling and appearing
        to. The node daemon runs inside the very node the ceiling applies to, so
        it is the only component positioned to measure it (v0.2 criterion 4).
      properties:
        memory:
          type: string
          description: |
            BATON's quantity notation (`2Gi`, `512Mi`), or the literal
            `unlimited` when there is no ceiling.

            **Absent means the measurement could not be taken, which is not
            `unlimited`.** Rendering the first as the second is the same defect
            as rendering an unreported probe as passing (CLAUDE.md rule 7).

            Never the engine's own spelling — a raw byte count is a driver's way
            of writing a number the operator wrote as `2Gi`, and v0.1 criterion 3
            forbids driver strings reaching an operator.

    TakeoverLock:
      type: object
      description: Who holds interactive control of a node's runtime, and until when.
      required: [node_id, holder, session_id, acquired_at, expires_at]
      properties:
        node_id: { type: string, format: uuid }
        holder:
          type: string
          description: The operator's certificate subject.
        session_id: { type: string }
        acquired_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            The lease expiry. A takeover is leased rather than held so that a
            dropped connection frees the node in about a minute instead of
            forever.
        renew_within_sec:
          type: integer
          description: |
            How long a client may go between renewals before losing the lock.
            The server decides this so the interval is not a constant duplicated
            in every client.
        preempted_from:
          type: string
          description: |
            The previous holder, when the lock was taken from someone still live
            rather than picked up after a lapse. Preemption is a different act
            from acquisition.

    NodeDetail:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          properties:
            certificate: { $ref: '#/components/schemas/Certificate' }
            capabilities:
              type: array
              items: { $ref: '#/components/schemas/Capability' }
            recent_events:
              type: array
              items: { $ref: '#/components/schemas/Event' }

    Certificate:
      type: object
      properties:
        serial: { type: string }
        fingerprint_sha256: { type: string }
        san_uri:
          type: string
          example: baton://default/node/1f6c.../role/agent
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    Capability:
      type: object
      required: [id, node_id, name, version, risk]
      properties:
        id: { type: string }
        node_id: { type: string }
        name: { type: string, example: sys.echo }
        version: { type: string, example: 1.0.0 }
        risk:
          type: string
          enum: [low, confirm, blocked]
        input_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        allow_from:
          type: array
          items: { type: string }
          description: Origins permitted to invoke — local, mailloop-cloud, or a named agent.
        health: { type: string }
        revoked:
          nullable: true
          description: |
            The operator decision, or null when there is none — and the key is
            always present, so "absent" and "null" are not two spellings of one
            fact. `by` is empty for decisions recorded before this API carried
            who made them; empty says so rather than naming somebody.
          type: object
          properties:
            at: { type: string, format: date-time }
            by: { type: string }
        last_call_at: { type: string, format: date-time }

    TokenInfo:
      type: object
      description: Token metadata. The plaintext is never included.
      properties:
        token_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    EnrollRequest:
      type: object
      required: [token, csr_pem, display_name, role, client_ts]
      properties:
        token: { type: string }
        csr_pem:
          type: string
          description: PEM CSR. The corresponding private key never leaves the node.
        display_name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
        role: { $ref: '#/components/schemas/Role' }
        agent_version: { type: string }
        platform: { type: string }
        arch: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        nonce: { type: string }
        client_ts:
          type: string
          format: date-time
          description: |
            The node's clock. More than 120s of skew is rejected — certificate
            validity would otherwise fail later in a way that looks like
            anything but a clock problem.

    EnrollResponse:
      type: object
      required: [node_id, certificate_pem, ca_bundle_pem, control_endpoints]
      properties:
        node_id: { type: string, format: uuid }
        certificate_pem: { type: string }
        ca_bundle_pem: { type: string }
        control_endpoints:
          type: array
          items: { type: string }
          description: |
            All known control plane addresses. The node binds to cluster
            identity, not to whichever address it happened to enroll through.
        cert_not_after: { type: string, format: date-time }
        heartbeat_interval_sec: { type: integer }
        cluster_id: { type: string }
        leader_epoch: { type: integer }

    CallRequest:
      type: object
      required: [capability, idempotency_key]
      properties:
        node_id: { type: string }
        node_name:
          type: string
          description: Alternative to node_id for human-driven callers.
        capability: { type: string }
        version: { type: string }
        input: { type: object, additionalProperties: true }
        idempotency_key: { type: string }
        timeout_sec: { type: integer, default: 30 }

    Call:
      type: object
      required: [call_id, status]
      properties:
        call_id: { type: string }
        node_id: { type: string }
        capability: { type: string }
        version: { type: string }
        status:
          type: string
          enum: [queued, dispatched, succeeded, failed, expired]
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true }
        error_code: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        trace_id: { type: string }

    Event:
      type: object
      required: [seq, event_id, ts, category, event]
      properties:
        seq: { type: integer }
        event_id: { type: string }
        ts: { type: string, format: date-time }
        category:
          type: string
          enum: [audit, system]
          description: |
            `audit` records a decision or an action a principal took, and is what
            an incident review reads. `system` records something the control
            plane observed. Both are in one chain: a log where only some entries
            are hash-linked cannot be verified.
        event:
          type: string
          example: node.enrolled
          description: |
            Dotted, `<object>.<what happened>`. Not exhaustive — a consumer must
            tolerate an unknown name — but every name below is stable once
            published.

            **Enrollment and identity**
            `node.enrolled` · `node.revoked` · `node.offline` ·
            `certificate.rotated` · `token.created` · `token.revoked`

            **The node channel**
            `channel.connected` · `channel.closed` · `channel.goodbye` ·
            `channel.seq_violation` — the last means a replayed frame was seen
            and the connection was closed

            **Capabilities and calls**
            `capability.registered` · `capability.granted` ·
            `capability.revoked` · `call.requested` · `call.created` ·
            `call.dispatched` · `call.succeeded` · `call.complete_failed`

            **Console** — `console.<verb>` for each verb in the closed set, so
            `console.status`, `console.pause`, `console.runtime.restart`, and so
            on, followed by a linked `console.result`. The attempt and the
            outcome are separate records because **an append-only log that
            rewrites its own entries is not one**.

            **Takeover** — `node.takeover.acquired`, or
            `node.takeover.preempted` when `--force` displaced a live holder,
            which is a different act and therefore a different event rather than
            an acquisition carrying a flag. Then `node.takeover.result` linking
            the outcome to the attempt, and `node.takeover.released` when the
            session ends.

            **Web sessions** — `web.session_requested` · `web.session_started`

            **Replication** — `snapshot.served`

            ⚠ **Shell sessions are not audited as required.** The admin shell
            must be audited before it opens and again, with a duration, when it
            closes, but no `node.shell.open` / `node.shell.close` pair is
            emitted: `baton shell` currently records a
            `console.status` instead, and `--yes` records nothing at all. Do not
            rely on shell sessions being in this log until that is fixed.
        actor: { type: string }
        actor_type: { type: string }
        acting_for: { type: string }
        action: { type: string }
        target: { type: string }
        result: { type: string }
        source_ip: { type: string }
        node_id: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        leader_epoch:
          type: integer
          description: |
            Which control plane wrote the record. Stamped so a log spanning a
            failover cannot be read as one uninterrupted story.
        detail: { type: object, additionalProperties: true }
        hash: { type: string }

    JoinRequestState:
      type: string
      description: |
        The life of an agent's application to join, which the master admits or
        denies. `pending → admitted → collected → consumed`;
        `pending → denied`; `pending → expired`. `collected` means the one token
        was handed out; `consumed` means it was redeemed by enrolment.
      enum: [pending, admitted, collected, consumed, denied, expired]
    JoinRequest:
      type: object
      required: [request_id, agent, fingerprint, state, created_at, expires_at]
      properties:
        request_id: { type: string }
        agent: { type: string }
        fingerprint:
          type: string
          description: The applying node's key fingerprint, `SHA256:` + base64 — what an operator compares out of band before admitting.
        from_ip: { type: string, description: Present on the admin face only. }
        state: { $ref: '#/components/schemas/JoinRequestState' }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string }
    NetworkDescriptor:
      type: object
      required: [apiVersion, kind, network_id, identity, endpoints, record]
      properties:
        apiVersion: { type: string }
        kind: { type: string, enum: [NetworkDescriptor] }
        network_id: { type: string }
        display_name: { type: string }
        identity:
          type: object
          required: [public_key, fingerprint]
          properties:
            public_key: { type: string, description: PEM, ed25519 }
            fingerprint: { type: string, description: "SHA256:… over the SPKI DER — what a TXT record's k= names" }
        addresses:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              source: { type: string, enum: [dns, cloud-registry] }
        endpoints:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              port: { type: integer }
              protocol: { type: string }
              priority: { type: integer }
        record:
          type: object
          required: [version, expires_at, payload, signature]
          properties:
            version: { type: integer }
            issued_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            payload: { type: string, description: The exact signed bytes, base64. }
            signature: { type: string, description: base64 ed25519 signature over payload }
        note: { type: string }
    Error:
      type: object
      required: [code, message, request_id, remediation]
      properties:
        code:
          type: string
          example: TOKEN_EXHAUSTED
          description: |
            A stable, machine-branchable cause. Not exhaustive — a client must
            treat an unknown code as the generic case for its HTTP status rather
            than failing — but every code below is stable once published.

            **Enrollment and identity**
            `TOKEN_EXHAUSTED` · `TOKEN_EXPIRED` · `TOKEN_REVOKED` ·
            `NAME_CONFLICT` · `CLOCK_SKEW` · `CSR_INVALID`

            **Authorization**
            `UNAUTHENTICATED` · `FORBIDDEN` · `READONLY_MIRROR` — the last means
            this control plane is a standby and refuses writes, which is normal
            operation and not a failure.

            **Nodes and capabilities**
            `NOT_FOUND` · `NODE_OFFLINE` · `CAPABILITY_NOT_FOUND` ·
            `CAPABILITY_NOT_GRANTED` · `CONFLICT`

            **Takeover**
            `TAKEOVER_HELD` — someone else has control; the message names who
            and since when. `TAKEOVER_LOST` — this session's lease lapsed.
            `NO_RUNTIME` — the node supervises nothing. `RUNTIME_NOT_ENTERABLE`
            — the runtime does not declare `session: tty`, so there is no
            terminal to enter.

            **Request and server**
            `INVALID_ARGUMENT` · `VALIDATION_ERROR` · `AUDIT_UNAVAILABLE` —
            the action was refused because it could not be recorded ·
            `INTERNAL`

            **Decisions** (approving or rejecting a frozen plan) — `PLAN_DIGEST_MISMATCH` (the page was out
            of date) · `PLAN_UNSEEN` (the plan cannot be rendered, so nobody can
            have been shown it) · `TRANSACTION_NOT_PENDING` · `DECISION_SURFACE_REQUIRED`
            (not through the local approval page) · `SELF_DECISION` (the party
            that proposed cannot be the party that decides — the verdict is
            void and the transaction stays pending_approval; ⊘ rejected, which
            would say a person looked at it and said no).

            **Routing** — answered by the catch-all under `/api/`, never by a
            route. `ENDPOINT_MISSING` (404) — no route serves this path under
            any method the server probed (the message lists them): a wrong
            version, a typo, or a control plane older than the client. ⊘ Not
            `NOT_FOUND`, which means a record does not exist on a route that
            does. `METHOD_NOT_ALLOWED` (405) — the path is served, under the
            methods in the `Allow` header.
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
        remediation:
          type: string
          description: |
            What to actually do about it. Required — an error a user cannot act
            on is a defect, not a message.
          example: Create a fresh token with `baton token create --role agent`.

  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: |
        The request body could not be decoded — malformed JSON, or a field
        this contract does not know. Semantic errors in fields the decoder
        accepted are `400 INVALID_ARGUMENT`, from the handler; this layer
        never sees them. (This description used to say "well-formed but
        semantically invalid", which was the 400 layer's job description
        pasted onto the 422.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
