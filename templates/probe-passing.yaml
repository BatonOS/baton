apiVersion: baton.mailloop.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: probe-passing




node:
  vcpu: "0.5"
  memory: "256M"



plugins:
  - id: local.probe-passing
    runtime:



      apiVersion: baton.mailloop.dev/v1alpha1
      kind: AgentRuntime
      package:
        image: batonos/agent:0.1.0-rc.1










        command: ["sleep", "infinity"]
      adapter:
        terminal:
          tty: false
        health:
          probe: exec
          exec: ["/bin/true"]
          intervalSec: 5
      execution:
